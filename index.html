<script>
"use strict";
(function(){
  // ---- config ----
  const POLL_MS = 2000;
  const SWITCHER_MS = 10000;

  // ---- central-app routing (set by boot()) ----
  // MODE: "dir" | "central".  VIEW: "road" | "world-select".
  // API_PREFIX prefixes every road-scoped call: "/api" in dir mode,
  // "/api/r/<id>" for a central road view.
  let MODE = "dir";
  let VIEW = "road";
  let API_PREFIX = "/api";
  let ROADMAP_ID = null;
  let switchEl = null;
  let wsLastRev = null;
  const STATUS = ["locked","available","in_progress","done","blocked"];
  const STATUS_LABEL = {locked:"Locked",available:"Available",in_progress:"In Progress",done:"Done",blocked:"Blocked"};
  const STATUS_ICON  = {locked:"\u{1F512}",available:"▶",in_progress:"⚙",done:"✔",blocked:"✖"};
  const KIND_LABEL   = {task:"Task",explanation:"Explanation",note_to_founder:"Note to Founder",blocker:"Blocker"};
  const ASSET_ICON   = {file:"\u{1F4C4}",url:"\u{1F517}",doc:"\u{1F4D6}",command:"⌨"};
  // Raids (§4) + Roster (§5) status vocabularies.
  const RAID_STATUS_LABEL   = {running:"Running",done:"Done",stalled:"Stalled"};
  const ROSTER_STATUS_LABEL = {active:"Active",idle:"Idle",completed:"Completed",superseded:"Superseded"};
  const ROSTER_DOT = {active:"var(--st-available)",idle:"var(--st-locked)",completed:"var(--st-done)",superseded:"var(--st-locked)"};

  // ---- state ----
  let lastRev = null;
  let state = null;
  // ---- camera (pan+zoom over the unbounded world) ----
  const SCALE_MIN=0.3, SCALE_MAX=2.5;
  let cam={tx:0,ty:0,s:1};   // world->screen: screen = world*s + (tx,ty)
  let camFitted=false;       // has this road's camera been initialised?
  let lastBBox=null;         // world bounding box from the latest layout()
  let camAnim=null, camSaveT=null;
  let suppressClick=false;   // set true after a drag so the trailing click no-ops
  // drawer selection: {mode:'milestone'|'decisions'|'history', id?}
  let sel = null;
  // plain-english mode (persisted)
  let plainMode = false;
  try{ plainMode = localStorage.getItem("questlog.plainMode")==="1"; }catch{ plainMode=false; }
  const NOPLAIN = '<span class="noplain">(no plain version yet)</span>';

  // ---- dom ----
  const $ = (id)=>document.getElementById(id);
  const mapmount=$("mapmount"), foot=$("foot"), legend=$("legend");
  const drawer=$("drawer"), scrim=$("scrim"), dbody=$("dbody"), dtitle=$("dtitle");
  const gltip=$("gltip");
  const peekEl=$("portalpeek");
  const bubbleEl=$("msbubble");

  // ---- helpers ----
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  // markdown-lite: **bold** `code` bare-URLs line-breaks  (input already escaped)
  function mdlite(raw){
    let s = esc(raw);
    s = s.replace(/`([^`]+)`/g,(m,x)=>"<code>"+x+"</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g,(m,x)=>"<strong>"+x+"</strong>");
    s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]}])/g,(m)=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
    s = s.replace(/\n/g,"<br>");
    return s;
  }
  // descriptive-slot text: in plain mode swap in `plainVal`; if it's empty,
  // keep the normal text and append the "(no plain version yet)" marker.
  // Returns already-rendered inner HTML (or "" when there's nothing to show).
  function descSlot(plainVal, normalVal){
    const p   = (typeof plainVal==="string")  ? plainVal.trim()  : "";
    const nrm = (typeof normalVal==="string") ? normalVal.trim() : "";
    if(plainMode){
      // Wrap a genuine plain substitution so the toggle can flash what changed.
      if(p)   return '<span class="plain-swapped">'+mdlite(plainVal)+'</span>';
      if(nrm) return mdlite(normalVal)+" "+NOPLAIN;
      return "";
    }
    return nrm ? mdlite(normalVal) : "";
  }
  // small ghost button for the founder's "unclear" flag loop
  function unclearBtn(targetType, rec){
    const on=!!(rec && rec.unclear);
    return '<button class="unclear-btn'+(on?" on":"")+'" data-unclear="'+esc(rec.id)+'"'
      +' data-unclear-type="'+esc(targetType)+'" data-unclear-cur="'+(on?"1":"0")+'">'
      +(on?"✓ flagged unclear — tap to clear":"🤔 Unclear")+'</button>';
  }
  // Delete control: the button plus the inline confirm strip it arms. Two steps
  // and NO browser dialog — the house rule for a founder-facing destructive
  // control (see fremoveHTML, where it started). The strip is emitted collapsed
  // and immediately after its button, so the wiring finds it as nextElementSibling.
  function deleteBtn(targetType, rec){
    const title=rec.title||rec.label||rec.id;
    // A doorway milestone: deleting it orphans the child road's origin edge. The
    // registry tolerates that by design (the edge greys out, nothing crashes),
    // but the founder should hear it BEFORE, not read it afterwards.
    const portal=(targetType==="milestone" && portalCardFor(rec.id))
      ? '<div class="fcnote">This one is a doorway into another road. That road stays on disk; only its link back here goes grey.</div>' : '';
    return '<button class="del-btn" type="button" data-del="'+esc(rec.id)+'" data-del-type="'+esc(targetType)+'"'
      +' data-del-title="'+esc(title)+'">🗑 Delete</button>'
      +'<div class="delconfirm" data-delconfirm="'+esc(rec.id)+'">'
      +'<div class="fcq">Delete "'+esc(title)+'"? It leaves the road; history keeps a copy.</div>'
      +'<div class="fca"><button class="btn sm danger" type="button" data-del-yes="'+esc(rec.id)+'">Delete</button>'
      +'<button class="btn sm ghost" type="button" data-del-no="'+esc(rec.id)+'">Keep</button></div>'
      +portal+'</div>';
  }
  function fmtDate(iso){
    if(!iso) return "";
    try{ const d=new Date(iso); if(isNaN(d)) return iso;
      return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
    }catch{ return iso; }
  }
  function fmtDateTime(iso){
    if(!iso) return "";
    try{ const d=new Date(iso); if(isNaN(d)) return iso;
      return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    }catch{ return iso; }
  }
  function pill(status){ return '<span class="pill '+esc(status)+'">'+esc(STATUS_LABEL[status]||status)+'</span>'; }

  // ==================================================================
  // C7 / C3 — THE EVIDENCE PLANE, read-side. A faithful mirror of
  // currency.mjs: same predicates, same order-by-timestamp discipline.
  // DERIVED HERE, NEVER STORED — nothing below is ever sent back to the
  // server, so a rendered value cannot desync from the evidence it came
  // from. The server serves the same values on state.derived; this is the
  // local computation so an expanded child road (whose milestones arrive
  // through a different endpoint) renders identically.
  //
  // HONESTY, binding on every string in here: "claims complete" means the
  // evidence array holds an unretracted, unrefuted finish claim. It does
  // NOT mean verified, and no copy may say it does.
  // ==================================================================
  function evKey(e){ return e ? (e.source+"|"+e.ref+"|"+e.kind) : ""; }
  function evTombstoned(list){
    const dead=new Set();
    for(const e of (Array.isArray(list)?list:[])){
      if(e && e.kind==="retract" && typeof e.tombstonesRef==="string") dead.add(e.tombstonesRef);
    }
    return dead;
  }
  function evLive(list){
    const dead=evTombstoned(list);
    return (Array.isArray(list)?list:[]).filter(e=>e && e.kind!=="retract" && !dead.has(evKey(e)));
  }
  // ORDER COMES FROM TIMESTAMPS, NEVER FILE POSITION.
  function byTs(a,b){ const at=String((a&&a.ts)||""), bt=String((b&&b.ts)||""); return at<bt?-1:(at>bt?1:0); }
  function hasEvidence(m){ return !!(m && Array.isArray(m.evidence) && m.evidence.length>0); }
  function claimsComplete(m){
    const live=evLive(m && m.evidence);
    const fin=live.filter(e=>e.kind==="finish").sort(byTs);
    if(!fin.length) return false;
    const f=fin[fin.length-1];
    for(const e of live){
      if(String(e.ts)<String(f.ts)) continue;
      if(e.kind==="abandon") return false;
      if(e.kind==="verdict" && e.ship===false) return false;
    }
    return true;
  }
  // The two chips, side by side. Deliberately NOT a status pill: different
  // token, different shape, different words.
  function evidenceChips(m){
    let h="";
    if(hasEvidence(m)) h+='<span class="evchip soft" title="This milestone carries observations from runs — that something was claimed, by whom, when. It is not a verdict.">◈ evidenced</span> ';
    if(claimsComplete(m)) h+='<span class="evchip" title="The evidence holds an unretracted, unrefuted finish claim. That is a claim, not a verification — status stays the founder’s call.">claims complete</span> ';
    return h;
  }
  const EV_KIND_LABEL={launch:"launch", finish:"finish", verdict:"verdict", abandon:"abandon", retract:"retract"};
  function evidenceSectionHTML(m){
    const all=(Array.isArray(m&&m.evidence)?m.evidence:[]).slice().sort(byTs);
    let h='<div class="sechead">Evidence ('+all.length+')</div>';
    if(!all.length){
      h+='<div class="empty">No runs have reported against this milestone. That is not a problem — it only means nothing has claimed anything here yet.</div>';
      return h;
    }
    const dead=evTombstoned(all);
    h+='<div class="meta">What runs CLAIMED about this milestone — who said it, when, in their own words. Evidence records the claim; it never asserts the claim is true.</div>';
    for(const e of all){
      const isDead=e.kind!=="retract" && dead.has(evKey(e));
      let kind=EV_KIND_LABEL[e.kind]||e.kind;
      if(e.kind==="verdict") kind+=(e.ship===true?" · ship":" · no ship");
      h+='<div class="evrow'+(isDead?' dead':'')+'">';
      h+='<span class="evts">'+esc(fmtDateTime(e.ts))+'</span>';
      h+='<span class="evsrc">'+esc(e.source||"?")+' · '+esc(kind)+'</span>';
      const claim=(e.kind==="retract")
        ? ('withdrew '+(e.tombstonesRef||"an earlier entry"))
        : (e.claim||'(no words given)');
      h+='<span class="evclaim">'+esc(claim)+'</span>';
      h+='</div>';
    }
    return h;
  }
  // The coverage line (C7). Chores are the escape hatch; counting them out loud
  // is what keeps overuse a founder conversation instead of silent rot.
  function coverageLineHTML(c){
    if(!c || typeof c!=="object") return "";
    const ch=c.chores|0, li=c.linked|0, un=c.unlinked|0;
    let h='<div class="cov-line">Today: <b>'+ch+'</b> chore'+(ch===1?'':'s')+', <b>'+li
      +'</b> linked, <b>'+un+'</b> unlinked.';
    if(un) h+=' An unlinked run named no milestone and no chore flag — questlog noticed it, it did not stop it.';
    else if(ch && ch>li*3) h+=' Chores are the escape hatch; if most work is a chore, the road has stopped describing the work.';
    h+='</div>';
    return h;
  }
  // CONTEXT-1 — a live mirrored status breakdown rendered as chips. Statuses with
  // a zero count are dropped so the row stays readable; an all-zero/absent
  // breakdown renders nothing at all.
  const BREAKDOWN_ORDER=["done","in_progress","available","locked","blocked"];
  function breakdownChips(bd){
    if(!bd || typeof bd!=="object") return "";
    const parts=[];
    for(const k of BREAKDOWN_ORDER){
      const n=bd[k];
      if(!Number.isFinite(n) || n<=0) continue;
      parts.push('<span class="bdchip"><i style="background:var(--st-'+k+')"></i>'
        +n+' '+esc(STATUS_LABEL[k]||k)+'</span>');
    }
    return parts.length?('<div class="bdchips">'+parts.join("")+'</div>'):"";
  }
  // relative age ("3m ago") for raid/roster freshness — never throws.
  function fmtAge(iso){
    if(!iso) return "";
    const t=Date.parse(iso); if(!Number.isFinite(t)) return "";
    let s=Math.floor((Date.now()-t)/1000); if(s<0) s=0;
    if(s<60) return s+"s ago";
    const m=Math.floor(s/60); if(m<60) return m+"m ago";
    const h=Math.floor(m/60); if(h<24) return h+"h ago";
    const d=Math.floor(h/24); return d+"d ago";
  }

  async function api(path,opts){
    const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}, cache:"no-store"}, opts||{}));
    const t = await r.text();
    let j=null; try{ j=t?JSON.parse(t):null; }catch{ j=null; }
    // The parsed body rides along on the error too. Most callers only ever want
    // .message; a 409 from /api/delete carries a structured `dependents` list
    // that the card has to render, and re-reading the response is not an option.
    if(!r.ok){ const e=new Error((j&&(j.message||j.error))||("HTTP "+r.status)); e.status=r.status; e.code=(j&&j.error)||null; e.body=j; throw e; }
    return j;
  }

  // ==================================================================
  // SKINS (§1) — live token swap + road geometry. A skin overrides a subset
  // of the :root tokens on document.documentElement; missing tokens fall back
  // to parchment. The manager (in Settings) previews on hover, applies via
  // POST /api/skins/apply. Parchment == today's exact values → the default
  // render is pixel-identical; only a non-parchment skin sets any override.
  // ==================================================================
  // Road stroke geometry consumed by the SVG road emitters (parchment defaults;
  // a skin's road params override, then a re-render applies the new widths).
  const ROAD = { roadWidthMain:30, roadEdgeWidthMain:40, roadDashArray:"2 16",
                 roadDashOpacity:0.8, roadWidthSide:13, roadEdgeWidthSide:20 };
  const PARCH_ROAD = Object.assign({}, ROAD);
  // Parchment token map + names, filled from GET /api/skins (the server
  // synthesizes the canonical "parchment" skin — the single source of truth).
  let PARCH_TOKENS = null, TOKEN_NAMES = [];
  let ACTIVE_SKIN = "parchment";
  let activeSkinObj = null;   // the applied skin object (revert target)

  function _hx(v){
    if(typeof v!=="string") return null;
    const s=v.trim();
    let m=s.match(/^#([0-9a-fA-F]{3})$/);
    if(m){ const h=m[1]; return [parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)]; }
    m=s.match(/^#([0-9a-fA-F]{6})$/);
    if(m){ const h=m[1]; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
    return null;
  }
  function _hex(rgb){ return "#"+rgb.map(n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0")).join(""); }
  function _mix(a,b,t){ const A=_hx(a),B=_hx(b); if(!A||!B) return a; return _hex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]); }
  function _rgba(a,al){ const A=_hx(a); if(!A) return a; return "rgba("+A[0]+","+A[1]+","+A[2]+","+al+")"; }

  // Derive the non-token "surface" colours from a skin's effective tokens so
  // bar troughs, drawer headers, gold-tint panels, inputs etc. stay coherent
  // under any skin. Only set for a non-parchment skin (parchment uses :root).
  function deriveSurfaces(t){
    const black="#000000";
    return {
      "--surf-track": _mix(t.parch2, t.ink, 0.14),
      "--surf-head1": _mix(t.parch2, t.edge, 0.35),
      "--surf-head2": _mix(t.parch,  t.edge2, 0.30),
      "--surf-legend": _rgba(t.parch2, 0.92),
      "--surf-ghost": _rgba(_mix(t.parch2, t.ink, 0.14), 0.30),
      "--surf-parch-gold": _mix(t.parch3, t.gold, 0.16),
      "--surf-gold-pale":  _mix(t.parch3, t.gold, 0.14),
      "--surf-gold-panel": _mix(t.parch3, t.gold, 0.10),
      "--ink-on-gold": _mix(t["gold-deep"], black, 0.45),
      "--accent-border-deep": _mix(t["gold-deep"], t.ink, 0.30),
      "--btn-dark-hover": _mix(t["header-bg1"], t.ink, 0.25),
      "--chip-built-border": _mix(t["chip-built-bg"], t.ink, 0.22),
      "--surf-input": t.parch3,
    };
  }
  const SURFACE_KEYS = ["--surf-track","--surf-head1","--surf-head2","--surf-legend",
    "--surf-ghost","--surf-parch-gold","--surf-gold-pale","--surf-gold-panel",
    "--ink-on-gold","--accent-border-deep","--btn-dark-hover","--chip-built-border","--surf-input"];

  // Apply a skin object {name, tokens, road} live (no persist). Parchment clears
  // all overrides; a skin sets its tokens (rest fall back) + derived surfaces.
  function applySkin(skin){
    const de=document.documentElement.style;
    const tokens=(skin && skin.tokens && typeof skin.tokens==="object")?skin.tokens:{};
    const isParch=!skin || skin.name==="parchment";
    for(const name of TOKEN_NAMES){
      if(!isParch && tokens[name]!=null) de.setProperty("--"+name, tokens[name]);
      else de.removeProperty("--"+name);
    }
    if(isParch){ for(const k of SURFACE_KEYS) de.removeProperty(k); }
    else {
      const eff=Object.assign({}, PARCH_TOKENS||{}, tokens);
      const surf=deriveSurfaces(eff);
      for(const k of SURFACE_KEYS){ if(surf[k]) de.setProperty(k, surf[k]); else de.removeProperty(k); }
    }
    const rd=(skin && skin.road && typeof skin.road==="object")?skin.road:{};
    Object.assign(ROAD, PARCH_ROAD, rd);
    if(VIEW==="road" && state){ try{ renderMap(); }catch{} }
  }

  // Fetch the active skin at boot and apply it (parchment == no-op override).
  async function loadActiveSkin(){
    let data; try{ data=await api("/api/skins"); }catch{ return; }
    const list=(data && Array.isArray(data.skins))?data.skins:[];
    const parch=list.find(s=>s.name==="parchment");
    if(parch && parch.tokens){ PARCH_TOKENS=parch.tokens; TOKEN_NAMES=Object.keys(parch.tokens); if(parch.road) Object.assign(PARCH_ROAD, parch.road); }
    ACTIVE_SKIN=(data && typeof data.active==="string")?data.active:"parchment";
    const active=list.find(s=>s.name===ACTIVE_SKIN);
    activeSkinObj=active||parch||null;
    if(active && active.name!=="parchment") applySkin(active);
  }

  // ==================================================================
  // GLOSSARY — term matching, underlines, item-description tooltip
  // ==================================================================
  // Built once per state load (rebuilt when rev changes). Two alternation
  // regexes: one case-sensitive (ALL-CAPS surfaces), one case-insensitive.
  let glCsRe=null, glCiRe=null, glCsMap=null, glCiMap=null, glById=null, glBuiltRev=null;
  let glPinned=false, glPinnedId=null;

  function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

  function buildGlossary(){
    glBuiltRev = lastRev;
    glCsRe=glCiRe=glCsMap=glCiMap=glById=null;
    const terms=(state && state.glossary && Array.isArray(state.glossary.terms)) ? state.glossary.terms : [];
    if(!terms.length) return;
    const csMap=Object.create(null), ciMap=Object.create(null), byId=Object.create(null);
    const csS=[], ciS=[];
    for(const e of terms){
      if(!e || !e.id) continue;
      byId[e.id]=e;
      const surfaces=[e.term].concat(Array.isArray(e.aliases)?e.aliases:[]);
      for(const s of surfaces){
        if(typeof s!=="string" || !s) continue;
        // case-sensitive iff the surface has no lowercase letter
        if(/^[^a-z]*$/.test(s)){ if(!(s in csMap)){ csMap[s]=e; csS.push(s); } }
        else { const k=s.toLowerCase(); if(!(k in ciMap)){ ciMap[k]=e; ciS.push(s); } }
      }
    }
    const mk=(list,flags)=>{
      if(!list.length) return null;
      // longest-first so leftmost-longest alternation wins
      const alts=list.slice().sort((a,b)=>b.length-a.length).map(reEsc).join("|");
      return new RegExp("(?<![A-Za-z0-9_])(?:"+alts+")(?![A-Za-z0-9_])", flags);
    };
    glCsRe=mk(csS,"g"); glCiRe=mk(ciS,"gi");
    glCsMap=csMap; glCiMap=ciMap; glById=byId;
  }
  function ensureGlossary(){ if(glBuiltRev!==lastRev) buildGlossary(); }

  const GL_SKIP=new Set(["CODE","A","TEXTAREA","BUTTON","SCRIPT","STYLE","TEXT"]);
  function glSkip(node,root){
    let el=node.parentNode; const stop=root.parentNode;
    while(el && el!==stop){
      if(el.nodeType===1){
        const t=(el.tagName||"").toUpperCase();
        if(GL_SKIP.has(t)) return true;
        if(el.classList && el.classList.contains("gl-term")) return true;
      }
      el=el.parentNode;
    }
    return false;
  }
  function glossarize(root){
    ensureGlossary();
    if(!root || (!glCsRe && !glCiRe)) return;
    const doc=root.ownerDocument||document;
    const walker=doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const targets=[]; let n;
    while((n=walker.nextNode())){
      if(!n.nodeValue || !n.nodeValue.trim()) continue;
      if(glSkip(n,root)) continue;
      targets.push(n);
    }

  function glossarizeTextNode(node,doc){
    const text=node.nodeValue;

    const collect=(re,resolve)=>{
      if(!re) return;
      re.lastIndex=0; let m;
      while((m=re.exec(text))){
        const entry=resolve(m[0]);
        if(entry) matches.push({start:m.index,end:m.index+m[0].length,text:m[0],entry});
        if(m.index===re.lastIndex) re.lastIndex++; // guard against zero-width
      }

    collect(glCsRe,(s)=>glCsMap[s]);
    collect(glCiRe,(s)=>glCiMap[s.toLowerCase()]);
    if(!matches.length) return;
    // leftmost-longest wins, then keep non-overlapping greedily
    matches.sort((a,b)=> a.start-b.start || (b.end-b.start)-(a.end-a.start));
    const kept=[]; let last=-1;
    for(const mm of matches){ if(mm.start>=last){ kept.push(mm); last=mm.end; } }
    if(!kept.length) return;
    const frag=doc.createDocumentFragment();
    let pos=0;
    for(const mm of kept){
      if(mm.start>pos) frag.appendChild(doc.createTextNode(text.slice(pos,mm.start)));
      const span=doc.createElement("span");
      span.className="gl-term";
      span.setAttribute("data-term-id",mm.entry.id);
      span.textContent=mm.text;
      frag.appendChild(span);
      pos=mm.end;
    }
    if(pos<text.length) frag.appendChild(doc.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag,node);
  }

  // ---- tooltip (styled like a 2011 item-description popup) ----
  function showGlTip(span,pin){
    hideBubble();               // glossary tip wins over a hover bubble
    const id=span.getAttribute("data-term-id");
    const e=glById && glById[id];
    if(!e){ hideGlTip(); return; }
    let h='<div class="gltip-term">'+esc(e.term)+'</div>';
    if(e.plain) h+='<div class="gltip-plain">'+esc(e.plain)+'</div>';
    if(e.note)  h+='<div class="gltip-note">'+esc(e.note)+'</div>';
    if(e.link)  h+='<div class="gltip-link"><a href="'+esc(e.link)+'" target="_blank" rel="noopener">'+esc(e.link)+'</a></div>';
    gltip.innerHTML=h;
    gltip.style.display="block";
    gltip.setAttribute("aria-hidden","false");
    glPinned=!!pin; glPinnedId=pin?id:null;
    positionGlTip(span);
  }
  function positionGlTip(span){
    const r=span.getBoundingClientRect();
    const tw=gltip.offsetWidth, th=gltip.offsetHeight;
    const vw=window.innerWidth, vh=window.innerHeight;
    let left=r.left;
    if(left+tw>vw-8) left=vw-8-tw;
    if(left<8) left=8;
    let top=r.bottom+6;
    if(top+th>vh-8) top=r.top-th-6;   // flip above if it would overflow bottom
    if(top<8) top=8;
    gltip.style.left=left+"px"; gltip.style.top=top+"px";
  }
  function hideGlTip(){
    gltip.style.display="none";
    gltip.setAttribute("aria-hidden","true");
    glPinned=false; glPinnedId=null;
  }

  // ==================================================================
  // LAYOUT — compute node positions for the winding road
  //
  // Two phases (dec-layout-collision-engine):
  //   PHASE A  skeleton — the serpentine main road, branch DFS with dir/lane,
  //            and the ideal fan geometry for horizon ghosts. Unchanged from
  //            the original hand-placed layout.
  //   PHASE B  reservation — every drawable claims an AABB (and its incoming
  //            connector claims a sampled polyline) in ONE spatial index, in a
  //            canonical order. Main-road nodes are the immovable spine; a
  //            colliding branch / ghost / injected block is bumped until free.
  // The result satisfies QL_ENGINE.invariant(): no two boxes overlap (4px
  // epsilon) and no connector crosses a foreign box.
  // ==================================================================
  // ==== QL_ENGINE_BEGIN ====  (extracted verbatim by layout-engine.selftest.mjs)
  var QL_ENGINE = (function(){
    "use strict";

    // ---- PHASE A geometry (identical to the pre-engine layout) ----
    var MARGIN_TOP=90, ROW_H=170, MAIN_R=34, SIDE_R=27, SERP=72;
    var SIDE_STEP=150, SIDE_GAP=180, GHOST_R=SIDE_R-4, CENTER_X=450;
    // ---- PHASE B reservation constants ----
    var LABEL_W=168,        // the wrapping title foreignObject under a node
        PAD_TOP=26,         // order / portal badge + portal caption above
        PAD_BOT=52,         // title label below
        EPS=4,              // overlap epsilon (strictly-overlap tolerance)
        STEP_PX=8,          // connector sampling stride
        BUMP_Y=88, Y_GUARD=60,      // first resolution axis
        X_GUARD=40,                 // then x += dir*SIDE_STEP, retry
        RAD_STEP=64, R_GUARD=200,   // fans bump radial distance (last resort only)
        FAN_CAP=1.5,                // a root ray never sits further out than
                                    // FAN_CAP x the fan's own base radius, so
                                    // every alternative reads as a sibling
        FAN_MAX=5, SEQ_MAX=3,
        FAN_SPREAD=35*Math.PI/180,  // +-35 degrees
        BLOCK_PAD=24, BLOCK_GAP=40,
        CELL=128, ROUTE_CANDIDATES=96, ROUTE_SEATS=24;
    // The contract's AABB (168 wide) is WIDER than the legacy 150px chain step,
    // so a horizontal chain of nodes overlaps its own neighbours by 18px before
    // anything else is on the map. Rather than staircase every branch (which is
    // what a naive y-bump does, and a real visual regression), the engine widens
    // the step of a chain to whatever clears one box along that chain's own
    // direction. Purely derived from the box definition — no magic number.
    var GHOST_BOX_W=Math.max(2*GHOST_R+36, LABEL_W), GHOST_BOX_H=2*GHOST_R+PAD_TOP+PAD_BOT;
    function stepAlong(ux,uy,w,h){
      w=(w||LABEL_W)+2*EPS; h=(h||(2*SIDE_R+PAD_TOP+PAD_BOT))+2*EPS;
      var ax=Math.abs(ux), ay=Math.abs(uy);
      var needX = ax>1e-6 ? w/ax : Infinity;
      var needY = ay>1e-6 ? h/ay : Infinity;

    // ---------------- AABB primitives ----------------
    function boxAt(x,y,r){

    }
    function overlaps(a,b){
      return (Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0) > EPS) &&
             (Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0) > EPS);
    }

    }

      var b={x0:Infinity,x1:-Infinity,y0:Infinity,y1:-Infinity};

    // ---------------- connector sampling ----------------
    // The two curve styles the renderer actually emits. Sampling the SAME
    // formula the SVG uses is what makes the predicate a real guarantee.
    function cubic(p0,c1,c2,p1){

    function shiftD(d,dx,dy){

    function linkH(a,b){
      var mx=(a.x+b.x)/2;

              d:"M "+num(a.x)+" "+num(a.y)+" C "+num(mx)+" "+num(a.y)+" "+num(mx)+" "+num(b.y)+

    // ---------------- deterministic comparators ----------------

    // ==================================================================
    // computeLayout(data, opts)
    //   data = {quests, milestones, suggestions, pins}
    //   opts = {expanded: {portalMilestoneId: {quests, milestones}}, depth}
    // ==================================================================
    function computeLayout(data, opts){
      data=data||{}; opts=opts||{};
      var quests=Array.isArray(data.quests)?data.quests:[];
      var milestones=Array.isArray(data.milestones)?data.milestones:[];
      var suggestions=Array.isArray(data.suggestions)?data.suggestions:[];
      var pins=Array.isArray(data.pins)?data.pins:[];

      if(!mainQuest) mainQuest = quests[0]||null;

      var mainMs = milestones.filter(function(m){ return m.questId===mainId; }).slice().sort(byOrderId);

      var pos={};            // milestoneId -> placed node
      var elements=[];       // every drawable AABB (the predicate's universe)
      var connectors=[];     // every drawn polyline
      var blocks=[];         // injected child-road blocks
      var idx=new Index();

      // ---------- PHASE A0 — injection: reserve vertical room BEFORE Phase B ----------
      // An expanded portal inserts extraGap at its main index (for a branch
      // portal, at the main index of its root ancestor), shifting all
      // downstream main y. Reflow, never overdraw.
      var mainIndexOf={}; mainMs.forEach(function(m,i){ mainIndexOf[m.id]=i; });
      // parent chain for branch milestones (built from quests, cheap)
      var questById={}; quests.forEach(function(q){ questById[q.id]=q; });
      var msById={}; milestones.forEach(function(m){ msById[m.id]=m; });
      function rootMainIndex(msId){

          // lands inside the gap is not wedged against the two main nodes that

        var y = MARGIN_TOP + i*ROW_H + acc;
        pos[m.id]={x:x, y:y, r:MAIN_R, kind:"main", milestone:m, idx:i, dir:(x<CENTER_X?-1:1)};
        maxY=Math.max(maxY,y);
      });

      // ---------- PHASE B (main) — the spine claims first, and never moves ----------
      mainMs.forEach(function(m){
        var p=pos[m.id];
        p.box=boxAt(p.x,p.y,p.r);

        idx.addBox(m.id, p.box);
      });
      for(var i=1;i<mainMs.length;i++){

      function elbowLadder(a,b,axis,extraBox){
        var mid=(axis==="x") ? (a.x+b.x)/2 : (a.y+b.y)/2, seen={}, out=[];
        function push(v){ v=Math.round(v*100)/100; if(!seen[v]){ seen[v]=1; out.push(v); } }

          else          { push(bx.y0-EPS-2); push(bx.y1+EPS+2); }

        if(extraBox){
          if(axis==="x"){ push(extraBox.x0-EPS-2); push(extraBox.x1+EPS+2); }
          else          { push(extraBox.y0-EPS-2); push(extraBox.y1+EPS+2); }
