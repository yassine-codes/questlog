      function posLike(id){
        var p=pos[id]; if(p) return {x:p.x,y:p.y};
        return ghostPos[id]||null;
      }
      var ghostPos={};
      function commit(id, kind, r, res, parentId, extra){
        var node={x:res.x, y:res.y, r:r, box:res.box, link:res.link||null};
        if(extra) for(var k in extra) node[k]=extra[k];
        elements.push({id:id, kind:kind, x:res.x, y:res.y, r:r, box:res.box});
        idx.addBox(id, res.box);
        if(res.link && parentId){
          var c={id:"link:"+parentId+">"+id, from:parentId, to:id,
                 pts:res.link.pts, style:res.link.style, d:res.link.d};
          connectors.push(c); idx.addConn(c);
        }
        maxY=Math.max(maxY,res.y);
        return node;
      }

      // ---------- PHASE A2/B — side quests, DFS, nested branching ----------
      var sideQuests=quests.filter(function(q){ return q.type==="side"; });
      var byParent={};
      sideQuests.forEach(function(q){ (byParent[q.parentMilestoneId]=byParent[q.parentMilestoneId]||[]).push(q); });
      Object.keys(byParent).forEach(function(k){ byParent[k].sort(byOrderId); });

      var branches=[], visited={};
      function placeBranchesOf(parentMsId, inheritDir){
        var list=byParent[parentMsId]; if(!list||!list.length) return;
        var pp=pos[parentMsId]; if(!pp) return;
        var sideCounter={left:0,right:0};
        list.forEach(function(q){
          if(visited[q.id]) return; visited[q.id]=1;
          var side = inheritDir!=null ? (inheritDir<0?"left":"right")
                   : ((q.side==="left"||q.side==="right") ? q.side
                      : (sideCounter.left<=sideCounter.right ? "left":"right"));
          var dir = side==="left" ? -1 : 1;
          var lane = sideCounter[side]; sideCounter[side]++;
          var qMs=milestones.filter(function(m){ return m.questId===q.id; }).slice().sort(byOrderId);
          var nodes=[], prevId=parentMsId;
          var chainStep=stepAlong(1,0);   // horizontal chain -> one box wide
          qMs.forEach(function(m,j){
            // UNBOUNDED WORLD: no edge clamp — branches run indefinitely
            // outward; the camera keeps them reachable.
            var res=placeMovable({id:m.id, r:SIDE_R, dir:dir, style:"h",
              ax: pp.x + dir*(SIDE_GAP + j*chainStep),
              ay: pp.y + lane*BUMP_Y + j*6,
              parentId: prevId});
            var node=commit(m.id, "side", SIDE_R, res, prevId,
                            {kind:"side", milestone:m, dir:dir});
            pos[m.id]=node; nodes.push(node); prevId=m.id;
          });
          branches.push({quest:q, side:side, dir:dir, parentPos:pp, nodes:nodes});
          qMs.forEach(function(m){ placeBranchesOf(m.id, dir); });
        });
      }
      mainMs.forEach(function(m){ placeBranchesOf(m.id, null); });

      // ---------- PHASE B — injected child-road blocks at their portals ----------
      // Does this polyline enter a box that is not in the index yet?
      function crossesBox(pts, box){
        if(!box) return false;
        for(var i=0;i<pts.length;i++) if(inside(box, pts[i].x, pts[i].y)) return true;
        return false;
      }
      // The main-road segment that SPANS a reflow gap has to get out of the way
      // of the block the gap was opened for. Returns: null = the straight road
      // already clears it (nothing to do), false = no route exists (so the seat
      // must be rejected), otherwise the replacement route.
      function rerouteSpan(span, blockBox){
        var a=span.a, b=span.b, own=span.own, i;
        function clear(L){ return L && !idx.connHits(L.pts, own) && !crossesBox(L.pts, blockBox); }
        if(clear(linkV(a,b))) return null;
        var lx=elbowLadder(a,b,"x",blockBox);
        for(i=0;i<lx.length;i++){ var Z=linkZ(a,b,lx[i],true);  if(clear(Z)) return Z; }
        var ly=elbowLadder(a,b,"y",blockBox);
        for(i=0;i<ly.length;i++){ var Y=linkZ(a,b,ly[i],false); if(clear(Y)) return Y; }
        return false;
      }
      blockPlan.forEach(function(bp){
        var anchor=pos[bp.portalMsId]; if(!anchor) return;
        var dir = anchor.kind==="main" ? (anchor.x<CENTER_X?-1:1) : (anchor.dir||1);
        // THE GAP THIS BLOCK OPENED. Phase A0 inserted extraGap at main index gi,
        // so the main-road segment main[gi] -> main[gi+1] now runs straight down
        // through the empty room reserved for this very block. Testing seats
        // against it rejected every seat inside the gap and parked the child
        // past the end of the road, leaving the gap blank. So: exempt that one
        // segment while seating, and RE-ROUTE it around the block afterwards —
        // the seat is only accepted if such a route exists.
        var gi=rootMainIndex(bp.portalMsId), span=null;
        if(gi!=null && gi+1<mainMs.length){
          var sa=mainMs[gi].id, sb=mainMs[gi+1].id, so={}; so[sa]=1; so[sb]=1;
          span={id:"road:"+sa+">"+sb, fromId:sa, toId:sb, a:pos[sa], b:pos[sb], own:so};
        }
        // Ideal seat: directly below the portal, inside the gap we just opened —
        // clear of the portal's OWN label box (r+PAD_BOT), not just its circle.
        var ax = anchor.x, ay = anchor.y + anchor.r + PAD_BOT + BLOCK_GAP + bp.h/2;
        var own={}; own[bp.portalMsId]=1;                // its bracket link starts in the portal
        function seatBlock(exemptSpan){
          var bown={};                                   // the block claims fresh space
          if(exemptSpan && span) bown[span.id]=1;        // ...minus the segment that will move
          var got=null, freeSeat=null;
          for(var xi=0; xi<=X_GUARD && !got; xi++){
            for(var yi=0; yi<=Y_GUARD && !got; yi++){
              var x=ax+dir*SIDE_STEP*xi, y=ay+BUMP_Y*yi;
              var box={x0:x-bp.w/2, x1:x+bp.w/2, y0:y-bp.h/2, y1:y+bp.h/2};
              if(idx.boxHits(box, bown)) continue;
              if(!freeSeat) freeSeat={x:x,y:y,box:box};
              var bl=linkH({x:anchor.x,y:anchor.y},{x:x,y:y-bp.h/2});
              if(idx.connHits(bl.pts, own)) continue;
              got={x:x,y:y,box:box,link:bl};
            }
          }
          if(!got && freeSeat){
            var br=routeTo({x:anchor.x,y:anchor.y},{x:freeSeat.x,y:freeSeat.y-bp.h/2}, own);
            if(br) got={x:freeSeat.x, y:freeSeat.y, box:freeSeat.box, link:br};
          }
          return got;
        }
        var settled=null, reroute=null;
        if(span){
          var inGap=seatBlock(true);
          if(inGap){
            var rr=rerouteSpan(span, inGap.box);
            if(rr!==false){ settled=inGap; reroute=rr; }   // rr===null => road already clear
          }
        }
        if(!settled) settled=seatBlock(false);              // the pre-existing search
        if(!settled){
          var fx=ax+dir*SIDE_STEP*(X_GUARD+1), fy=ay+BUMP_Y*(Y_GUARD+1);
          settled={x:fx,y:fy,box:{x0:fx-bp.w/2,x1:fx+bp.w/2,y0:fy-bp.h/2,y1:fy+bp.h/2},
                   link:linkH({x:anchor.x,y:anchor.y},{x:fx,y:fy-bp.h/2})};
        }
        // The container reserves the space; the child's own drawables (already
        // collision-free among themselves) are translated into it and become
        // first-class elements of the parent predicate.
        idx.addBox("block:"+bp.portalMsId, settled.box);
        // Swap the spanning main-road segment for the route that goes around the
        // block, in the index AND in the connector list the renderer draws from.
        if(reroute){
          idx.dropConn(span.id);
          for(var ci=0;ci<connectors.length;ci++) if(connectors[ci].id===span.id){
            connectors[ci].pts=reroute.pts; connectors[ci].style=reroute.style;
            connectors[ci].d=reroute.d; connectors[ci].rerouted=true;
          }
          idx.addConn({id:span.id, from:span.fromId, to:span.toId, pts:reroute.pts});
        }
        var dx=settled.x - (bp.sub.bbox.x + bp.sub.bbox.w/2);
        var dy=settled.y - (bp.sub.bbox.y + bp.sub.bbox.h/2);
        var childEls=bp.sub.elements.map(function(e){
          return {id:"blk:"+bp.portalMsId+":"+e.id, kind:"block-"+e.kind, x:e.x+dx, y:e.y+dy, r:e.r,
                  box:{x0:e.box.x0+dx, x1:e.box.x1+dx, y0:e.box.y0+dy, y1:e.box.y1+dy},
                  blockId:bp.portalMsId};
        });
        childEls.forEach(function(e){ elements.push(e); });
        bp.sub.connectors.forEach(function(c){
          var nc={id:"blk:"+bp.portalMsId+":"+c.id, from:"blk:"+bp.portalMsId+":"+c.from,
                  to:"blk:"+bp.portalMsId+":"+c.to,
                  pts:c.pts.map(function(p){ return {x:p.x+dx, y:p.y+dy}; }), style:c.style,
                  d:shiftD(c.d,dx,dy)};
          connectors.push(nc);
        });
        // The bracket link stops at the container's TOP EDGE — BLOCK_PAD above
        // the highest child box — so it never enters a child's AABB and needs
        // no exemption beyond its own two endpoints.
        var bc={id:"blocklink:"+bp.portalMsId, from:bp.portalMsId,
                to:"block:"+bp.portalMsId, pts:settled.link.pts, style:settled.link.style,
                d:settled.link.d, blockEdge:true};
        connectors.push(bc); idx.addConn(bc);
        blocks.push({portalMsId:bp.portalMsId, x:settled.x, y:settled.y, w:bp.w, h:bp.h,
                     box:settled.box, sub:bp.sub, dx:dx, dy:dy, nodes:childEls});
        maxY=Math.max(maxY, settled.box.y1);
      });

      // ---------- PHASE A3/B — horizon ghosts ----------
      // LEGACY (no branchIndex anywhere in the group): today's single chain past
      // a road-end, capped at 3 — pixel-identical intent, only collisions move.
      // GROUPED (branchIndex present): a fan of up to 5 angular rays beside the
      // anchor, each ray trailing up to 3 sequential children.
      var ghosts=[];
      if(suggestions.length){
        var ends={};   // road-ends (legacy anchors)
        if(mainMs.length){
          var lastM=mainMs[mainMs.length-1];
          ends[lastM.id]={pos:pos[lastM.id], kind:"main", dir:0, baseIdx:mainMs.length-1};
        }
        branches.forEach(function(b){
          if(!b.nodes.length) return;
          var last=b.nodes[b.nodes.length-1];
          ends[last.milestone.id]={pos:last, kind:"side", dir:b.dir, baseIdx:0};
        });
        var groups={};
        suggestions.forEach(function(s){
          if(!s) return;
          var aid=s.frontierMilestoneId;           // name kept for back-compat
          var grouped = (s.branchIndex!=null);
          if(grouped ? !pos[aid] : !ends[aid]) return;
          (groups[aid]=groups[aid]||[]).push(s);
        });
        var anchorIds=Object.keys(groups).sort(function(a,b){
          var pa=pos[a], pb=pos[b];
          return ((pa?pa.y:0)-(pb?pb.y:0)) || cmpId(a,b);
        });
        anchorIds.forEach(function(aid){
          var group=groups[aid];
          var isGrouped=group.some(function(s){ return s.branchIndex!=null; });
          var anchor=pos[aid];
          if(!isGrouped){
            // ---- legacy chain (unchanged geometry, Phase B only resolves overlap)
            var info=ends[aid]; if(!info||!info.pos) return;
            var list=group.slice().sort(byOrderId).slice(0,3);
            var prevId=aid;
            list.forEach(function(sug,g){
              var gx,gy,dir;
              if(info.kind==="main"){
                gx=CENTER_X + (((info.baseIdx+1+g)%2===0) ? -SERP : SERP);
                gy=info.pos.y + (g+1)*ROW_H*0.75;
                dir=(gx<CENTER_X?-1:1);
              } else {
                gx=info.pos.x + info.dir*stepAlong(1,0,GHOST_BOX_W,GHOST_BOX_H)*(g+1);
                gy=info.pos.y + g*6;
                dir=info.dir||1;
              }
              var gid="ghost:"+(sug.id||(aid+":"+g));
              var res=placeMovable({id:gid, r:GHOST_R, dir:dir, ax:gx, ay:gy, parentId:prevId});
              var pv=posLike(prevId)||{x:res.x,y:res.y};
              var gh={x:res.x, y:res.y, r:GHOST_R, sug:sug, box:res.box,
                      fromPos:{x:pv.x, y:pv.y}, role:g===0?"parallel":"sequential",
                      branchIndex:0, seqIndex:g, anchorId:aid,
                      d:res.link?res.link.d:null, linkStyle:res.link?res.link.style:"h"};
              commit(gid, "ghost", GHOST_R, res, prevId);
              ghostPos[gid]={x:res.x,y:res.y};
              ghosts.push(gh); prevId=gid;
            });
            return;
          }
          // ---- grouped fan: rays beside the anchor -------------------------
          if(!anchor) return;
          var rays={};
          group.forEach(function(s){
            var bi=Math.max(0, Math.min(FAN_MAX-1, s.branchIndex|0));
            (rays[bi]=rays[bi]||[]).push(s);
          });
          var rayKeys=Object.keys(rays).map(Number).sort(function(a,b){return a-b;}).slice(0,FAN_MAX);
          var n=rayKeys.length;
          var base = anchor.kind==="main" ? (anchor.x<CENTER_X?-1:1) : (anchor.dir||1);
          // FAN BASE RADIUS — n rays share a 70-degree wedge, so neighbouring
          // rays are only 2*R*sin(dTheta/2) apart. Start the whole fan at the
          // radius where that chord already clears one box, so the rays are a
          // true fan (all roots equidistant) instead of a spiral produced by
          // bumping each ray past the previous one.
          var fanBase=SIDE_GAP;
          if(n>1){
            var dTheta=(2*FAN_SPREAD)/(n-1);
            fanBase=Math.max(SIDE_GAP, (GHOST_BOX_W+2*EPS)/(2*Math.sin(dTheta/2)));
          }
          // ---- ANGULAR SLOT LADDER (the fix for exiled rays) -----------------
          // A blocked ray is RE-SEATED into a free angular slot BEFORE its radius
          // is ever increased. Marching outward alone is what pushed one
          // alternative 40x further out than its siblings: a ray whose fixed
          // heading pointed through an existing branch kept stepping radially
          // (up to R_GUARD*RAD_STEP = 12,800px) until it cleared everything, and
          // stopped reading as an alternative at all.
          // One slot = the angle at which two ghost boxes clear each other at
          // this fan's own base radius — the very number that defines fanBase —
          // so the ladder walks the whole circle in box-sized steps: first
          // widening the wedge (+-1, +-2 ...), then, past a quarter turn, over
          // onto the serpentine's other side. m===0 is byte-identical to the old
          // heading, so an unobstructed fan is pixel-for-pixel what it was.
          var slotA = 2*Math.asin(Math.min(1, (GHOST_BOX_W+2*EPS)/(2*fanBase)));
          var slotN = Math.max(1, Math.ceil(2*Math.PI/slotA));
          var slotLadder=[0];
          for(var sm=1; sm<=slotN; sm++){ slotLadder.push(sm); slotLadder.push(-sm); }
          // Radius tiers. A root may not exceed FAN_CAP x fanBase, so every root
          // of a fan lives in [fanBase, FAN_CAP*fanBase] and the worst spread
          // ratio inside one fan is FAN_CAP by construction. The wider tiers
          // exist only so a pathological map still gets a seat before the
          // legacy march is even considered.
          var capLadder=[FAN_CAP, 3, 6];
          rayKeys.forEach(function(bi,k){
            var theta = n===1 ? 0 : (-FAN_SPREAD + (2*FAN_SPREAD)*k/(n-1));
            var chain=rays[bi].slice().sort(function(a,b){
              return ((a.seqIndex|0)-(b.seqIndex|0)) || ((a.order||0)-(b.order||0)) || cmpId(a.id||"",b.id||"");
            }).slice(0,SEQ_MAX+1);
            // The whole ray (root + its <=3 sequential children) is reserved as
            // one corridor so a later ray can never land inside it; a collision
            // moves the entire chain together, keeping it straight.
            var own={}, bown={}; own[aid]=1;
            chain.forEach(function(s,j){ var g="ghost:"+(s.id||(aid+":"+bi+":"+j)); own[g]=1; bown[g]=1; });
            // heading for slot m (m===0 == the ideal heading, bit-for-bit)
            function unitOf(m){
              if(m===0) return {ux:base*Math.cos(theta), uy:Math.sin(theta)};
              var phi=(base>0?theta:Math.PI-theta) + m*slotA;
              return {ux:Math.cos(phi), uy:Math.sin(phi)};
            }
            // one whole ray at one (heading, root radius); null if it does not fit
            function tryRay(u, R0, elbow){
              var raySeq=stepAlong(u.ux,u.uy,GHOST_BOX_W,GHOST_BOX_H);
              var cand=[], prev={x:anchor.x,y:anchor.y};
              for(var j=0;j<chain.length;j++){
                var R=R0 + j*raySeq;
                var gx=anchor.x+u.ux*R, gy=anchor.y+u.uy*R;
                var box=boxAt(gx,gy,GHOST_R);
                if(idx.boxHits(box, bown)) return null;
                for(var q2=0;q2<cand.length;q2++) if(overlaps(box,cand[q2].box)) return null;
                var lk = elbow ? routeTo(prev,{x:gx,y:gy},own) : linkH(prev,{x:gx,y:gy});
                if(!lk || (!elbow && idx.connHits(lk.pts, own))) return null;
                cand.push({x:gx,y:gy,box:box,link:lk});
                prev={x:gx,y:gy};
              }
              return cand.length===chain.length ? cand : null;
            }
            // Search order, nearest-and-straightest first: for each radius tier,
            // the native curve across every angular slot, then the elbow router
            // across every angular slot, and only then a bigger radius.
            var settled=null;
            for(var ci=0; ci<capLadder.length && !settled; ci++){
              var capR=capLadder[ci]*fanBase;
              for(var pass=0; pass<2 && !settled; pass++){
                for(var ri=0; !settled; ri++){
                  var R0=fanBase + ri*RAD_STEP;
                  if(ri>0 && R0>capR) break;
                  for(var si=0; si<slotLadder.length && !settled; si++){
                    settled = tryRay(unitOf(slotLadder[si]), R0, pass===1);
                  }
                }
              }
            }
            if(!settled){
              // Safety net only (a full circle at three radius tiers has never
              // been exhausted): the original unbounded radial march.
              for(var p2=0; p2<2 && !settled; p2++)
                for(var r2=0; r2<=R_GUARD && !settled; r2++)
                  settled = tryRay(unitOf(0), fanBase+r2*RAD_STEP, p2===1);
            }
            if(!settled){
              var u0=unitOf(0), rs0=stepAlong(u0.ux,u0.uy,GHOST_BOX_W,GHOST_BOX_H);
              settled=[]; var pv2={x:anchor.x,y:anchor.y};
              for(var j2=0;j2<chain.length;j2++){
                var RR=fanBase + (R_GUARD+1)*RAD_STEP + j2*rs0;
                var gx2=anchor.x+u0.ux*RR, gy2=anchor.y+u0.uy*RR;
                settled.push({x:gx2,y:gy2,box:boxAt(gx2,gy2,GHOST_R),link:linkH(pv2,{x:gx2,y:gy2})});
                pv2={x:gx2,y:gy2};
              }
            }
            var prevId2=aid;
            chain.forEach(function(sug,j){
              var gid="ghost:"+(sug.id||(aid+":"+bi+":"+j));
              var res=settled[j];
              var pv3=posLike(prevId2)||{x:res.x,y:res.y};
              var gh={x:res.x, y:res.y, r:GHOST_R, sug:sug, box:res.box,
                      fromPos:{x:pv3.x, y:pv3.y}, role:j===0?"parallel":"sequential",
                      branchIndex:bi, seqIndex:j, anchorId:aid, dir:base,
                      d:res.link?res.link.d:null, linkStyle:res.link?res.link.style:"h"};
              commit(gid, "ghost", GHOST_R, res, prevId2);
              ghostPos[gid]={x:res.x,y:res.y};
              ghosts.push(gh); prevId2=gid;
            });
          });
        });
      }

      // ---------- world bbox (derived from the final boxes, never fixed) ----------
      var minX=Infinity,maxX=-Infinity,minY=Infinity,maxYb=-Infinity;
      elements.forEach(function(e){
        if(e.box.x0<minX)minX=e.box.x0; if(e.box.x1>maxX)maxX=e.box.x1;
        if(e.box.y0<minY)minY=e.box.y0; if(e.box.y1>maxYb)maxYb=e.box.y1;
      });
      if(!isFinite(minX)){ minX=350; maxX=550; minY=40; maxYb=260; }
      var bbox={x:minX, y:minY, w:Math.max(maxX-minX,1), h:Math.max(maxYb-minY,1)};

      return {mainQuest:mainQuest, mainMs:mainMs, pos:pos, branches:branches, ghosts:ghosts,
              pins:pins, maxY:maxY+120, bbox:bbox,
              elements:elements, connectors:connectors, blocks:blocks};
    }

    // ==================================================================
    // OVERLAP PREDICATE — the selftest assertion.
    //   (a) no two element AABBs strictly overlap (4px epsilon)
    //   (b) every connector polyline, sampled <=8px, stays outside every AABB
    //       except its own endpoints'
    // ==================================================================
    function invariant(L){
      var v=[];
      if(!L || !Array.isArray(L.elements)) return {ok:false, violations:[{type:"no-layout"}]};
      var els=L.elements;
      for(var i=0;i<els.length;i++) for(var j=i+1;j<els.length;j++){
        if(overlaps(els[i].box, els[j].box)){
          v.push({type:"node-overlap", a:els[i].id, b:els[j].id,
                  ax:els[i].x, ay:els[i].y, bx:els[j].x, by:els[j].y});
        }
      }
      var conns=Array.isArray(L.connectors)?L.connectors:[];
      for(var c=0;c<conns.length;c++){
        var co=conns[c], bb=boxOfPts(co.pts);
        for(var e=0;e<els.length;e++){
          var el=els[e];
          if(el.id===co.from || el.id===co.to) continue;
          if(el.box.x1<bb.x0 || el.box.x0>bb.x1 || el.box.y1<bb.y0 || el.box.y0>bb.y1) continue;
          for(var p=0;p<co.pts.length;p++){
            if(inside(el.box, co.pts[p].x, co.pts[p].y)){
              v.push({type:"connector-crosses-node", conn:co.id, node:el.id,
                      at:{x:co.pts[p].x, y:co.pts[p].y}});
              break;
            }
          }
        }
      }
      return {ok:v.length===0, violations:v};
    }

    return {
      compute:computeLayout, invariant:invariant,
      boxAt:boxAt, overlaps:overlaps, inside:inside,
      K:{MARGIN_TOP:MARGIN_TOP, ROW_H:ROW_H, MAIN_R:MAIN_R, SIDE_R:SIDE_R, SERP:SERP,
         SIDE_STEP:SIDE_STEP, SIDE_GAP:SIDE_GAP, GHOST_R:GHOST_R, CENTER_X:CENTER_X,
         LABEL_W:LABEL_W, EPS:EPS, STEP_PX:STEP_PX, FAN_MAX:FAN_MAX, SEQ_MAX:SEQ_MAX}
    };
  })();
  // ==== QL_ENGINE_END ====

  // ==================================================================
  // FEATURE LOGIC that is NOT geometry — kept pure and marker-delimited so the
  // selftest can run it in node with no DOM. Every position on the map still
  // comes from QL_ENGINE; nothing here places anything.
  //   * reanchor()  — dec-horizon-tree §3: a fan tagged to a PORTAL milestone
  //     is re-pointed AT RENDER TIME to the last real milestone of that quest
  //     (a doorway is not a frontier). The bytes on disk are never rewritten.
  //   * the expanded-portal set (localStorage only, never a data file)
  //   * camera bookkeeping for expand / collapse (pure arithmetic)
  // ==== QL_FEAT_BEGIN ====  (extracted verbatim by features.selftest.mjs)
  var QL_FEAT = (function(){
    "use strict";
    function isIn(set, id){
      if(!set) return false;
      if(typeof set.has === "function") return set.has(id);
      return set[id] === true;
    }
    function cmpId(a,b){ return a<b?-1:a>b?1:0; }

    // ---- §3 portal oddity: horizons never hang off a doorway ----------------
    // Returns a NEW array (inputs untouched). A suggestion anchored at a portal
    // milestone moves to the last real (non-portal) milestone of that portal's
    // quest. If that quest is NOTHING BUT the doorway — which is exactly what a
    // promoted side quest collapses to — it walks UP instead, to the milestone
    // the doorway's quest hangs off, so grounded founder content is still drawn
    // somewhere real. It only disappears when there is no real milestone
    // anywhere up the chain, and the drawer's count is computed from this same
    // list so what is claimed always equals what is drawn.
    function reanchor(suggestions, milestones, portalIds, quests){
      var list = Array.isArray(suggestions) ? suggestions : [];
      if(!list.length) return list.slice();
      var ms = Array.isArray(milestones) ? milestones : [];
      var qs = Array.isArray(quests) ? quests : [];
      var byId = Object.create(null), byQuest = Object.create(null);
      ms.forEach(function(m){
        if(!m || !m.id) return;
        byId[m.id]=m;
        (byQuest[m.questId] = byQuest[m.questId] || []).push(m);
      });
      var questById = Object.create(null);
      qs.forEach(function(q){ if(q && q.id) questById[q.id]=q; });
      var lastReal = Object.create(null);
      Object.keys(byQuest).forEach(function(q){
        var real = byQuest[q].filter(function(m){ return !isIn(portalIds, m.id); })
          .sort(function(a,b){ return ((a.order||0)-(b.order||0)) || cmpId(a.id,b.id); });
        if(real.length) lastReal[q] = real[real.length-1];
      });
      // The doorway's own parent milestone, skipping any doorway it meets.
      function upFrom(msId){
        var cur = msId, guard = 0;
        while(cur && guard++ < 64){
          var m = byId[cur]; if(!m) return null;
          var q = questById[m.questId]; if(!q) return null;
          var p = q.parentMilestoneId;
          if(!p || !byId[p]) return null;
          if(!isIn(portalIds, p)) return byId[p];
          cur = p;
        }
        return null;
      }
      var out=[];
      list.forEach(function(s){
        if(!s) return;
        var aid = s.frontierMilestoneId;
        if(!isIn(portalIds, aid)){ out.push(s); return; }
        var m = byId[aid];
        var target = m ? lastReal[m.questId] : null;
        var viaParent = false;
        if(!target && m){ target = upFrom(aid); viaParent = !!target; }
        if(!target) return;                       // nothing real anywhere up the chain
        var c={}; for(var k in s) c[k]=s[k];
        c.frontierMilestoneId = target.id;
        c.reanchoredFrom = aid;
        if(viaParent) c.reanchoredViaParent = true;   // "behind this door"
        out.push(c);
      });
      return out;
    }

    // ---- expanded portals — localStorage ONLY, never a data file ------------
    function expandKey(roadmapId){ return "questlog.expand."+(roadmapId||"dir"); }
    function loadExpanded(store, roadmapId){
      try{
        var v = JSON.parse(store.getItem(expandKey(roadmapId)) || "[]");
        if(!Array.isArray(v)) return [];
        return v.filter(function(x){ return typeof x === "string" && x; }).sort(cmpId);
      }catch(e){ return []; }
    }
    function saveExpanded(store, roadmapId, ids){
      var v = (Array.isArray(ids)?ids:[]).filter(function(x){ return typeof x==="string" && x; }).slice().sort(cmpId);
      try{ store.setItem(expandKey(roadmapId), JSON.stringify(v)); }catch(e){}
      return v;
    }
    function toggleExpanded(store, roadmapId, id){
      var cur = loadExpanded(store, roadmapId);
      var i = cur.indexOf(id);
      if(i >= 0) cur.splice(i,1); else cur.push(id);
      return saveExpanded(store, roadmapId, cur);
    }

    // ---- camera arithmetic (pure) ------------------------------------------
    function screenOf(cam, wx, wy){ return {x: wx*cam.s + cam.tx, y: wy*cam.s + cam.ty}; }
    // Keep ONE world point nailed to ONE screen point at the current scale —
    // this is what makes an expansion feel like the map opening around the
    // portal instead of jumping.
    function pinTo(cam, wx, wy, sx, sy){
      return {s: cam.s, tx: sx - wx*cam.s, ty: sy - wy*cam.s};
    }
    function unionBox(a, b){
      if(!a) return b; if(!b) return a;
      return {x0: Math.min(a.x0,b.x0), y0: Math.min(a.y0,b.y0),
              x1: Math.max(a.x1,b.x1), y1: Math.max(a.y1,b.y1)};
    }
    function boxToBBox(b, pad){
      pad = pad || 0;
      return {x: b.x0-pad, y: b.y0-pad, w: Math.max(b.x1-b.x0+2*pad,1), h: Math.max(b.y1-b.y0+2*pad,1)};
    }
    // Pre-expand cameras, keyed by portal. Collapse restores exactly what was
    // there before the expansion (a user pan WHILE expanded is still saved by
    // the normal per-road persistence — this only owns the restore point).
    function CamStack(){ this.m = Object.create(null); }
    CamStack.prototype.push = function(key, cam){
      if(this.m[key]) return this.m[key];                 // first save wins
      this.m[key] = {tx:cam.tx, ty:cam.ty, s:cam.s};
      return this.m[key];
    };
    CamStack.prototype.pop = function(key){
      var v = this.m[key] || null; delete this.m[key]; return v;
    };
    CamStack.prototype.has = function(key){ return !!this.m[key]; };

    return {reanchor:reanchor, expandKey:expandKey, loadExpanded:loadExpanded,
            saveExpanded:saveExpanded, toggleExpanded:toggleExpanded,
            screenOf:screenOf, pinTo:pinTo, unionBox:unionBox, boxToBBox:boxToBBox,
            CamStack:CamStack};
  })();
  // ==== QL_FEAT_END ====

  const VIEW_W=900;
  const MARGIN_TOP=QL_ENGINE.K.MARGIN_TOP, ROW_H=QL_ENGINE.K.ROW_H;
  const MAIN_R=QL_ENGINE.K.MAIN_R, SIDE_R=QL_ENGINE.K.SIDE_R, SERP=QL_ENGINE.K.SERP;
  const SIDE_STEP=QL_ENGINE.K.SIDE_STEP, SIDE_GAP=QL_ENGINE.K.SIDE_GAP;

  // Expanded portals (F4). expandedBlocks maps a PORTAL milestone id to the
  // child road's own {quests, milestones}; the engine turns that into a
  // bracketed block and reflows the parent around it. The expanded SET lives in
  // localStorage only — never in a data file.
  let expandedBlocks = Object.create(null);
  let expandPending = Object.create(null);
  let lastLayout = null;
  const camStack = new QL_FEAT.CamStack();

  // Which milestones are doorways into child roads (central mode only).
  function portalIdSet(){
    const s = Object.create(null);
    if(MODE==="central" && Array.isArray(state.portals)){
      for(const pt of state.portals){
        if(pt && pt.milestoneId && !pt.milestoneMissing) s[pt.milestoneId]=true;
      }
    }
    return s;
  }

  // The suggestions the MAP actually draws — raw records with §3 re-anchoring
  // applied. Every count shown to the founder is taken from here, so the drawer
  // can never claim possibilities that no ghost represents.
  function renderedSuggestions(){
    const rm = state.roadmap||{};
    const raw = (state.suggestions && Array.isArray(state.suggestions.suggestions))
                  ? state.suggestions.suggestions : [];
    return QL_FEAT.reanchor(raw, rm.milestones||[], portalIdSet(), rm.quests||[]);
  }

  function layout(){
    const rm = state.roadmap||{};
    // §3 — a fan tagged to a portal re-anchors at the last real milestone of
    // that quest (or, if the quest is only the doorway, at the milestone the
    // doorway hangs off). Render-time only: the file on disk is never rewritten.
    const portals = portalIdSet();
    const suggestions = renderedSuggestions();
    // Only expand portals that are still portals on this road.
    const expanded = Object.create(null);
    for(const pid of Object.keys(expandedBlocks)){
      if(portals[pid] && expandedBlocks[pid]) expanded[pid]=expandedBlocks[pid];
    }
    lastLayout = QL_ENGINE.compute({
      quests: rm.quests||[],
      milestones: rm.milestones||[],
      suggestions,
      pins: (state.pins && state.pins.pins) || [],
    }, {expanded});
    return lastLayout;
  }

  // Testable predicate — window.QL_layoutInvariant(L) -> {ok, violations[]}
  try{
    window.QL_ENGINE = QL_ENGINE;
    window.QL_FEAT = QL_FEAT;
    window.QL_layout = layout;
    window.QL_layoutInvariant = function(L){ return QL_ENGINE.invariant(L || lastLayout || layout()); };
  }catch(e){}

  // The main road is the ENGINE'S OWN reserved path — one "road:" connector per
  // segment, in main order. Normally that is the same smooth vertical cubic it
  // always was; where an expanded child road was injected into the gap, the
  // segment spanning that gap is the elbow the engine routed around the block.
  // Drawing anything else would make the collision predicate a lie.
  function roadPath(L){
    const mainMs=L.mainMs||[], pos=L.pos||{};
    if(mainMs.length===0) return "";
    const byId=Object.create(null);
    for(const c of (L.connectors||[])) if(c && c.d && c.id && c.id.charCodeAt(0)===114 /*r*/
      && c.id.indexOf("road:")===0) byId[c.id]=c;
    const segs=[];
    for(let i=1;i<mainMs.length;i++){
      const c=byId["road:"+mainMs[i-1].id+">"+mainMs[i].id];
      if(c){ segs.push(c.d); continue; }
      const a=pos[mainMs[i-1].id], b=pos[mainMs[i].id];
      if(!a||!b) continue;
      segs.push("M "+a.x+" "+a.y+" C "+a.x+" "+(a.y+ROW_H*0.5)+" "+b.x+" "+(b.y-ROW_H*0.5)+" "+b.x+" "+b.y);
    }
    if(!segs.length){ const p=pos[mainMs[0].id]; return p ? ("M "+p.x+" "+p.y) : ""; }
    return segs.join(" ");
  }

  // ==================================================================
  // CAMERA — pan/zoom over the unbounded world (viewBox=pixels, a single
  // <g id="camroot"> carries the world; its transform IS the camera).
  // ==================================================================
  function camStorageKey(){ return "questlog.cam."+(ROADMAP_ID||"dir"); }
  function saveCam(){
    try{ localStorage.setItem(camStorageKey(), JSON.stringify({tx:cam.tx,ty:cam.ty,s:cam.s})); }catch{}
  }
  function scheduleCamSave(){ if(camSaveT) clearTimeout(camSaveT); camSaveT=setTimeout(saveCam,400); }
  function loadCam(){
    try{
      const v=JSON.parse(localStorage.getItem(camStorageKey())||"null");
      if(v && isFinite(v.tx) && isFinite(v.ty) && isFinite(v.s) && v.s>0) return v;
    }catch{}
    return null;
  }
  function mapSvg(){ return mapmount.querySelector("svg.map"); }
  function camRoot(){ return mapmount.querySelector("#camroot"); }
  function applyCam(){
    const g=camRoot();
    if(g) g.setAttribute("transform","translate("+cam.tx+" "+cam.ty+") scale("+cam.s+")");
  }
  function viewport(){
    const s=mapSvg();
    if(!s) return {w:900,h:600};
    const r=s.getBoundingClientRect();
    return {w:Math.max(r.width,50), h:Math.max(r.height,50)};
  }
  // 1 world unit == 1 css px: keep the viewBox equal to the pixel size so the
  // camroot transform lands on screen exactly (preserveAspectRatio="none").
  function syncViewBox(){
    const s=mapSvg(); if(!s) return;
    const r=s.getBoundingClientRect();
    s.setAttribute("viewBox","0 0 "+Math.max(r.width,50)+" "+Math.max(r.height,50));
  }
  function clampScale(s){ return Math.max(SCALE_MIN, Math.min(SCALE_MAX, s)); }
  // Fit a world bbox into the viewport with padding.
  function computeFit(bbox, vp){
    const pad=52;
    const s=clampScale(Math.min((vp.w-pad*2)/bbox.w, (vp.h-pad*2)/bbox.h));
    return {
      s,
      tx:(vp.w-bbox.w*s)/2 - bbox.x*s,
      ty:(vp.h-bbox.h*s)/2 - bbox.y*s,
    };
  }
  function animateCam(target, ms){
    ms=ms||360;
    if(camAnim){ cancelAnimationFrame(camAnim); camAnim=null; }
    const s0={tx:cam.tx,ty:cam.ty,s:cam.s};
    const t0=performance.now();
    const ease=(u)=> u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
    const step=(now)=>{
      const u=Math.min(1,(now-t0)/ms), e=ease(u);
      cam.tx=s0.tx+(target.tx-s0.tx)*e;
      cam.ty=s0.ty+(target.ty-s0.ty)*e;
      cam.s =s0.s +(target.s -s0.s )*e;
      applyCam();
      if(u<1){ camAnim=requestAnimationFrame(step); }
      else { camAnim=null; saveCam(); }
    };
    camAnim=requestAnimationFrame(step);
  }
  // HOME — animate to fit the entire road.
  function goHome(){
    if(!lastBBox) return;
    hidePeek();
    animateCam(computeFit(lastBBox, viewport()));
  }
  // zoom toward the viewport centre (for the +/- buttons).
  function zoomBy(f){
    const vp=viewport(), px=vp.w/2, py=vp.h/2;
    const wx=(px-cam.tx)/cam.s, wy=(py-cam.ty)/cam.s;
    const ns=clampScale(cam.s*f);
    animateCam({s:ns, tx:px-wx*ns, ty:py-wy*ns}, 160);
  }
  // Wire the pan/drag + wheel-zoom + hover-peek listeners onto a fresh svg.
  function wireCamera(svgEl){
    let dragging=false, moved=false, sx=0, sy=0, startTx=0, startTy=0, ptrId=null;
    svgEl.addEventListener("pointerdown",(e)=>{
      if(e.button!==0 && e.pointerType==="mouse") return;
      dragging=true; moved=false; sx=e.clientX; sy=e.clientY;
      startTx=cam.tx; startTy=cam.ty; ptrId=e.pointerId;
      try{ svgEl.setPointerCapture(ptrId); }catch{}
    });
    svgEl.addEventListener("pointermove",(e)=>{
      if(!dragging) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(!moved && Math.hypot(dx,dy)>5){ moved=true; svgEl.classList.add("grabbing"); hidePeek(); hideBubble(); }
      if(moved){ cam.tx=startTx+dx; cam.ty=startTy+dy; applyCam(); }
    });
    const endDrag=()=>{
      if(!dragging) return;
      dragging=false; svgEl.classList.remove("grabbing");
      if(ptrId!=null){ try{ svgEl.releasePointerCapture(ptrId); }catch{} ptrId=null; }
      if(moved){ suppressClick=true; saveCam(); }   // a drag must not open a card
    };
    svgEl.addEventListener("pointerup",endDrag);
    svgEl.addEventListener("pointercancel",endDrag);
    // ZOOM — wheel toward the pointer, clamped.
    svgEl.addEventListener("wheel",(e)=>{
      e.preventDefault();
      const r=svgEl.getBoundingClientRect();
      const px=e.clientX-r.left, py=e.clientY-r.top;
      const wx=(px-cam.tx)/cam.s, wy=(py-cam.ty)/cam.s;
      const ns=clampScale(cam.s*Math.exp(-e.deltaY*0.0015));
      cam.s=ns; cam.tx=px-wx*ns; cam.ty=py-wy*ns;
      applyCam(); hidePeek(); scheduleCamSave();
    },{passive:false});
    // PORTAL HOVER-PEEK (portal nodes) + MILESTONE HOVER BUBBLE (everything
    // else). A portal node => peek wins, no bubble. A plain milestone or a
    // ghost suggestion => arm the 350ms bubble. Never during a drag.
    svgEl.addEventListener("mouseover",(e)=>{
      if(dragging){ hideBubble(); return; }
      const portal=e.target.closest && e.target.closest("[data-portal-child]");
      if(portal){ showPeek(portal); return; }   // showPeek() already hides the bubble
      const node=e.target.closest && e.target.closest(".node-hit[data-mid],.node-hit[data-sug]");
      if(node) armBubble(node);
    });
    svgEl.addEventListener("mouseout",(e)=>{
      const portal=e.target.closest && e.target.closest("[data-portal-child]");
      if(portal){
        const to=e.relatedTarget;
        if(!(to && to.closest && (to.closest("[data-portal-child]")===portal || to.closest("#portalpeek")))) hidePeek();
        return;
      }
      const node=e.target.closest && e.target.closest(".node-hit[data-mid],.node-hit[data-sug]");
      if(node){
        const to=e.relatedTarget;
        if(to && to.closest && to.closest(".node-hit")===node) return; // still within this node
        if(node===bubbleNode) hideBubble();
      }
    });
    // CLICK — open a card, unless a drag just happened. The portal badge is a
    // toggle, so it is checked BEFORE the card (it sits inside the node group).
    svgEl.addEventListener("click",(e)=>{
      if(suppressClick){ suppressClick=false; return; }
      hideBubble();
      const tg=e.target.closest && e.target.closest("[data-expand]");
      if(tg){ e.stopPropagation(); hidePeek(); toggleExpand(tg.getAttribute("data-expand")); return; }
      const g=e.target.closest("[data-mid],[data-pin]");
      if(!g) return;
      if(g.dataset.mid) openMilestone(g.dataset.mid);
      else if(g.dataset.pin) openPin(g.dataset.pin);
    });
  }

  // ==================================================================
  // PORTAL HOVER-PEEK — read the child road's milestones (titles + status
  // dots) from the existing per-road state endpoint; a peek, not navigation.
  // ==================================================================
  const peekCache=new Map();   // childId -> {name,done,total,items:[{title,status}]}
  let peekChild=null;
  function summarizePeek(st, fallbackName){
    const rm=(st && st.roadmap) || {};
    const quests=Array.isArray(rm.quests)?rm.quests:[];
    const ms=Array.isArray(rm.milestones)?rm.milestones:[];
    const main=quests.find(q=>q.type==="main") || quests[0] || null;
    const mid=main?main.id:null;
    let list=ms.filter(m=>m.questId===mid).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    if(list.length===0) list=ms.slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const done=ms.filter(m=>m.status==="done").length;
    // CONTEXT-1 — the peek carries the same live breakdown + provenance stamp as
    // the portal card, computed from the child road's own state payload.
    const bd={done:0,in_progress:0,available:0,locked:0,blocked:0};
    for(const m of ms){ const k=(m&&m.status)||"locked"; if(k in bd) bd[k]++; }
    return {
      name:(rm.project&&rm.project.name)||fallbackName,
      done, total:ms.length,
      statusBreakdown:bd,
      asOf:(rm.project&&rm.project.updatedAt)||null,
      items:list.map(m=>({title:m.title||m.id, status:m.status||"locked"})),
    };
  }
  function renderPeek(d){
    let h='<div class="pk-head"><span>'+esc(d.name)+'</span><span class="pk-prog">'+d.done+'/'+d.total+'</span></div>';
    h+='<div class="pk-strip">';
    const show=d.items.slice(0,10);
    for(const it of show){
      h+='<div class="pk-item"><span class="pk-dot" style="background:var(--st-'+esc(it.status)+')"></span>'
        +'<span class="pk-t">'+esc(it.title)+'</span></div>';
    }
    h+='</div>';
    if(d.items.length>show.length) h+='<div class="pk-more">+'+(d.items.length-show.length)+' more</div>';
    h+=breakdownChips(d.statusBreakdown);
    h+='<div class="pk-foot">Live from '+esc(d.name)+' · as of '+(d.asOf?esc(fmtDate(d.asOf)):'unknown')+'</div>';
    h+='<div class="pk-foot">peek — click to enter this road</div>';
    peekEl.innerHTML=h;
    peekEl.style.display="block";
    peekEl.setAttribute("aria-hidden","false");
  }
  function positionPeekAt(g){
    const r=g.getBoundingClientRect();
    const pw=peekEl.offsetWidth||210, ph=peekEl.offsetHeight||120;
    let left=r.right+10;
    if(left+pw>window.innerWidth-8) left=r.left-pw-10;
    if(left<8) left=8;
    let top=r.top;
    if(top+ph>window.innerHeight-8) top=window.innerHeight-8-ph;
    if(top<70) top=70;
    peekEl.style.left=left+"px"; peekEl.style.top=top+"px";
  }
  async function showPeek(g){
    if(!peekEl) return;
    hideBubble();               // portal peek wins over a hover bubble
    const childId=g.getAttribute("data-portal-child");
    const name=g.getAttribute("data-portal-name")||childId;
    if(!childId) return;
    peekChild=childId;
    let d=peekCache.get(childId);
    if(d){ renderPeek(d); positionPeekAt(g); return; }
    peekEl.innerHTML='<div class="pk-head"><span>'+esc(name)+'</span></div><div class="pk-load">Loading preview…</div>';
    peekEl.style.display="block"; peekEl.setAttribute("aria-hidden","false");
    positionPeekAt(g);
    try{
      const st=await api("/api/r/"+encodeURIComponent(childId)+"/state");
      d=summarizePeek(st, name);
      peekCache.set(childId, d);
    }catch(err){
      if(peekChild===childId){
        peekEl.innerHTML='<div class="pk-head"><span>'+esc(name)+'</span></div><div class="pk-load">Preview unavailable.</div>';
      }
      return;
    }
    if(peekChild!==childId) return;   // pointer already moved away
    renderPeek(d); positionPeekAt(g);
  }
  function hidePeek(){
    peekChild=null;
    if(peekEl){ peekEl.style.display="none"; peekEl.setAttribute("aria-hidden","true"); }
  }

  // ==================================================================
  // EXPAND IN PLACE (F4, dec-promotion-controls) — a portal opens the child
  // road inline. The expanded SET lives in localStorage; the child's milestones
  // are fetched from the same per-road state endpoint the peek already uses.
  // Placement is 100% the engine's: the block is injected through the extraGap
  // reflow, so the parent moves DOWN around it and nothing is overdrawn.
  // Camera: the portal keeps its screen position, then we ease out to fit
  // portal ∪ block. Collapse restores the pre-expand camera exactly.
  // ==================================================================
  function childBlockPayload(st){
    const rm=(st && st.roadmap) || {};
    return {
      quests: Array.isArray(rm.quests)?rm.quests:[],
      milestones: Array.isArray(rm.milestones)?rm.milestones:[],
      suggestions: [],   // a child's own horizons are its road's business
      pins: [],
    };
  }
  function portalCardFor(msId){
    if(MODE!=="central" || !Array.isArray(state.portals)) return null;
    return state.portals.find(x=>x && x.milestoneId===msId && !x.milestoneMissing) || null;
  }
  function isExpanded(msId){ return !!expandedBlocks[msId]; }
  function restoreExpanded(){
    // Re-open whatever this road had open, once state (and its portals) exist.
    if(!state || !state.roadmap) return;
    const want=QL_FEAT.loadExpanded(localStorage, ROADMAP_ID);
    for(const pid of want){
      if(expandedBlocks[pid] || expandPending[pid]) continue;
      const p=portalCardFor(pid);
      if(!p || !p.childId) continue;
      loadBlock(pid, p.childId, false);
    }
  }
  async function loadBlock(msId, childId, animate){
    expandPending[msId]=true;
    try{
      const st=await api("/api/r/"+encodeURIComponent(childId)+"/state");
      expandedBlocks[msId]=childBlockPayload(st);
    }catch(err){
      delete expandPending[msId];
      // a child that cannot be read must not linger in the saved set
      const cur=QL_FEAT.loadExpanded(localStorage, ROADMAP_ID).filter(x=>x!==msId);
      QL_FEAT.saveExpanded(localStorage, ROADMAP_ID, cur);
      renderMap();
      return false;
    }
    delete expandPending[msId];
    if(animate) expandWithCamera(msId); else renderMap();
    return true;
  }
  // The camera half of an expansion, run AFTER the block is in expandedBlocks.
  function expandWithCamera(msId){
    const before=lastLayout;
    const pBefore=before && before.pos ? before.pos[msId] : null;
    const scr = pBefore ? QL_FEAT.screenOf(cam, pBefore.x, pBefore.y) : null;
    camStack.push(msId, cam);                 // the collapse restore point
    renderMap();                              // engine re-lays out with the block
    const L=lastLayout;
    const pAfter=L && L.pos ? L.pos[msId] : null;
    if(scr && pAfter){                        // portal stays exactly where it was
      const pin=QL_FEAT.pinTo(cam, pAfter.x, pAfter.y, scr.x, scr.y);
      cam.tx=pin.tx; cam.ty=pin.ty; cam.s=pin.s;
      applyCam();
    }
    const blk=(L.blocks||[]).find(b=>b.portalMsId===msId);
    if(blk && pAfter && pAfter.box){
      const box=QL_FEAT.unionBox(pAfter.box, blk.box);
      animateCam(computeFit(QL_FEAT.boxToBBox(box, 24), viewport()));
    }
  }
  function collapseBlock(msId){
    delete expandedBlocks[msId];
    delete expandPending[msId];
    renderMap();
    const back=camStack.pop(msId);
    if(back){ animateCam({tx:back.tx, ty:back.ty, s:back.s}); }
  }
  function toggleExpand(msId){
    if(!msId) return;
    const nowOpen=isExpanded(msId);
    QL_FEAT.toggleExpanded(localStorage, ROADMAP_ID, msId);
    if(nowOpen){ collapseBlock(msId); return; }
    const p=portalCardFor(msId);
    if(!p || !p.childId){
      // not a portal (or its child is gone) — nothing to open
      QL_FEAT.saveExpanded(localStorage, ROADMAP_ID,
        QL_FEAT.loadExpanded(localStorage, ROADMAP_ID).filter(x=>x!==msId));
      return;
    }
    expandPending[msId]=true;
    renderMap();                              // show the "…" badge immediately
    loadBlock(msId, p.childId, true);
  }

  // ==================================================================
  // MILESTONE HOVER BUBBLE — a small card on node hover: the record's plain
  // meaning + status word + owning quest. Layers politely: sits BELOW the
  // portal peek and glossary tip, never coexists with either, is suppressed
  // during a drag, arms after 350ms, and only one shows at a time. Ghost
  // (suggestion) nodes reuse it, showing the plain + "Possibility".
  // Lookup caches are refreshed from the latest layout() in renderMap.
  // ==================================================================
  let bubbleInfo=new Map();   // milestoneId -> {milestone, quest}
  let ghostInfo=new Map();    // suggestionId -> suggestion
  let bubbleArm=null;         // pending 350ms arm timer
  let bubbleNode=null;        // the node el currently armed or shown
  function hideBubble(){
    if(bubbleArm){ clearTimeout(bubbleArm); bubbleArm=null; }
    bubbleNode=null;
    if(bubbleEl){ bubbleEl.style.display="none"; bubbleEl.setAttribute("aria-hidden","true"); }
  }
  function itemDotColor(st){
    if(st==="done")    return "var(--st-done)";
    if(st==="blocked") return "var(--st-blocked)";
    return "var(--st-available)";
  }
  // HOVER stays deliberately thin: the description and nothing else. The full
  // story belongs to the card you get by clicking (renderMilestoneBody), so a
  // glance never competes with the record.
  function bubbleContentFor(g){
    const mid=g.getAttribute("data-mid");
    if(mid){
      const info=bubbleInfo.get(mid); if(!info) return null;
      const m=info.milestone, q=info.quest;
      const plain=(m.plain && m.plain.trim()) ? m.plain : (m.summary||m.title||mid);
      let h='<div class="mb-plain">'+esc(plain)+'</div>';
      h+='<div class="mb-meta"><span class="mb-status">'+esc(STATUS_LABEL[m.status]||m.status||"")+'</span>';
      if(q && q.title) h+='<span class="mb-quest">'+esc(q.title)+'</span>';
      h+='</div>';
      return h;
    }
    const sid=g.getAttribute("data-sug");
    if(sid){
      const s=ghostInfo.get(sid); if(!s) return null;
      const plain=(s.plain && s.plain.trim()) ? s.plain : (s.summary||s.title||"");
      return '<div class="mb-plain">'+esc(plain)+'</div>'
        +'<div class="mb-meta"><span class="mb-status">Possibility</span></div>';
    }
    return null;
  }
  function positionBubbleAt(g){
    const r=g.getBoundingClientRect();
    const bw=bubbleEl.offsetWidth||180, bh=bubbleEl.offsetHeight||60;
    const vw=window.innerWidth, vh=window.innerHeight;
    let left=r.left+r.width/2-bw/2;
    if(left+bw>vw-8) left=vw-8-bw;
    if(left<8) left=8;
    let top=r.bottom+8;
    if(top+bh>vh-8) top=r.top-bh-8;   // flip above if it would overflow bottom
    if(top<8) top=8;
    bubbleEl.style.left=left+"px"; bubbleEl.style.top=top+"px";
  }
  function showBubbleFor(g){
    // a visible glossary tip or portal peek outranks the bubble — never override.
    if(gltip && gltip.style.display==="block"){ hideBubble(); return; }
    if(peekEl && peekEl.style.display==="block"){ hideBubble(); return; }
    const html=bubbleContentFor(g);
    if(!html){ hideBubble(); return; }
    hidePeek(); hideGlTip();          // exactly one hover surface at a time
    bubbleEl.innerHTML=html;
    bubbleEl.style.display="block";
    bubbleEl.setAttribute("aria-hidden","false");
    bubbleNode=g;
    positionBubbleAt(g);
  }
  function armBubble(g){
    if(g===bubbleNode) return;        // already armed/shown for this node
    if(bubbleArm) clearTimeout(bubbleArm);
    bubbleNode=g;
    bubbleArm=setTimeout(()=>{ bubbleArm=null; if(bubbleNode===g) showBubbleFor(g); }, 350);
  }

  // ==================================================================
  // RENDER — SVG map
  // ==================================================================
  function nodeSVG(p, portal){
    const st = p.milestone.status||"locked";
    const color = getComputedStyle(document.documentElement).getPropertyValue("--st-"+st).trim()||"#999";
    const r=p.r, x=p.x, y=p.y;
    const icon=STATUS_ICON[st]||"?";
    const dim = st==="locked" ? ' opacity="0.72"' : '';
    const portalAttrs = (portal && portal.childId)
      ? ' data-portal-child="'+esc(portal.childId)+'" data-portal-name="'+esc(portal.childName||portal.childId)+'"'
      : '';
    let s='<g class="node-hit" data-mid="'+esc(p.milestone.id)+'"'+portalAttrs+dim+'>';
    // outer ring
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+4)+'" fill="var(--node-icon-ink)" stroke="'+color+'" stroke-width="0" opacity="0.0"/>';
    // portal ring — this milestone is a doorway into a child road
    if(portal){
      s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+6)+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="5 5"/>';
    }
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+color+'" stroke="rgba(58,48,28,.55)" stroke-width="3"/>';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r-6)+'" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2"/>';
    // status glyph
    s+='<text x="'+x+'" y="'+(y+r*0.30)+'" text-anchor="middle" font-size="'+(r*0.9)+'" fill="var(--node-icon-ink)" style="pointer-events:none">'+icon+'</text>';
    // portal badge (bottom-left) = the EXPAND-IN-PLACE toggle + child roll-up
    if(portal){
      const bx=x-r*0.82, by=y+r*0.82;
      const isOpen=!!expandedBlocks[p.milestone.id];
      const busy=!!expandPending[p.milestone.id];
      s+='<g class="portal-toggle" data-expand="'+esc(p.milestone.id)+'" data-expand-child="'+esc(portal.childId||"")+'">';
      s+='<circle cx="'+bx+'" cy="'+by+'" r="11" fill="var(--gold-deep)" stroke="var(--node-icon-ink)" stroke-width="1.5"/>';
      s+='<text x="'+bx+'" y="'+(by+4)+'" text-anchor="middle" font-size="12" fill="var(--node-icon-ink)" style="pointer-events:none">'
        +(busy?"…":(isOpen?"⊟":"⧉"))+'</text>';
      s+='<title>'+esc(isOpen?"Collapse this road back into the doorway":"Expand this road here")+'</title>';
      s+='</g>';
      if(portal.progress){
        s+='<text x="'+x+'" y="'+(y-r-9)+'" text-anchor="middle" class="pinlabel">'+esc((portal.childName||"road")+" "+portal.progress.done+"/"+portal.progress.total)+'</text>';
      }
    }
    // order badge (main)
    if(p.kind==="main"){
      const bx=x+r*0.82, by=y-r*0.82;
      s+='<circle cx="'+bx+'" cy="'+by+'" r="11" fill="var(--node-badge-bg)" stroke="var(--node-icon-ink)" stroke-width="1.5"/>';
      s+='<text x="'+bx+'" y="'+(by+3.5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--node-badge-ink)" style="pointer-events:none">'+(p.idx+1)+'</text>';
    }
    // C7 — the evidence badge (bottom-right, inside the node's own box so it can
    // never collide with a neighbour). --evid, never a status colour: this says
    // what was CLAIMED about the milestone, not what the founder judged it to be.
    // Double ring = the evidence holds an unretracted, unrefuted finish claim.
    if(hasEvidence(p.milestone)){
      const cc=claimsComplete(p.milestone);
      const ex=x+r*0.82, ey=y+r*0.82;
      if(cc) s+='<circle cx="'+ex+'" cy="'+ey+'" r="13.5" fill="none" stroke="var(--evid)" stroke-width="2"/>';
      s+='<circle cx="'+ex+'" cy="'+ey+'" r="10" fill="var(--evid)" stroke="var(--evid-ink)" stroke-width="1.5"/>';
      s+='<text x="'+ex+'" y="'+(ey+3.5)+'" text-anchor="middle" font-size="11" fill="var(--evid-ink)" style="pointer-events:none">◈</text>';
      s+='<title>'+esc(cc
        ? "Claims complete — the evidence holds an unretracted, unrefuted finish claim. A claim, not a verification."
        : "Evidenced — runs have reported against this milestone. Evidence records what was claimed, never that it is true.")+'</title>';
    }
    // title label via foreignObject (wraps)
    const lw=168, lh=44;
    const ly=y+r+5;
    s+='<foreignObject x="'+(x-lw/2)+'" y="'+ly+'" width="'+lw+'" height="'+lh+'">'
      +'<div xmlns="http://www.w3.org/1999/xhtml" class="node-title '+p.kind+'">'+esc(p.milestone.title||p.milestone.id)+'</div>'
      +'</foreignObject>';
    s+='</g>';
    return s;
  }

  // A horizon suggestion, drawn as a faint GHOST node past a road-end. Clearly a
  // possibility — no status colour, dashed/translucent, and excluded from every
  // tally by living outside rm.milestones. Mirrors the orphan-ghost idiom.
  // ALTERNATIVES vs CONSEQUENCES (dec-horizon-tree). The geometry already says
  // it — a parallel root fans out BESIDE the anchor, a sequential child trails
  // AFTER its root — and the glyph names it: ‖ parallel, → sequential. A
  // sequential ghost is drawn a touch fainter, so a fan reads root-first.
  function ghostSVG(gh){
    const x=gh.x, y=gh.y, r=gh.r, sug=gh.sug||{};
    const fp=gh.fromPos||{x,y};
    const seq = gh.role==="sequential";
    let s='';
    // dashed faint connector from the previous node/ghost — the engine's own
    // reserved path (curve normally; an elbow where a straight run would cross).
    const midx=(fp.x+x)/2;
    const gd = gh.d || ("M "+fp.x+" "+fp.y+" C "+midx+" "+fp.y+" "+midx+" "+y+" "+x+" "+y);
    s+='<path d="'+gd+'" '
      +'fill="none" stroke="var(--st-locked)" stroke-width="'+(seq?2:2.5)+'" stroke-dasharray="'
      +(seq?"3 6":"6 5")+'" stroke-linecap="round" opacity="'+(seq?0.42:0.5)+'"/>';
    s+='<g class="node-hit ghost-node" data-sug="'+esc(sug.id||"")+'" data-role="'+(seq?"sequential":"parallel")
      +'" opacity="'+(seq?0.46:0.55)+'">';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--parch3)" fill-opacity="0.35" '
      +'stroke="var(--st-locked)" stroke-width="2.5" stroke-dasharray="'+(seq?"3 4":"4 4")+'"/>';
    s+='<text x="'+x+'" y="'+(y+r*0.32)+'" text-anchor="middle" font-size="'+(r*0.9)+'" fill="var(--st-locked)" style="pointer-events:none">✧</text>';
    // role glyph — a small badge INSIDE the node's own box (top-right).
    if(gh.role){
      const bx=x+r*0.86, by=y-r*0.86;
      s+='<circle cx="'+bx+'" cy="'+by+'" r="9" fill="var(--parch3)" stroke="var(--st-locked)" stroke-width="1.5" opacity="0.95"/>';
      s+='<text x="'+bx+'" y="'+(by+3.5)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)" '
        +'style="pointer-events:none">'+(seq?"→":"‖")+'</text>';
    }
    const lw=168, lh=40, ly=y+r+5;
    s+='<foreignObject x="'+(x-lw/2)+'" y="'+ly+'" width="'+lw+'" height="'+lh+'">'
      +'<div xmlns="http://www.w3.org/1999/xhtml" class="node-title ghost-title">'+esc(sug.title||"possibility")+'</div>'
      +'</foreignObject>';
    s+='</g>';
    return s;
  }

  // ---- an EXPANDED child road, drawn inside the block the engine reserved ----
  // Every coordinate here comes from the engine: the block's own box, the
  // sub-layout's positions translated by the block's (dx,dy), and the exact
  // connector paths the engine reserved. Nothing is placed by this function.
  function blockSVG(blk){
    const b=blk.box;
    let s='<g class="expand-block" data-block="'+esc(blk.portalMsId)+'">';
    s+='<rect x="'+b.x0+'" y="'+b.y0+'" width="'+(b.x1-b.x0)+'" height="'+(b.y1-b.y0)+'" rx="14" '
      +'fill="var(--surf-gold-pale)" stroke="var(--gold)" stroke-width="2" stroke-dasharray="7 5" opacity="0.95"/>';
    const sub=blk.sub||{};
    const name=(sub.mainQuest && sub.mainQuest.title) ? sub.mainQuest.title : "child road";
    s+='<text x="'+(b.x0+14)+'" y="'+(b.y0+20)+'" class="questlabel" text-anchor="start">'
      +esc("⧉ "+name+" — expanded in place")+'</text>';
    s+='</g>';
    return s;
  }
  // One child node inside an expanded block. Same look as a real node, visibly
  // borrowed (no data-mid: it belongs to another road, so it never opens THIS
  // road's card; the block header and the portal card are the way in).
  function blockNodeSVG(p, dx, dy){
    const st=p.milestone.status||"locked";
    const color=getComputedStyle(document.documentElement).getPropertyValue("--st-"+st).trim()||"#999";
    const r=p.r, x=p.x+dx, y=p.y+dy;
    const icon=STATUS_ICON[st]||"?";
    let s='<g class="blk-node" opacity="0.92">';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+color+'" stroke="rgba(58,48,28,.55)" stroke-width="2.5"/>';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r-5)+'" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2"/>';
    s+='<text x="'+x+'" y="'+(y+r*0.30)+'" text-anchor="middle" font-size="'+(r*0.9)+'" fill="var(--node-icon-ink)" style="pointer-events:none">'+icon+'</text>';
    const lw=168, lh=40, ly=y+r+5;
    s+='<foreignObject x="'+(x-lw/2)+'" y="'+ly+'" width="'+lw+'" height="'+lh+'">'
      +'<div xmlns="http://www.w3.org/1999/xhtml" class="node-title '+p.kind+'">'+esc(p.milestone.title||p.milestone.id)+'</div>'
      +'</foreignObject>';
    s+='</g>';
    return s;
  }

  function renderMap(){
    hideGlTip(); hidePeek(); hideBubble();
    const L=layout();
    lastBBox=L.bbox;
    // refresh hover-bubble lookup caches from this layout
    bubbleInfo=new Map(); ghostInfo=new Map();
    {
      const rm0=state.roadmap||{};
      const qById=new Map((rm0.quests||[]).map(q=>[q.id,q]));
      for(const m of (rm0.milestones||[])) bubbleInfo.set(m.id,{milestone:m, quest:qById.get(m.questId)||null});
      for(const gh of (L.ghosts||[])) if(gh.sug && gh.sug.id) ghostInfo.set(gh.sug.id, gh.sug);
    }
    // The SVG is a fixed pixel viewport; a single <g id="camroot"> holds the
    // whole (unbounded) world and its transform is the camera. viewBox is set
    // to the pixel size after mount so 1 world unit == 1 css px.
    let svg='<svg class="map" preserveAspectRatio="none" role="img" aria-label="Quest road — drag to pan, scroll to zoom">';
    svg+='<g id="camroot">';

    // ---- main road ----
    if(L.mainMs.length>0){
      const d=roadPath(L);
      svg+='<path d="'+d+'" fill="none" stroke="var(--road-edge)" stroke-width="'+ROAD.roadEdgeWidthMain+'" stroke-linecap="round" stroke-linejoin="round"/>';
      svg+='<path d="'+d+'" fill="none" stroke="var(--road)" stroke-width="'+ROAD.roadWidthMain+'" stroke-linecap="round" stroke-linejoin="round"/>';
      svg+='<path d="'+d+'" fill="none" stroke="var(--road-dash)" stroke-width="3" stroke-dasharray="'+esc(ROAD.roadDashArray)+'" stroke-linecap="round" opacity="'+ROAD.roadDashOpacity+'"/>';
    } else {
      svg+='<text x="450" y="140" text-anchor="middle" class="questlabel">No milestones yet — the road awaits.</text>';
    }

    // ---- side-quest spurs ----
    // Each node carries the EXACT path the engine reserved and verified
    // (node.link.d) — normally the same curve as before, an elbow only where a
    // straight run would have crossed another node. Drawing anything else would
    // make the collision predicate a lie.
    for(const b of L.branches){
      if(b.nodes.length===0) continue;
      const first=b.nodes[0];
      const segs=b.nodes.map(n=>n.link&&n.link.d).filter(Boolean);
      const d=segs.join(" ");
      svg+='<path d="'+d+'" fill="none" stroke="var(--road-edge)" stroke-width="'+ROAD.roadEdgeWidthSide+'" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>';
      svg+='<path d="'+d+'" fill="none" stroke="var(--road)" stroke-width="'+ROAD.roadWidthSide+'" stroke-linecap="round" stroke-linejoin="round"/>';
      // quest label near first node
      const lx=(b.parentPos.x+first.x)/2, ly=(b.parentPos.y+first.y)/2-10;
      svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" class="questlabel">'+esc("» "+(b.quest.title||"Side Quest"))+'</text>';
    }

    // ---- pins (compaction markers) ----
    for(const pin of L.pins){
      let px=450, py=MARGIN_TOP-42;
      if(pin.afterMilestoneId && L.pos[pin.afterMilestoneId]){
        const ap=L.pos[pin.afterMilestoneId];
        // sit on the segment just below that milestone
        px=ap.x + (ap.x<450? 46 : -46); py=ap.y + ROW_H*0.5;
      }
      svg+='<g class="node-hit" data-pin="'+esc(pin.id)+'">';
      svg+='<rect x="'+(px-9)+'" y="'+(py-9)+'" width="18" height="18" rx="3" transform="rotate(45 '+px+' '+py+')" fill="var(--parch3)" stroke="var(--gold-deep)" stroke-width="2.5"/>';
      svg+='<text x="'+px+'" y="'+(py+3.5)+'" text-anchor="middle" font-size="11" style="pointer-events:none">⚑</text>';
      svg+='<text x="'+(px)+'" y="'+(py+22)+'" text-anchor="middle" class="pinlabel">'+esc(pin.label||"Compaction")+'</text>';
      svg+='</g>';
    }

    // ---- portal overlay: which milestones are doorways into child roads ----
    const portalByMs=Object.create(null);
    if(MODE==="central" && Array.isArray(state.portals)){
      for(const pt of state.portals){
        if(pt && pt.milestoneId && !pt.milestoneMissing) portalByMs[pt.milestoneId]=pt;
      }
    }

    // ---- expanded child roads: the block frame + its bracket link ----------
    // Drawn UNDER the parent's nodes; every path is the one the engine reserved.
    for(const blk of (L.blocks||[])) svg+=blockSVG(blk);
    for(const c of (L.connectors||[])){
      if(!c || !c.d) continue;
      if(c.blockEdge){
        svg+='<path d="'+c.d+'" fill="none" stroke="var(--gold)" stroke-width="3" '
          +'stroke-dasharray="8 6" stroke-linecap="round" opacity="0.85"/>';
      } else if(String(c.id||"").startsWith("blk:")){
        svg+='<path d="'+c.d+'" fill="none" stroke="var(--road-edge)" stroke-width="'+ROAD.roadEdgeWidthSide+'" stroke-linecap="round" opacity="0.75"/>';
        svg+='<path d="'+c.d+'" fill="none" stroke="var(--road)" stroke-width="'+ROAD.roadWidthSide+'" stroke-linecap="round" opacity="0.9"/>';
      }
    }
    for(const blk of (L.blocks||[])){
      const sub=blk.sub||{};
      const order=[];
      for(const m of (sub.mainMs||[])) if(sub.pos[m.id]) order.push(sub.pos[m.id]);
      for(const b of (sub.branches||[])) for(const n of (b.nodes||[])) order.push(n);
      for(const p of order) svg+=blockNodeSVG(p, blk.dx, blk.dy);
    }

    // ---- nodes on top ----
    for(const m of L.mainMs) svg+=nodeSVG(L.pos[m.id], portalByMs[m.id]);
    for(const b of L.branches) for(const n of b.nodes) svg+=nodeSVG(n, portalByMs[n.milestone.id]);

    // ---- horizon ghosts: faint possibilities past a road-end (never a tally) ----
    for(const gh of (L.ghosts||[])) svg+=ghostSVG(gh);

    svg+='</g></svg>';
    mapmount.innerHTML=svg;

    // glossary underlines on each node title (foreignObject div)
    mapmount.querySelectorAll(".node-title").forEach(glossarize);

    // ---- camera: size the viewBox to pixels, then init (restore or fit) ----
    const svgEl=mapmount.querySelector("svg");
    syncViewBox();
    if(!camFitted){
      const saved=loadCam();
      const init=saved || computeFit(L.bbox, viewport());
      cam.tx=init.tx; cam.ty=init.ty; cam.s=clampScale(init.s);
      camFitted=true;
    }
    applyCam();
    wireCamera(svgEl);
  }

  // ==================================================================
  // RENDER — header + legend
  // ==================================================================
  // Pending work count — mirrors the server dispatch predicates (§1.1/§1.2):
  //   founder notes with pending===true, plus standing unclear flags
  //   (unclear===true && no unclearDispatchId) across milestones, items, decisions.
  function computePending(){
    if(!state) return 0;
    const rm=state.roadmap||{};
    const items=Array.isArray(rm.items)?rm.items:[];
    const milestones=Array.isArray(rm.milestones)?rm.milestones:[];
    const decisions=(state.decisions&&Array.isArray(state.decisions.decisions))?state.decisions.decisions:[];
    let n=0;
    for(const it of items){
      const notes=Array.isArray(it.notes)?it.notes:[];
      for(const nt of notes){ if(nt && nt.author==="founder" && nt.pending===true) n++; }
    }
    for(const r of milestones.concat(items, decisions)){
      if(r && r.unclear===true && !r.unclearDispatchId) n++;
    }
    return n;
  }

  // ==================================================================
  // CONTESTED CHANGES — a colliding write, HELD (founder ruling, 2026-08-27).
  //
  // The server holds a write whose basis is no longer current: it applies it to
  // nothing, discards it with nothing, and hands BOTH versions back. The board's
  // job is the surface — say an argument is open, on the card it is about, and
  // give the founder the two buttons that end it. The STANDING (first) version
  // is what the map and the card keep rendering, so the board stays readable
  // rather than frozen; the held one is named here, never drawn in its place.
  // A warning after the loss would be a receipt, not a decision, so there is
  // not one anywhere in this file.
  // ==================================================================
  function allConflicts(){
    return (state && state.conflicts && Array.isArray(state.conflicts.conflicts)) ? state.conflicts.conflicts : [];
  }
  function contestedOpen(){ return allConflicts().filter(c=>c && c.status==="open"); }
  function contestedSettled(){ return allConflicts().filter(c=>c && c.status!=="open"); }
  function contestedOn(id){ return contestedOpen().filter(c=>c.targetId===id); }

  // The version of a record as the server last served it (GET /api/state serves
  // a version map beside the road, derived and stored nowhere). Every write the
  // board makes carries this, which is what lets the server tell "based on a
  // version that is no longer current" from "two writes happened".
  function baseVersionOf(id){
    const v=(state && state.versions) ? state.versions[id] : null;
    return (typeof v==="string" && v) ? v : undefined;
  }

  // Which fields the two versions actually disagree on. Mirrors conflicts.mjs
  // differingFields — the server cannot hand the browser a module, so the rule
  // is written twice and kept identical on purpose.
  function differingFields(cur, prop){
    if(!cur || typeof cur!=="object" || !prop || typeof prop!=="object") return [];
    const keys=new Set(Object.keys(cur).concat(Object.keys(prop)));
    const out=[];
    for(const k of keys){ if(JSON.stringify(cur[k])!==JSON.stringify(prop[k])) out.push(k); }
    out.sort();
    return out;
  }
  // A field value as prose. Strings show as themselves; everything else shows as
  // the JSON that is actually on disk, because guessing a prettier form of it
  // would misrepresent what the founder is choosing between.
  function cfVal(v){
    if(v===undefined) return "—";
    return (typeof v==="string") ? v : JSON.stringify(v);
  }

  // The line a contested card carries, under its pill row. It does not hide the
  // standing version, it does not block, and it does not decide anything.
  function contestedBlock(id){
    const cs=contestedOn(id);
    if(!cs.length) return '';
    const c=cs[0];
    const what=(c.proposed===null)
      ? 'a request to <b>delete</b> this'
      : (()=>{ const n=differingFields(c.current,c.proposed).length;
               return n+' field'+(n===1?'':'s')+' differ'+(n===1?'s':''); })();
    return '<div class="contested">⚖ Contested change waiting on your ruling: '+what
      +(cs.length>1 ? (' (and '+(cs.length-1)+' more on this one)') : '')
      +' · <a data-open-contested="'+esc(id)+'">view both versions</a></div>';
  }

  // The ruling controls. Two steps and no browser dialog, the same house rule
  // the delete control follows — and kept in ONE function on purpose. The
  // decision log deliberately carries no approval buttons (dec-remove-decision-
  // buttons); these are different, and the difference is worth stating: a held
  // write with no agent present would otherwise wait forever, and a ruling is
  // the founder's own act on their own data, not an approval of an agent's
  // proposal. Rulings can also be given in chat (conflict_resolve). If the
  // founder objects to buttons here, this function is the only thing to remove.
  function conflictActions(cf){
    return '<button class="del-btn" type="button" data-cf-arm="'+esc(cf.id)+'">⚖ Rule on this</button>'
      +'<div class="delconfirm" data-cfconfirm="'+esc(cf.id)+'">'
      +'<div class="fcq">Which version stands? Applying the held version replaces the card with it as shown.</div>'
      +'<div class="fca"><button class="btn sm" type="button" data-cf-keep="current" data-cf-id="'+esc(cf.id)+'">Keep the standing version</button>'
      +'<button class="btn sm danger" type="button" data-cf-keep="held" data-cf-id="'+esc(cf.id)+'">Apply the held version</button></div>'
      +'<div class="fcnote">Either way both versions stay on record, with your ruling written next to them.</div>'
      +'</div>';
  }

  function conflictCard(cf, ruled){
    const title=(cf.current && (cf.current.title||cf.current.term||cf.current.label))||cf.targetId;
    const isDelete=(cf.proposed===null);
    let h='<div class="card'+(ruled?' cf-ruled':'')+'">';
    h+='<div class="ctop"><span class="kind">'+esc(cf.targetType)+'</span>'
      +'<span class="ctitle">'+esc(title)+'</span>'
      +'<span class="pill '+esc(cf.status)+'">'+esc(cf.status)+'</span></div>';
    h+='<div class="meta">'+esc(cf.actor||"agent")+' via '+esc(cf.source||"")+' · '+esc(cf.action||"")
      +' · '+esc(fmtDateTime(cf.ts))+'</div>';
    if(isDelete){
      h+='<div class="body">The held change is a <b>delete</b>. Nothing was removed — applying it runs the '
        +'deletion now, against the road as it stands today.</div>';
    } else {
      const fields=differingFields(cf.current, cf.proposed);
      if(fields.length===0){
        h+='<div class="empty">The two versions are identical. Either ruling leaves the record as it is.</div>';
      } else {
        h+='<table class="cf-cols"><tr><th>Field</th><th>Standing (first write)</th><th>Held (second write)</th></tr>';
        for(const k of fields){
          h+='<tr class="held"><td class="k">'+esc(k)+'</td><td>'+esc(cfVal(cf.current[k]))+'</td>'
            +'<td>'+esc(cfVal(cf.proposed[k]))+'</td></tr>';
        }
        h+='</table>';
      }
    }
    h+='<div class="cf-meta">based on version '+esc(cf.baseVersion||"?")+' · on disk at the time '
      +esc(cf.currentVersion||"?")+'</div>';
    if(ruled){
      const r=cf.ruling;
      h+='<div class="meta">'+(r
        ? ('Ruled '+esc(fmtDateTime(r.ts))+' — '+(r.keep==="held"?'the held version was applied':'the standing version kept'))
        : ('Void — '+esc(cf.voidReason||"the record is gone, so there was nothing left to rule on")))+'</div>';
    } else {
      h+='<div class="unclear-row">'+conflictActions(cf)+'</div>';
    }
    h+='</div>';
    return h;
  }

  function renderConflictsBody(){
    dtitle.textContent="Contested changes";
    const open=contestedOpen(), settled=contestedSettled();
    let h='<div class="meta">When two writers change the same record, the second change is <b>held</b> — '
      +'applied to nothing and discarded by nothing. The first write stands until you rule. '
      +'Both versions are kept either way.</div>';
    if(open.length===0){
      h+='<div class="empty">Nothing is contested. Every change so far was based on the version it landed on.</div>';
    }
    for(const cf of open) h+=conflictCard(cf,false);
    if(settled.length){
      h+='<div class="sechead">Recently ruled</div>';
      for(const cf of settled.slice(-10).reverse()) h+=conflictCard(cf,true);
    }
    dbody.innerHTML=h;
    wireConflictActions();
    glossarize(dbody);
  }

  function openContested(){ sel={mode:"contested"}; renderConflictsBody(); openDrawer(); }

  function renderChrome(){
    const rm=state.roadmap||{}; const pr=rm.project||{};
    $("pname").textContent = pr.name||"Untitled Project";
    $("ptag").textContent = pr.tagline||"";
    document.title = "QUESTLOG — "+(pr.name||"Project");
    const ms=rm.milestones||[];
    const done=ms.filter(m=>m.status==="done").length;
    $("progress").innerHTML='<span class="num">'+done+'</span> / <span class="num">'+ms.length+'</span> milestones';
    // full-story roll-up: this road PLUS everything branching off it (central only)
    const fst=state.fullStory;
    const rEl=$("rollup");
    if(rEl){
      if(MODE==="central" && fst && fst.descendants && (fst.descendants.total>0 || fst.roads>1)){
        const rd=(fst.own.done||0)+(fst.descendants.done||0);
        const rt=(fst.own.total||0)+(fst.descendants.total||0);
        const nr=(typeof fst.roads==="number"?fst.roads:1);
        rEl.style.display="";
        rEl.innerHTML='<span class="num">'+rd+'</span> / <span class="num">'+rt+'</span> incl. '+nr+' road'+(nr===1?'':'s');
      } else { rEl.style.display="none"; }
    }
    // pending work: undispatched founder notes + standing unclear flags (§4.1)
    const pend=computePending();
    const pb=$("pendingBadge"), bd=$("btnDispatch");
    if(pb){
      if(pend>0){ pb.style.display=""; pb.innerHTML='<span class="num">'+pend+'</span> waiting'; }
      else pb.style.display="none";
    }
    if(bd) bd.style.display = pend>0 ? "" : "none";
    // contested work: colliding writes held for a ruling. Nothing was
    // overwritten and nothing was dropped — this is the count still waiting.
    const cont=contestedOpen().length;
    const cbg=$("contestedBadge");
    if(cbg){
      if(cont>0){ cbg.style.display=""; cbg.innerHTML='⚖ <span class="num">'+cont+'</span> contested'; }
      else cbg.style.display="none";
    }
    if(!legend.dataset.built){
      legend.innerHTML = STATUS.map(s=>
        '<span class="lg"><span class="dot" style="background:var(--st-'+s+')"></span>'+esc(STATUS_LABEL[s])+'</span>'
      ).join("");
      legend.dataset.built="1";
    }
    const ev=(state.historyTail&&state.historyTail.length)?state.historyTail[state.historyTail.length-1]:null;
    foot.textContent = ev ? ("Last activity: "+fmtDateTime(ev.ts)+" — "+(ev.summary||ev.action)) : "";
    glossarize(foot);
    $("btnPlain").classList.toggle("on", plainMode);
    const sessN=(MODE==="central" && fst && Array.isArray(fst.sessions))
      ? fst.sessions.length
      : ((state.sessions&&Array.isArray(state.sessions.sessions))?state.sessions.sessions.length:0);
    $("btnSessions").textContent = sessN>0 ? ("Sessions ("+sessN+")") : "Sessions";
  }

  // Lineage banner above the road: parent breadcrumb + child branch chips
  // (each an in-app jump), plus orphan / lineage-loop warnings. Central only.
  function renderLineageBanner(){
    const lm=$("linmount"); if(!lm) return;
    const L=(MODE==="central" && state) ? state.lineage : null;
    if(!L){ lm.innerHTML=""; return; }
    const parts=[];
    if(L.parent){
      parts.push('<span>↑ Part of </span><a href="/r/'+encodeURIComponent(L.parent.id)+'">'
        +esc(L.parent.name||L.parent.id)+(L.parent.missing?' (missing)':'')+'</a>');
    }
    const kids=Array.isArray(L.children)?L.children:[];
    if(kids.length){
      let cs='<span>Branches: </span>';
      for(const c of kids){
        const prog=(c.progress&&typeof c.progress==="object")?c.progress:null;
        const cap=prog?(' <span class="lc-prog">'+(prog.done||0)+'/'+(prog.total||0)+'</span>'):'';
        cs+='<a class="lchip" href="/r/'+encodeURIComponent(c.id)+'">'+esc(c.name||c.id)
          +(c.missing?' (missing)':cap)+' →</a>';
      }
      parts.push(cs);
    }
    if(L.orphan && L.origin){
      parts.push('<span class="lwarn">⚠ parent '+esc(L.origin.roadmapId)+' is not in the registry</span>');
    }
    if(L.lineageError==="cycle") parts.push('<span class="lwarn">⚠ lineage loop — shown as a root</span>');
    else if(L.lineageError==="too_deep") parts.push('<span class="lwarn">⚠ lineage deeper than 8 — shown as a root</span>');
    if(!parts.length){ lm.innerHTML=""; return; }
    lm.innerHTML='<div class="linbanner">'+parts.join('<span class="lsep">·</span>')+'</div>';
    glossarize(lm);
  }
