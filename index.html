<meta charset="utf-8">
<title>QUESTLOG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233a3225'/%3E%3Cpath d='M6 22 Q12 12 16 16 T26 12' stroke='%23dac89e' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='22' r='3.5' fill='%236f9c58'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23cf9a30'/%3E%3Ccircle cx='25' cy='12' r='3.5' fill='%234f88b0'/%3E%3C/svg%3E">
<style>
  /* ===================================================================
     QUESTLOG — 2011 world-map / skill-tree dashboard
     Muted parchment palette, one gold accent, chunky rounded nodes.
     Single file. No CDN. Renders entirely from /api/state.
     =================================================================== */
  :root{
    /* ---- SKIN TOKENS (single source of truth: skins.mjs PARCHMENT_TOKENS).
       Every themable colour is a var(--token). A skin overrides a subset on
       document.documentElement; missing tokens fall back to these parchment
       defaults. JS reads them via getPropertyValue only. Parchment == today's
       exact values, so the default render is pixel-identical. ---- */
    --parch:#e9e0c8; --parch2:#f4eeda; --parch3:#fbf7ea;
    --edge:#cbbd97; --edge2:#b7a677;
    --ink:#3a3427; --ink-soft:#6d6450; --ink-faint:#938a72;
    --road:#dac89e; --road-edge:#b19662; --road-dash:#f1e6c6;
    --gold:#cf9a30; --gold-deep:#a97a1e;
    --st-locked:#9a9182; --st-available:#4f88b0; --st-in_progress:#cf9a30;
    --st-done:#6f9c58; --st-blocked:#c05a3e;
    /* chat access-tier badges (dec-chat-access-tiers) */
    --tier-blue:#5b5fc7; --tier-red:#b3232a;
    /* evidence / claims-complete (C7, dec-currency-architecture). A DELIBERATELY
       non-status hue: "claims complete" is a claim on the evidence plane, not a
       judgement on the status plane, and it must never read as the done-green. */
    --evid:#6b4f9e; --evid-ink:#ffffff;
    --shadow:0 2px 0 rgba(120,104,66,.35), 0 6px 18px rgba(90,74,40,.18);
    --serif:Georgia,"Palatino Linotype","Book Antiqua",serif;
    --sans:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",sans-serif;
    /* header (was hardcoded browns/inks) */
    --header-bg1:#4a4030; --header-bg2:#3a3225; --header-border:#2c2519;
    --header-ink:#f3ecd7; --header-ink-soft:#c9bfa4;
    /* dark badge / pill (worldSwitch, hbtn) */
    --badge-bg:#2c2519; --badge-border:#5a4e38; --badge-ink:#e9dfc4;
    /* dark map-control buttons */
    --btn-dark-bg:#3a3225; --btn-dark-ink:#f0e6cc;
    /* kind chips */
    --chip-blocker-bg:#f0d3ca; --chip-blocker-ink:#8a3320; --chip-blocker-border:#dcae9f;
    --chip-note-bg:#e7dff0; --chip-note-ink:#5a417f; --chip-note-border:#cfc0e2;
    --chip-explain-bg:#dde9de; --chip-explain-ink:#3f6b40; --chip-explain-border:#c2d6c3;
    --chip-built-bg:#e3ecd9;
    /* reason (blocker rationale) box */
    --reason-bg:#f6ded6; --reason-ink:#8a3320; --reason-border:#e2b8ab;
    /* danger button gradient */
    --danger1:#c86a52; --danger2:#a8452e; --danger-border:#8f3a26;
    /* session-road pill background */
    --sess-road-bg:#eadfc0;
    /* compaction pin */
    --pin-bg:#efe6cc;
    /* JS-emitted SVG node glyphs / pin badge */
    --node-icon-ink:#ffffff; --node-badge-bg:#3a3427; --node-badge-ink:#f0e6cc;
    /* body dot-grid texture (two rgba layers) */
    --texture-dot1:rgba(255,255,255,.35); --texture-dot2:rgba(150,130,90,.10);
    /* ---- DERIVED SURFACES ---- literal parchment values keep the default
       render pixel-identical; when a non-parchment skin is applied, applySkin()
       recomputes each from the skin's tokens (see deriveSurfaces) so bar
       troughs, drawer headers, gold-tint panels etc. transform coherently. */
    --surf-track:#d9d0b6; --surf-head1:#efe6cd; --surf-head2:#e6dabb;
    --surf-legend:rgba(240,232,210,.92); --surf-ghost:rgba(217,208,182,.22);
    --surf-parch-gold:#f3ead2; --surf-gold-pale:#f3e6c8; --surf-gold-panel:#f6edd4;
    --ink-on-gold:#3a2f12; --accent-border-deep:#8a6a1a;
    --btn-dark-hover:#3a3122; --chip-built-border:#c6d8bd; --surf-input:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--ink);
    background-color:var(--parch);
    background-image:
      radial-gradient(var(--texture-dot1) 1px, transparent 1px),
      radial-gradient(var(--texture-dot2) 1px, transparent 1px);
    background-size:7px 7px, 7px 7px;
    background-position:0 0, 3px 3px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; height:62px; z-index:40;
    display:flex; align-items:center; gap:16px; padding:0 18px;
    background:linear-gradient(var(--header-bg1),var(--header-bg2));
    color:var(--header-ink); box-shadow:0 3px 0 rgba(0,0,0,.25), 0 8px 22px rgba(0,0,0,.25);
    border-bottom:2px solid var(--header-border);
  }
  header .brand{display:flex; align-items:baseline; gap:10px; min-width:0}
  header .mark{font-family:var(--serif); font-weight:700; font-size:22px; letter-spacing:2px; color:var(--gold)}
  header .pname{font-family:var(--serif); font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .ptag{font-size:12.5px; color:var(--header-ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:340px}
  header .spacer{flex:1}
  .badge{
    display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:20px;
    background:var(--badge-bg); border:1px solid var(--badge-border); font-size:13px; font-weight:600; color:var(--badge-ink);
  }
  .badge .num{color:var(--gold); font-family:var(--serif); font-size:15px}
  .hbtn{
    background:var(--badge-bg); color:var(--badge-ink); border:1px solid var(--badge-border); border-radius:8px;
    padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .hbtn:hover{background:var(--btn-dark-hover); border-color:var(--gold)}
  #btnDispatch{background:linear-gradient(var(--gold),var(--gold-deep)); color:var(--node-icon-ink);
    border:1px solid var(--accent-border-deep); border-radius:9px; padding:7px 14px; font-family:var(--serif);
    font-weight:800; font-size:13px; letter-spacing:.5px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35)}
  #btnDispatch:hover{filter:brightness(1.07)} #btnDispatch:active{transform:translateY(1px)}
  #btnDispatch:disabled{opacity:.55; cursor:default; transform:none}

  /* ---------- legend ---------- */
  .legend{
    position:fixed; top:62px; left:0; right:0; z-index:30;
    display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:center;
    padding:7px 14px; background:var(--surf-legend);
    border-bottom:1px solid var(--edge); font-size:11.5px; color:var(--ink-soft); backdrop-filter:blur(2px);
  }
  .legend .lg{display:inline-flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
  .legend .dot{width:13px; height:13px; border-radius:50%; border:2px solid rgba(0,0,0,.22)}

  /* ---------- map ---------- */
  main{padding-top:104px; padding-bottom:0; display:block}
  .mapwrap{width:100%; max-width:none; padding:0 8px}
  svg.map{width:100%; height:calc(100vh - 140px); min-height:340px; display:block;
    overflow:hidden; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none}
  svg.map.grabbing{cursor:grabbing}
  svg.map.grabbing *{cursor:grabbing}
  .node-hit{cursor:pointer}

  /* ---------- map camera controls (2011 dark-badge cluster) ---------- */
  #mapctrls{position:fixed; right:16px; bottom:18px; z-index:35;
    display:flex; flex-direction:column; gap:8px}
  #mapctrls button{width:42px; height:42px; border-radius:21px; border:1px solid var(--badge-border);
    background:linear-gradient(var(--header-bg1),var(--header-bg2)); color:var(--btn-dark-ink); font-size:18px; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); font-family:var(--serif);
    display:flex; align-items:center; justify-content:center; line-height:1; padding:0}
  #mapctrls button:hover{border-color:var(--gold); color:var(--gold)}
  #mapctrls button:active{transform:translateY(1px)}
  #btnHome{font-size:20px}
  body.ws-mode #mapctrls{display:none}

  /* ---------- portal hover-peek (ghost preview of a child road) ---------- */
  #portalpeek{position:fixed; z-index:65; display:none; max-width:270px; min-width:184px;
    background:var(--parch3); border:2px solid var(--gold); border-radius:11px;
    box-shadow:0 6px 20px rgba(70,54,20,.35), inset 0 0 0 1px rgba(255,255,255,.45);
    padding:9px 11px; font-family:var(--sans); color:var(--ink); pointer-events:none}
  #portalpeek .pk-head{font-family:var(--serif); font-weight:700; font-size:13.5px; color:var(--gold-deep);
    display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:6px}
  #portalpeek .pk-prog{font-size:11.5px; color:var(--ink-soft); font-family:var(--sans); white-space:nowrap}
  #portalpeek .pk-strip{display:flex; flex-direction:column; gap:4px}
  #portalpeek .pk-item{display:flex; align-items:center; gap:7px; font-size:12px; line-height:1.25}
  #portalpeek .pk-dot{width:10px; height:10px; border-radius:50%; border:1.5px solid rgba(0,0,0,.22); flex:0 0 auto}
  #portalpeek .pk-t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #portalpeek .pk-more{font-size:11px; color:var(--ink-faint); margin-top:2px; padding-left:17px}
  #portalpeek .pk-foot{margin-top:7px; font-size:10.5px; color:var(--ink-faint); font-style:italic;
    border-top:1px dashed var(--edge2); padding-top:5px}
  #portalpeek .pk-load{font-size:12px; color:var(--ink-soft)}
  /* Milestone hover bubble — sits BELOW portal peek (65) and glossary tip.
     STORY PEEK: every milestone gets the same treatment the portal peek gives a
     child road — its description, then the story of how it got where it is
     (its own items, typed and status-dotted, plus the decisions that ruled it). */
  #msbubble{position:fixed; z-index:64; display:none; max-width:300px; min-width:180px;
    background:var(--parch3); border:1px solid var(--edge); border-radius:9px;
    box-shadow:var(--shadow); padding:8px 10px; font-family:var(--sans); color:var(--ink); pointer-events:none}
  #msbubble .mb-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px}
  #msbubble .mb-title{font-family:var(--serif); font-weight:700; font-size:13.5px; color:var(--gold-deep);
    line-height:1.15; overflow:hidden; text-overflow:ellipsis}
  #msbubble .mb-count{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; flex:0 0 auto}
  #msbubble .mb-plain{font-size:12.5px; line-height:1.3; color:var(--ink)}
  #msbubble .mb-sec{margin-top:7px; padding-top:6px; border-top:1px dashed var(--edge);
    font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-faint)}
  #msbubble .mb-strip{display:flex; flex-direction:column; gap:3px; margin-top:4px}
  #msbubble .mb-row{display:flex; align-items:center; gap:6px; font-size:11.5px; line-height:1.25}
  #msbubble .mb-dot{width:8px; height:8px; border-radius:50%; border:1.5px solid rgba(0,0,0,.22); flex:0 0 auto}
  #msbubble .mb-k{font-size:9px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    padding:1px 5px; border-radius:5px; flex:0 0 auto;
    background:var(--sess-road-bg); color:var(--ink-soft); border:1px solid var(--edge)}
  #msbubble .mb-k.blocker{background:var(--chip-blocker-bg); color:var(--chip-blocker-ink); border-color:var(--chip-blocker-border)}
  #msbubble .mb-k.note_to_founder{background:var(--chip-note-bg); color:var(--chip-note-ink); border-color:var(--chip-note-border)}
  #msbubble .mb-k.explanation{background:var(--chip-explain-bg); color:var(--chip-explain-ink); border-color:var(--chip-explain-border)}
  #msbubble .mb-k.decision{background:var(--gold-soft,#e8d9ae); color:var(--gold-deep); border-color:var(--gold)}
  #msbubble .mb-t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  #msbubble .mb-t.struck{text-decoration:line-through; opacity:.65}
  #msbubble .mb-more{font-size:10.5px; color:var(--ink-faint); padding-left:14px; margin-top:1px}
  #msbubble .mb-meta{margin-top:6px; font-size:11px; color:var(--ink-soft); display:flex; gap:7px; align-items:center; flex-wrap:wrap}
  #msbubble .mb-quest{font-style:italic; color:var(--ink-faint)}
  #msbubble .mb-status{font-family:var(--serif); font-weight:700; color:var(--gold-deep)}
  #msbubble .mb-foot{margin-top:6px; padding-top:5px; border-top:1px dashed var(--edge);
    font-size:10.5px; color:var(--ink-faint); font-style:italic}
  /* STORY SO FAR — the milestone card's chronology, drawn from the audit trail. */
  .story{display:flex; flex-direction:column; gap:0; margin:2px 0 4px; position:relative}
  .story-ev{display:flex; gap:9px; align-items:flex-start; padding:5px 0 5px 2px; position:relative}
  .story-ev:not(:last-child)::before{content:""; position:absolute; left:6px; top:16px; bottom:-5px;
    width:2px; background:var(--edge)}
  .story-dot{width:11px; height:11px; border-radius:50%; border:2px solid var(--parch3);
    box-shadow:0 0 0 1px var(--edge); flex:0 0 auto; margin-top:3px; position:relative; z-index:1}
  .story-b{min-width:0; flex:1}
  .story-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .story-lane{font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    padding:1px 6px; border-radius:5px; background:var(--sess-road-bg); color:var(--ink-soft); border:1px solid var(--edge)}
  .story-lane.decision{background:var(--gold-soft,#e8d9ae); color:var(--gold-deep); border-color:var(--gold)}
  .story-lane.milestone{background:var(--chip-explain-bg); color:var(--chip-explain-ink); border-color:var(--chip-explain-border)}
  .story-when{font-size:10.5px; color:var(--ink-faint)}
  .story-sum{font-size:12.5px; line-height:1.35; color:var(--ink); margin-top:1px}
  /* The name is a REAL target, not decoration: it sits inside the node's <g
     class="node-hit" data-mid>, so making it hit-testable means clicking the
     word opens the card exactly like clicking the circle. It was
     pointer-events:none, which made the biggest, most obviously clickable part
     of a stop silently dead — the map looked broken to anyone who aimed at the
     label instead of the small disc. */
  .node-title{font-family:var(--serif); font-weight:700; text-align:center; line-height:1.12;
    color:var(--ink); cursor:pointer; padding:2px 3px;}
  .node-title.ghost-title{cursor:default}
  .node-title.side{font-size:11.5px}
  .node-title.main{font-size:13px}
  .node-title.ghost-title{font-size:11px; font-weight:600; font-style:italic; color:var(--ink-faint)}
  .questlabel{font-family:var(--serif); font-style:italic; fill:var(--ink-faint); font-size:12px}
  .pinlabel{font-family:var(--sans); font-size:10.5px; font-weight:700; fill:var(--gold-deep); text-transform:uppercase; letter-spacing:.5px}
  .foot{ text-align:center; color:var(--ink-faint); font-size:11.5px; padding:8px}

  /* ---------- drawer ---------- */
  .scrim{position:fixed; inset:0; background:rgba(40,32,18,.28); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:min(460px,94vw); z-index:60;
    background:var(--parch2); border-left:3px solid var(--edge2);
    box-shadow:-8px 0 30px rgba(70,54,20,.28);
    transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer .dhead{
    display:flex; align-items:flex-start; gap:10px; padding:16px 16px 12px;
    background:linear-gradient(var(--surf-head1),var(--surf-head2)); border-bottom:2px solid var(--edge2);
  }
  .drawer .dhead h2{margin:0; font-family:var(--serif); font-size:19px; line-height:1.2; flex:1}
  .drawer .dbody{overflow-y:auto; padding:14px 16px 40px; flex:1}
  .xbtn{background:none; border:none; font-size:22px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:0 2px}
  .xbtn:hover{color:var(--st-blocked)}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:14px; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--node-icon-ink); border:1px solid rgba(0,0,0,.18)}
  .pill.locked{background:var(--st-locked)} .pill.available{background:var(--st-available)}
  .pill.in_progress{background:var(--st-in_progress)} .pill.done{background:var(--st-done)}
  .pill.blocked{background:var(--st-blocked)} .pill.open{background:var(--st-available)}
  .pill.proposed{background:var(--st-in_progress)} .pill.approved{background:var(--st-done)}
  .pill.rejected{background:var(--st-blocked)} .pill.superseded{background:var(--st-locked)}
  .pill.running{background:var(--st-in_progress)} .pill.stalled{background:var(--st-blocked)}
  .pill.active{background:var(--st-available)} .pill.completed{background:var(--st-done)}
  .pill.idle{background:var(--st-locked)}

  /* ---------- C7, the coverage declaration (dec-currency-architecture) ----------
     The evidence plane gets its OWN chip family — different hue token (--evid),
     different corner radius, different case — so it can never be misread as a
     status pill. "◈ evidenced" says observations exist. "claims complete" says
     the evidence array holds an unretracted, unrefuted finish claim. NEITHER
     says verified, and neither is ever the done-green. */
  .evchip{display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:5px;
    font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    background:var(--evid); color:var(--evid-ink); border:1px solid rgba(0,0,0,.22)}
  .evchip.soft{background:transparent; color:var(--evid); border:1px dashed var(--evid)}
  .evrow{display:flex; gap:9px; align-items:baseline; font-size:12.5px; line-height:1.45;
    padding:6px 0; border-bottom:1px dotted var(--edge)}
  .evrow .evts{color:var(--ink-faint); font-size:10.5px; white-space:nowrap; flex:0 0 auto}
  .evrow .evsrc{color:var(--evid); font-weight:800; font-size:10px; text-transform:uppercase;
    letter-spacing:.4px; white-space:nowrap; flex:0 0 auto}
  .evrow .evclaim{flex:1; color:var(--ink); min-width:80px; word-break:break-word}
  .evrow.dead{opacity:.6}
  .evrow.dead .evclaim{text-decoration:line-through}
  .evrow.dead .evts::after{content:" retracted"; font-style:italic}
  /* an unlinked workflow — DETECTED, never blocked. The copy says so. */
  .pill.unlinked{background:var(--st-blocked)}
  .cov-line{font-size:11.5px; color:var(--ink-soft); background:var(--surf-gold-pale);
    border:1px solid var(--gold); border-radius:7px; padding:5px 9px; margin:7px 0}
  .cov-line b{color:var(--ink)}

  .meta{font-size:12px; color:var(--ink-soft); margin:6px 0}
  .meta b{color:var(--ink)}
  .sechead{font-family:var(--serif); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    color:var(--gold-deep); margin:20px 0 8px; border-bottom:1px dashed var(--edge2); padding-bottom:4px}
  .summary{font-size:13.5px; line-height:1.5; color:var(--ink); margin:8px 0}
  .empty{font-size:12.5px; color:var(--ink-faint); font-style:italic}

  .card{background:var(--parch3); border:1px solid var(--edge); border-radius:10px; padding:11px 12px; margin:9px 0; box-shadow:var(--shadow)}
  .card .ctop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .kind{font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; padding:2px 7px; border-radius:6px;
    background:var(--sess-road-bg); color:var(--ink-soft); border:1px solid var(--edge)}
  .kind.blocker{background:var(--chip-blocker-bg); color:var(--chip-blocker-ink); border-color:var(--chip-blocker-border)}
  .kind.note_to_founder{background:var(--chip-note-bg); color:var(--chip-note-ink); border-color:var(--chip-note-border)}
  .kind.explanation{background:var(--chip-explain-bg); color:var(--chip-explain-ink); border-color:var(--chip-explain-border)}
  /* Built by (archaeology) — session provenance chips + git commit hashes */
  .builtby-row{margin:8px 0; padding:7px 9px; background:var(--parch3); border:1px solid var(--edge);
    border-radius:9px; box-shadow:var(--shadow)}
  .builtby-row .bb-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .kind.builtby-chip{background:var(--chip-built-bg); color:var(--chip-explain-ink); border-color:var(--chip-built-border); text-transform:none;
    letter-spacing:.2px; font-size:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis}
  .builtby-row .bb-ec{font-weight:600; opacity:.75; margin-left:5px; font-size:9.5px}
  .builtby-row .bb-dates{font-size:11px; color:var(--ink-faint); font-style:italic}
  .builtby-row .bb-commits{margin-top:6px; display:flex; gap:5px; flex-wrap:wrap}
  .bb-commit{font-family:"Consolas",monospace; font-size:10.5px; color:var(--gold-deep);
    background:var(--surf-parch-gold); border:1px solid var(--edge); border-radius:5px; padding:1px 6px; cursor:help}
  .card .ctitle{font-weight:700; font-size:13.5px; flex:1; min-width:120px}
  .body{font-size:13px; line-height:1.55; color:var(--ink); margin:8px 0 2px; white-space:normal; word-break:break-word}
  .body code{background:var(--pin-bg); border:1px solid var(--edge); border-radius:4px; padding:0 4px; font-family:"Consolas",monospace; font-size:12px}
  .body a{color:var(--st-available); text-decoration:underline; word-break:break-all}
  .reason{font-size:12px; color:var(--reason-ink); background:var(--reason-bg); border:1px solid var(--reason-border); border-radius:7px; padding:6px 9px; margin:7px 0}

  .notes{margin-top:9px; border-top:1px dashed var(--edge); padding-top:8px}
  .note{display:flex; gap:8px; margin:7px 0; font-size:12.5px; line-height:1.45}
  .note .who{flex:0 0 auto; font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
    padding:2px 6px; border-radius:5px; height:fit-content}
  .note .who.founder{background:var(--gold); color:var(--ink-on-gold)}
  .note .who.agent{background:var(--surf-track); color:var(--ink-soft)}
  .note .ntext{flex:1}
  .note .nts{color:var(--ink-faint); font-size:10.5px; margin-top:1px}
  .qchip{display:inline-block; margin-left:6px; font-size:9.5px; font-weight:800; letter-spacing:.5px;
    text-transform:uppercase; padding:1px 6px; border-radius:5px; background:var(--surf-gold-pale);
    color:var(--gold-deep); border:1px solid var(--gold)}
  .addnote{display:flex; gap:6px; margin-top:8px}
  .addnote textarea{flex:1; resize:vertical; min-height:34px; max-height:140px; font-family:var(--sans); font-size:12.5px;
    border:1px solid var(--edge2); border-radius:7px; padding:6px 8px; background:var(--surf-input); color:var(--ink)}
  .btn{background:linear-gradient(var(--gold),var(--gold-deep)); color:var(--node-icon-ink); border:1px solid var(--gold-deep);
    border-radius:7px; padding:6px 12px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--parch3); color:var(--ink); border-color:var(--edge2)}
  .btn.sm{padding:4px 9px; font-size:11px; font-weight:600}
  .distill-caption{font-style:italic; color:var(--ink-faint)}
  .btn.danger{background:linear-gradient(var(--danger1),var(--danger2)); border-color:var(--danger-border)}
  .btnrow{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .standing{display:inline-flex; align-items:center; gap:7px; margin-top:9px; padding:5px 11px;
    background:var(--surf-gold-pale); border:1px solid var(--gold-deep); border-radius:8px;
    font-family:var(--serif); font-weight:700; font-size:11.5px; letter-spacing:.8px;
    text-transform:uppercase; color:var(--gold-deep)}

  .asset{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; background:var(--parch3);
    border:1px solid var(--edge); border-radius:9px; margin:7px 0}
  .asset .aicon{font-size:16px; flex:0 0 auto; margin-top:1px}
  .asset .alabel{font-weight:700; font-size:12.5px}
  .asset .aref{font-family:"Consolas",monospace; font-size:11px; color:var(--ink-soft); word-break:break-all; margin-top:2px}

  .timeline .tl{display:flex; gap:9px; padding:7px 0; border-bottom:1px dashed var(--edge); font-size:12px}
  .timeline .tl .dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--gold); margin-top:4px}
  .timeline .tl .tts{color:var(--ink-faint); font-size:10.5px}
  .timeline .tl .who{font-weight:700; text-transform:capitalize}

  /* ---------- glossary underlines + tooltip (item-description popup) ---------- */
  .gl-term{ border-bottom:1px dotted var(--gold-deep); cursor:help; }
  #gltip{
    position:fixed; z-index:70; max-width:300px; display:none;
    background:var(--parch3); border:2px solid var(--gold-deep); border-radius:9px;
    box-shadow:0 4px 14px rgba(70,54,20,.35), inset 0 0 0 1px rgba(255,255,255,.45);
    padding:9px 11px; font-family:var(--sans); color:var(--ink);
    font-size:12.5px; line-height:1.45;
  }
  #gltip .gltip-term{font-family:var(--serif); font-weight:700; font-size:13.5px;
    color:var(--gold-deep); margin-bottom:3px; letter-spacing:.3px}
  #gltip .gltip-plain{color:var(--ink)}
  #gltip .gltip-note{margin-top:6px; font-size:11.5px; color:var(--ink-soft);
    border-top:1px dashed var(--edge2); padding-top:5px}
  #gltip .gltip-link{margin-top:6px; font-size:11.5px}
  #gltip .gltip-link a{color:var(--st-available); text-decoration:underline; word-break:break-all}

  /* ---------- plain-english toggle + marker ---------- */
  #btnPlain.on{border-color:var(--gold); background:var(--surf-gold-pale); color:var(--gold-deep);
    box-shadow:inset 0 0 0 2px var(--gold), 0 1px 3px rgba(120,90,20,.25); font-weight:700}
  .noplain{font-size:11px; font-style:italic; color:var(--ink-faint); margin-left:5px}
  /* tiny caption under the header telling the founder which register is showing */
  .plain-caption{max-width:960px; margin:2px auto 0; padding:0 16px; font-size:11.5px;
    font-style:italic; color:var(--ink-soft); min-height:14px; text-align:center;
    opacity:0; transition:opacity .2s}
  .plain-caption.show{opacity:1}
  body.ws-mode .plain-caption{display:none}
  /* brief flash on blocks whose wording just changed register */
  @keyframes plainFlash{0%{background:var(--surf-gold-pale)}100%{background:transparent}}
  .plain-flash{animation:plainFlash 1.2s ease-out}

  /* ---------- unclear flag button ---------- */
  .unclear-row{margin-top:9px}
  .unclear-btn{background:var(--parch3); color:var(--ink-soft); border:1px dashed var(--edge2);
    border-radius:7px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:var(--sans)}
  .unclear-btn:hover{border-color:var(--gold); color:var(--ink)}
  .unclear-btn.on{background:var(--surf-gold-pale); color:var(--gold-deep); border:1px solid var(--gold-deep)}

  /* ---------- delete control (two-step; see deleteBtn) ---------- */
  /* Same dashed ghost as the unclear button — a destructive control should not
     shout on a card the founder is only reading. It only turns red on hover. */
  .del-btn{background:var(--parch3); color:var(--ink-soft); border:1px dashed var(--edge2);
    border-radius:7px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:var(--sans); margin-left:6px}
  .del-btn:hover{border-color:var(--st-blocked); color:var(--st-blocked)}
  /* The armed strip speaks the same confirm language as the overworld's
     .fconfirm, laid out INLINE under the button instead of over a card. */
  .delconfirm{display:none; margin-top:7px; box-sizing:border-box;
    background:var(--parch3); border:2px solid var(--gold-deep); border-radius:12px; padding:9px 11px;
    flex-direction:column; gap:7px}
  .delconfirm.on{display:flex}
  .delconfirm .fcq{font-size:12px; color:var(--ink); line-height:1.3}
  .delconfirm .fca{display:flex; gap:8px; flex-wrap:wrap}
  .delconfirm .fcnote{font-size:10px; font-style:italic; color:var(--ink-faint); line-height:1.25}

  /* ---------- contested changes (a colliding write, held) ---------- */
  /* On a card: a quiet line saying an argument is open about THIS record. It
     never hides the standing version — the first write is what the card shows,
     and the held one is named, not rendered in its place. */
  .contested{margin-top:8px; background:var(--surf-gold-pale); border:1px solid var(--gold-deep);
    border-radius:9px; padding:6px 9px; font-size:11.5px; color:var(--gold-deep); line-height:1.35}
  .contested a{color:var(--gold-deep); font-weight:700; cursor:pointer; text-decoration:underline}
  #contestedBadge{cursor:pointer; background:var(--surf-gold-pale); border-color:var(--gold-deep); color:var(--gold-deep)}
  /* In the drawer: the two versions side by side, standing on the left. Only
     the fields that actually differ are listed — a founder choosing between two
     versions needs the argument, not a re-print of what never moved. */
  .cf-cols{width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px; table-layout:fixed}
  .cf-cols th{text-align:left; padding:5px 7px; background:var(--parch3); border:1px solid var(--edge2);
    font-size:11px; color:var(--ink-soft); font-weight:700}
  .cf-cols td{padding:5px 7px; border:1px solid var(--edge2); vertical-align:top;
    word-break:break-word; white-space:pre-wrap; font-family:var(--mono,var(--sans))}
  .cf-cols td.k{font-weight:700; color:var(--ink-soft); font-family:var(--sans); width:26%}
  .cf-cols tr.held td:last-child{background:var(--surf-gold-pale)}
  .cf-meta{font-size:11px; color:var(--ink-faint); font-style:italic; margin-top:5px}
  .cf-ruled{opacity:.72}

  @media (max-width:560px){
    header .ptag{display:none}
    .legend{font-size:10.5px; gap:5px 10px}
  }

  /* ===================================================================
     CENTRAL APP — world-select overworld, in-road switcher, sessions
     =================================================================== */
  /* ---------- world-select overworld ---------- */
  body.ws-mode main{padding-top:0; padding-bottom:0; display:block}
  body.ws-mode .legend{display:none}
  body.ws-mode .mapwrap{max-width:none; padding:0}
  body.ws-mode #progress,
  body.ws-mode #pendingBadge,
  body.ws-mode #contestedBadge,
  body.ws-mode #btnDispatch,
  body.ws-mode #btnPlain,
  body.ws-mode #btnDecisions,
  body.ws-mode #btnTimeline,
  body.ws-mode #btnSessions,
  body.ws-mode #worldSwitch{display:none}

  .worlds{max-width:960px; margin:0 auto; padding:96px 16px 60px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px}
  .world-card{background:var(--parch2); border:2px solid var(--edge2); border-radius:14px;
    box-shadow:var(--shadow); padding:14px 16px; color:var(--ink); text-decoration:none;
    display:flex; flex-direction:column; gap:9px; transition:transform .12s,border-color .12s}
  a.world-card:hover{transform:translateY(-2px); border-color:var(--gold)}
  .world-card .wtop{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .world-card .wdot{width:14px; height:14px; border-radius:50%; border:2px solid rgba(0,0,0,.22); flex:0 0 auto}
  .world-card .wname{font-family:var(--serif); font-weight:700; font-size:18px}
  .world-card .wtag{font-size:12.5px; color:var(--ink-soft);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .world-bar{height:12px; border-radius:6px; background:var(--surf-track); border:1px solid var(--edge2); overflow:hidden}
  .world-bar > span{display:block; height:100%; background:linear-gradient(var(--gold),var(--gold-deep))}
  .world-prog-cap{font-family:var(--serif); font-size:12px}
  .world-foot{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--ink-faint)}
  .world-card.missing{opacity:.55; filter:grayscale(.6)}
  .world-dir{font-family:"Consolas",monospace; font-size:10.5px; word-break:break-all; color:var(--ink-soft)}
  .worlds-empty{grid-column:1/-1; text-align:center; padding:48px 16px}

  /* ---------- centered missing-world notice (central road view) ---------- */
  .world-missing-wrap{max-width:520px; margin:60px auto; padding:0 16px}
  .world-missing-wrap .card{text-align:center}
  a.btn{display:inline-block; text-decoration:none; text-align:center}

  /* ---------- in-road world switcher ---------- */
  #worldSwitch{background:var(--badge-bg); color:var(--badge-ink); border:1px solid var(--badge-border); border-radius:8px;
    padding:5px 9px; font-size:12.5px; font-weight:600; font-family:var(--sans); cursor:pointer}
  #worldSwitch:hover{border-color:var(--gold)}

  /* ---------- contributing-sessions panel ---------- */
  .session-id{font-family:"Consolas",monospace; font-size:11px; color:var(--ink-soft); word-break:break-all; margin-top:2px}
  .card .ctitle.unlabeled{font-style:italic; color:var(--ink-faint); font-weight:600}

  /* ===================================================================
     FAMILY TREE — overworld lineage map (roots → children), portals,
     roll-ups. All additive; dir mode never sees any of it.
     =================================================================== */
  /* ---------- family-tree overworld ---------- */
  body.ws-mode #rollup{display:none}
  body.ws-mode #linmount{display:none}
  .ftree-scroll{overflow:auto; padding:92px 16px 52px}
  .ftree{position:relative; margin:0 auto}
  .ftree svg.edges{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  .fnode{position:absolute; box-sizing:border-box; background:var(--parch2);
    border:2px solid var(--edge2); border-radius:12px; box-shadow:var(--shadow);
    padding:9px 11px; color:var(--ink); text-decoration:none;
    display:flex; flex-direction:column; gap:5px; transition:transform .12s,border-color .12s}
  a.fnode:hover{transform:translateY(-2px); border-color:var(--gold)}
  .fnode .ftop{display:flex; align-items:center; gap:7px}
  .fnode .fdot{width:13px; height:13px; border-radius:50%; border:2px solid rgba(0,0,0,.22); flex:0 0 auto}
  .fnode .fname{font-family:var(--serif); font-weight:700; font-size:15.5px; line-height:1.1; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fnode .ftag{font-size:11px; color:var(--ink-soft); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
  .froot{font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    color:var(--gold-deep); border:1px solid var(--edge); border-radius:5px; padding:1px 5px; background:var(--surf-parch-gold); flex:0 0 auto}
  .fnode .fbar{height:9px; border-radius:5px; background:var(--surf-track); border:1px solid var(--edge2); overflow:hidden}
  .fnode .fbar > span{display:block; height:100%; background:linear-gradient(var(--gold),var(--gold-deep))}
  .fnode .fcap{font-family:var(--serif); font-size:11.5px; color:var(--ink-soft);
    display:flex; justify-content:space-between; gap:8px}
  .fnode .froll{font-size:10.5px; color:var(--gold-deep); font-weight:700}
  .fnode .ffoot{font-size:10px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:8px}
  /* per-card two-step remove control */
  .fremove{position:absolute; top:5px; right:6px; width:19px; height:19px; line-height:1; padding:0;
    border:1px solid var(--edge2); border-radius:5px; background:var(--parch3); color:var(--ink-faint);
    font-size:11px; cursor:pointer; opacity:0; transition:opacity .12s,color .12s}
  .fnode:hover .fremove{opacity:1}
  .fremove:hover{color:var(--st-blocked); border-color:var(--st-blocked)}
  .fconfirm{display:none; position:absolute; inset:0; z-index:2; box-sizing:border-box;
    background:var(--parch3); border:2px solid var(--gold-deep); border-radius:12px; padding:9px 11px;
    flex-direction:column; gap:7px; justify-content:center}
  .fconfirm.on{display:flex}
  .fconfirm .fcq{font-size:12px; color:var(--ink); line-height:1.3}
  .fconfirm .fca{display:flex; gap:8px}
  .fconfirm .fcnote{font-size:10px; font-style:italic; color:var(--ink-faint); line-height:1.25}
  .fnode.missing{opacity:.58; filter:grayscale(.55)}
  .fnode .fwarn{font-size:10px; font-weight:700; color:var(--st-blocked)}
  .fghost{position:absolute; box-sizing:border-box; border:2px dashed var(--st-locked); border-radius:12px;
    background:var(--surf-ghost); color:var(--ink-faint); padding:9px 11px;
    display:flex; flex-direction:column; gap:3px; font-size:10.5px; justify-content:center}
  .fghost .fgh{font-weight:700; color:var(--ink-soft); font-size:11.5px}
  .fghost .fgid{font-family:"Consolas",monospace; font-size:10px; word-break:break-all}

  /* ---------- road-view lineage banner (parent/children, in-app jumps) ---------- */
  #linmount{max-width:960px; margin:0 auto}
  .linbanner{margin:0 auto 8px; padding:8px 12px; display:flex; flex-wrap:wrap; align-items:center;
    gap:6px 12px; font-size:12.5px; color:var(--ink-soft);
    background:var(--parch2); border:1px solid var(--edge); border-radius:10px; box-shadow:var(--shadow)}
  .linbanner a{color:var(--st-available); text-decoration:none; font-weight:600}
  .linbanner a:hover{text-decoration:underline}
  .linbanner .lsep{color:var(--ink-faint)}
  .linbanner .lchip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:12px;
    background:var(--parch3); border:1px solid var(--edge); text-decoration:none; color:var(--ink); font-weight:600}
  .linbanner .lchip:hover{border-color:var(--gold); text-decoration:none}
  .linbanner .lchip .lc-prog{font-family:var(--serif); color:var(--gold-deep); font-size:11px}
  .linbanner .lwarn{color:var(--st-blocked); font-weight:700}

  /* ---------- portal section in the milestone drawer ---------- */
  .portal-sec{background:var(--surf-gold-panel); border:1px solid var(--gold); border-radius:10px; padding:10px 12px; margin:12px 0}
  .portal-sec .psname{font-family:var(--serif); font-weight:700; font-size:14.5px}
  .portal-sec .fbar{height:11px; border-radius:6px; background:var(--surf-track); border:1px solid var(--edge2); overflow:hidden; margin:8px 0}
  .portal-sec .fbar > span{display:block; height:100%; background:linear-gradient(var(--gold),var(--gold-deep))}
  /* live mirrored status breakdown chips (portal card + portal peek) */
  .bdchips{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 4px}
  .bdchips .bdchip{display:inline-flex; align-items:center; gap:4px; font-family:var(--sans);
    font-size:10.5px; line-height:1; padding:3px 6px; border:1px solid var(--edge2);
    border-radius:999px; background:var(--surf-track); color:var(--ink-soft); white-space:nowrap}
  .bdchips .bdchip i{width:7px; height:7px; border-radius:50%; display:inline-block}
  #portalpeek .bdchips{margin:6px 0 0}

  /* ---------- per-road session attribution chips ---------- */
  .sess-roads{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
  .sess-road{font-size:10.5px; padding:2px 8px; border-radius:11px; background:var(--sess-road-bg);
    border:1px solid var(--edge); color:var(--ink-soft); font-weight:600}
  .sess-road.me{background:var(--surf-parch-gold); color:var(--gold-deep); border-color:var(--gold)}

  /* ===================================================================
     SETTINGS PANEL — plain-language config editor in the drawer.
     Reuses the parchment tokens; no new design language.
     =================================================================== */
  .set-field{margin:15px 0}
  .set-field .lab{display:block; font-family:var(--sans); font-weight:700; font-size:13px; color:var(--ink); margin-bottom:4px}
  .set-field .hint{font-size:11.5px; color:var(--ink-soft); line-height:1.45; margin-top:4px}
  .set-field input[type=number], .set-field select{
    font-family:var(--sans); font-size:13px; color:var(--ink); background:var(--surf-input);
    border:1px solid var(--edge2); border-radius:7px; padding:6px 8px}
  .set-field input[type=number]{width:130px}
  .set-field input[type=number]:focus, .set-field select:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
  .set-check{display:flex; gap:9px; align-items:flex-start}
  .set-check input[type=checkbox]{width:17px; height:17px; margin-top:1px; flex:0 0 auto; accent-color:var(--gold-deep); cursor:pointer}
  .set-check .lab{margin-bottom:2px}
  .set-locked{opacity:.62}
  .set-lock-note{font-size:11px; font-style:italic; color:var(--gold-deep); margin-top:4px; line-height:1.4}
  .set-helper{border:2px solid var(--gold); background:var(--surf-gold-panel); border-radius:11px; padding:11px 13px 13px; margin:20px 0}
  .set-helper .sh-title{font-family:var(--serif); font-weight:700; font-size:14.5px; color:var(--gold-deep);
    letter-spacing:.3px; margin-bottom:2px}
  .set-consent{font-size:12px; line-height:1.55; color:var(--ink); background:var(--parch3);
    border:1px solid var(--edge); border-radius:8px; padding:8px 10px; margin:8px 0 2px}
  .set-save-row{display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-top:22px;
    border-top:1px dashed var(--edge2); padding-top:16px}
  .set-msg{font-size:12.5px; line-height:1.45}
  .set-msg.ok{color:var(--st-done)}
  .set-msg.err{color:var(--st-blocked)}
  .set-field textarea{width:100%; min-height:64px; resize:vertical; font-family:"Consolas",monospace; font-size:12px;
    border:1px solid var(--edge2); border-radius:7px; padding:6px 8px; background:var(--surf-input); color:var(--ink)}
  .set-field textarea:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
  .set-src{font-size:11px; font-style:italic; color:var(--ink-faint); margin-top:4px}

  /* ===================================================================
     RAIDS + ROSTER — live subagent expeditions and the cross-road
     session roster. Parchment tokens; reuse the card/pill/bar language
     so both read as native to the 2011 world-map.
     =================================================================== */
  .raid-desc{font-size:12px; color:var(--ink-soft); margin:5px 0 8px; line-height:1.45}
  .raid-phases{display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 4px}
  .raid-phase{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
    padding:2px 9px; border-radius:11px; background:var(--sess-road-bg); border:1px solid var(--edge); color:var(--ink-soft)}
  .raid-phase .rp-model{font-weight:600; color:var(--ink-faint); font-size:9.5px; text-transform:uppercase; letter-spacing:.4px}
  .raid-bar{height:11px; border-radius:6px; background:var(--surf-track); border:1px solid var(--edge2); overflow:hidden; margin:9px 0 4px}
  .raid-bar > span{display:block; height:100%; background:linear-gradient(var(--gold),var(--gold-deep))}
  .raid-foot{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--ink-faint); margin-top:7px}
  .raid-dir{font-family:"Consolas",monospace; font-size:10px; color:var(--ink-soft); word-break:break-all; margin-top:5px}

  .roster-token{display:flex; gap:10px; align-items:flex-start; background:var(--parch3);
    border:1px solid var(--edge); border-radius:10px; padding:10px 11px; margin:8px 0; box-shadow:var(--shadow)}
  .roster-token .rt-dot{width:14px; height:14px; border-radius:50%; border:2px solid rgba(0,0,0,.22); flex:0 0 auto; margin-top:3px}
  .roster-token .rt-body{flex:1; min-width:0}
  .roster-token .rt-label{font-weight:700; font-size:13px}
  .roster-token .rt-label.unlabeled{font-style:italic; color:var(--ink-faint); font-weight:600}
  .roster-token .rt-focus{font-size:11.5px; color:var(--ink-soft); margin-top:3px; font-style:italic; word-break:break-word}
  .roster-resume{display:flex; gap:7px; align-items:center; margin-top:9px; flex-wrap:wrap}
  .roster-auto{display:inline-flex; gap:5px; align-items:center; font-size:11px; color:var(--ink-soft); cursor:pointer}
  .roster-auto input[type=checkbox]{width:15px; height:15px; accent-color:var(--gold-deep); cursor:pointer}
  .roster-hint{font-size:11px; font-style:italic; color:var(--ink-faint); margin-top:6px; line-height:1.4}

  /* ===================================================================
     WAVE 3 — drawer tabs (Raids/Distillery), Distill, Task Board, Skin
     Manager. All reuse the parchment tokens so the whole map reskins as one.
     =================================================================== */
  .tabs{display:flex; gap:6px; margin:2px 0 12px; border-bottom:1px solid var(--edge); flex-wrap:wrap}
  .tab{background:none; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0;
    padding:6px 12px; font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--ink-soft);
    cursor:pointer; margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--gold-deep); background:var(--parch3); border-color:var(--edge); border-bottom:1px solid var(--parch3)}
  .distill-out{margin-top:9px; background:var(--pin-bg); border:1px solid var(--edge); border-radius:8px; padding:9px 10px}
  .distill-out .do-head{font-weight:700; font-size:11.5px; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.5px}
  .distill-out .do-cmd{font-family:"Consolas",monospace; font-size:11px; color:var(--ink); word-break:break-all;
    white-space:pre-wrap; margin:6px 0; background:var(--surf-input); border:1px solid var(--edge2); border-radius:6px; padding:6px 8px}
  .distill-out .do-note{font-size:11px; font-style:italic; color:var(--ink-faint); line-height:1.4}
  .distill-out .do-path{font-family:"Consolas",monospace; font-size:10.5px; color:var(--ink-soft); word-break:break-all; margin-top:4px}

  /* Task board */
  .tb-item{background:var(--parch3); border:1px solid var(--edge); border-radius:10px; padding:11px 12px; margin:9px 0; box-shadow:var(--shadow)}
  .tb-item.awaiting{border-style:dashed; opacity:.9}
  .tb-item .tb-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tb-item .tb-title{font-weight:700; font-size:13.5px; flex:1; min-width:120px}
  .tb-item .tb-brief{font-size:12.5px; line-height:1.5; color:var(--ink); margin:7px 0 2px; white-space:pre-wrap; word-break:break-word}
  .tb-item .tb-meta{font-size:11px; color:var(--ink-faint); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap}
  .tb-flag{font-size:9.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:2px 7px; border-radius:6px}
  .tb-flag.eligible{background:var(--st-done); color:var(--node-icon-ink)}
  .tb-flag.awaiting{background:var(--surf-gold-pale); color:var(--gold-deep); border:1px solid var(--gold)}
  .tb-flag.ineligible{background:var(--sess-road-bg); color:var(--ink-soft); border:1px solid var(--edge)}
  .tb-add{background:var(--surf-gold-panel); border:1px solid var(--gold); border-radius:10px; padding:11px 12px; margin:14px 0}
  .tb-add input, .tb-add textarea{width:100%; font-family:var(--sans); font-size:12.5px; color:var(--ink);
    background:var(--surf-input); border:1px solid var(--edge2); border-radius:7px; padding:6px 8px; margin-top:5px}
  .tb-add textarea{resize:vertical; min-height:48px; font-family:"Consolas",monospace}
  .tb-cap{font-size:11.5px; color:var(--ink-soft); line-height:1.45; margin:2px 0 10px}

  /* Skin manager */
  .skin-mgr{margin:4px 0 10px}
  .skin-list{display:flex; flex-direction:column; gap:8px}
  .skin-row{display:flex; align-items:center; gap:10px; background:var(--parch3); border:1px solid var(--edge);
    border-radius:10px; padding:9px 11px; box-shadow:var(--shadow); cursor:pointer}
  .skin-row.active{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold), var(--shadow)}
  .skin-row.invalid{opacity:.72}
  .skin-swatches{display:flex; gap:3px; flex:0 0 auto}
  .skin-sw{width:15px; height:15px; border-radius:50%; border:1.5px solid rgba(0,0,0,.22)}
  .skin-body{flex:1; min-width:0}
  .skin-name{font-family:var(--serif); font-weight:700; font-size:14px}
  .skin-sub{font-size:11px; color:var(--ink-faint)}
  .skin-sub.bad{color:var(--st-blocked); font-style:italic}
  .skin-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center}
  .skin-hint{font-size:11px; font-style:italic; color:var(--ink-faint); margin-top:7px; line-height:1.4}

  /* ---------- chat dock (B2) ---------- */
  /* A right-side workspace panel that sits BELOW #drawer (z60) + #scrim (z50),
     so a milestone card drawer opens over it. Every colour is a var(--token)
     so applySkin()/deriveSurfaces make it skinnable with zero extra work. */
  #chatdock{
    position:fixed; top:0; right:0; height:100vh; width:min(460px,94vw); z-index:40;
    background:var(--parch2); border-left:3px solid var(--edge2);
    box-shadow:-8px 0 30px rgba(70,54,20,.28);
    transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column;
  }
  #chatdock.open{transform:translateX(0)}
  #chatdock .dhead{
    display:flex; align-items:center; gap:8px; padding:16px 16px 12px;
    background:linear-gradient(var(--surf-head1),var(--surf-head2)); border-bottom:2px solid var(--edge2);
  }
  #chatdock .dhead h2{margin:0; font-family:var(--serif); font-size:19px; line-height:1.2; flex:1}
  #chatdock .dbody{overflow-y:auto; padding:14px 16px 24px; flex:1; display:flex; flex-direction:column}
  #chatdock .cd-scroll{flex:1; overflow-y:auto}
  .cd-hbtn{background:var(--badge-bg); color:var(--badge-ink); border:1px solid var(--badge-border);
    border-radius:8px; padding:5px 9px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--sans); flex:0 0 auto}
  .cd-hbtn:hover{background:var(--btn-dark-hover); border-color:var(--gold)}
  /* access-tier badges (dec-chat-access-tiers): observer green/available token,
     board-editor blue, workspace-builder gold, full-autonomy RED. */
  .cd-badge{display:inline-flex; align-items:center; padding:2px 8px; border-radius:12px; font-size:10px;
    font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--node-icon-ink); border:1px solid rgba(0,0,0,.18)}
  .cd-badge.observer{background:var(--st-available)}
  .cd-badge.board-editor{background:var(--tier-blue)}
  .cd-badge.workspace-builder{background:var(--gold)}
  .cd-badge.full-autonomy{background:var(--tier-red)}
  .cd-badge.standard{background:var(--gold)}
  .cd-badge.custom{background:var(--st-locked)}
  /* chat list rows */
  .cd-row{display:flex; flex-direction:column; gap:5px; background:var(--parch3); border:1px solid var(--edge);
    border-radius:10px; padding:10px 12px; margin:8px 0; box-shadow:var(--shadow); cursor:pointer}
  .cd-row:hover{border-color:var(--gold)}
  .cd-rtop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .cd-row .cd-rtitle{font-family:var(--serif); font-weight:700; font-size:14px; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cd-row .cd-rmeta{font-size:11px; color:var(--ink-faint)}
  /* mode picker (create view) */
  .cd-pick{display:flex; flex-direction:column; gap:9px; margin:10px 0}
  .cd-mode{display:flex; align-items:flex-start; gap:10px; background:var(--parch3); border:1px solid var(--edge);
    border-radius:10px; padding:10px 12px; cursor:pointer; box-shadow:var(--shadow)}
  .cd-mode.sel{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold), var(--shadow)}
  .cd-mode input{margin-top:3px; flex:0 0 auto; accent-color:var(--gold-deep); cursor:pointer}
  .cd-mode.disabled{cursor:not-allowed; opacity:.68}
  .cd-mode .cd-mbody{flex:1; min-width:0}
  .cd-mode .cd-mtop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .cd-mode .cd-mname{font-family:var(--serif); font-weight:700; font-size:14px}
  .cd-mode .cd-mdesc{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.45}
  .cd-mode .cd-mtools{font-size:10.5px; color:var(--ink-faint); margin-top:4px; line-height:1.4; font-style:italic}
  /* full-autonomy: red frame + its own warning sub-row naming the capabilities */
  .cd-mode.danger{border-color:var(--tier-red)}
  .cd-mode.danger.sel{box-shadow:inset 0 0 0 1px var(--tier-red), var(--shadow)}
  .cd-warnrow{display:flex; gap:8px; align-items:flex-start; background:var(--reason-bg); color:var(--reason-ink);
    border:1px solid var(--tier-red); border-left:4px solid var(--tier-red); border-radius:0 9px 9px 0;
    padding:8px 11px; margin:-4px 0 2px 0; font-size:11.5px; line-height:1.45; font-weight:600}
  .cd-warnrow .cd-warnicon{flex:0 0 auto; font-size:13px; line-height:1.2}
  /* branch control + lineage glyph */
  .cd-branchbtn{font-size:11.5px; color:var(--gold-deep); background:var(--surf-parch-gold);
    border:1px solid var(--edge2); border-radius:7px; padding:2px 8px; cursor:pointer; font-family:var(--sans)}
  .cd-branchbtn:hover{border-color:var(--gold)}
  .cd-briefchip{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
    color:var(--reason-ink); background:var(--reason-bg); border:1px solid var(--reason-border);
    border-radius:8px; padding:1px 7px}
  .rt-lineage{color:var(--gold-deep); font-weight:800; margin-right:4px}
  .roster-token.child{margin-left:26px; border-left:3px solid var(--edge2)}
  .roster-token.child.d2{margin-left:52px}
  .roster-token.child.d3{margin-left:78px}
  /* settings: chat access profile editor */
  .cap-prof{background:var(--parch3); border:1px solid var(--edge); border-radius:10px; padding:10px 12px; margin:8px 0}
  .cap-prof.danger{border-color:var(--tier-red)}
  .cap-prof .cap-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .cap-prof .cap-name{font-family:var(--serif); font-weight:700; font-size:14px; flex:1}
  .cap-prof textarea{width:100%; min-height:70px; font-family:"Consolas",monospace; font-size:11px;
    color:var(--ink); background:var(--surf-input); border:1px solid var(--edge2); border-radius:8px; padding:6px 8px; margin-top:6px}
  .cap-prof .cap-pm{font-size:11px; color:var(--ink-soft); margin-top:5px}
  .cap-prof .cap-pm code{background:var(--surf-parch-gold); border:1px solid var(--edge); border-radius:5px; padding:0 4px}
  .cap-prof .hint{font-size:11px; color:var(--ink-soft); line-height:1.45; margin-top:6px}
  .cd-anchor{background:var(--surf-gold-panel); border:1px solid var(--gold); border-radius:9px;
    padding:8px 11px; margin-bottom:10px; font-size:12px; color:var(--ink)}
  .cd-anchor b{color:var(--gold-deep)}
  /* message stream */
  .cd-msgs{display:flex; flex-direction:column; gap:10px; padding-bottom:8px}
  .cd-msg{display:flex; flex-direction:column; gap:3px; max-width:100%}
  .cd-msg .cd-who{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-faint)}
  .cd-bubble{border-radius:11px; padding:9px 12px; font-size:13px; line-height:1.5; color:var(--ink); word-wrap:break-word; overflow-wrap:anywhere}
  .cd-msg.user{align-items:flex-end}
  .cd-msg.user .cd-bubble{background:var(--surf-parch-gold); border:1px solid var(--gold-deep)}
  .cd-msg.assistant .cd-bubble{background:var(--parch3); border:1px solid var(--edge)}
  .cd-briefed{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--gold-deep);
    background:var(--surf-gold-pale); border:1px solid var(--gold); border-radius:6px; padding:1px 6px; margin-left:6px}
  /* ---- F-B injected/system-origin lines. Skill preambles, slash-command
     echoes and questlog's own anchoring brief are filed under the `user` role
     by Claude Code, but the founder never typed them. They get their own
     muted, dashed, full-width block with an honest header — never the gold
     "YOU" bubble. Long by nature, so they rest folded. ---- */
  .cd-sys{align-self:stretch; width:100%; box-sizing:border-box; background:var(--parch3);
    border:1px dashed var(--edge2); border-radius:7px; padding:6px 9px; margin:2px 0}
  .cd-sys .cd-syshead{display:flex; align-items:center; gap:6px; font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); cursor:pointer; min-height:22px}
  .cd-sys .cd-syshead .cd-caret{font-size:10px; transition:transform .15s ease}
  .cd-sys.open .cd-syshead .cd-caret{transform:rotate(90deg)}
  .cd-sys .cd-sysbody{display:none; margin-top:5px; font-size:12px; line-height:1.5; color:var(--ink-soft);
    max-height:340px; overflow-y:auto; overflow-x:auto}
  .cd-sys.open .cd-sysbody{display:block}
  .cd-sys .cd-sysbody pre{overflow-x:auto; white-space:pre}
  /* ---- tool chips (F2). The chip is a marginal annotation on a scroll, and
     the WHOLE ROW is the tap target: >=44px tall so a thumb can hit it. At
     rest it is one line; tapping unfurls the full input + output in place,
     growing downward like a folded-out map leaf. ---- */
  .cd-tool{display:flex; align-items:center; gap:7px; align-self:stretch; width:100%; box-sizing:border-box;
    font-family:"Consolas",monospace; font-size:11px; color:var(--gold-deep); background:var(--surf-parch-gold);
    border:1px solid var(--edge); border-radius:7px; padding:0 8px; margin:1px 0;
    min-height:44px; cursor:pointer; text-align:left; overflow:hidden}
  .cd-tool .cd-tname{font-weight:700; text-transform:none; flex:0 0 auto}
  .cd-tool .cd-tsum{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft)}
  .cd-tool .cd-caret{flex:0 0 auto; color:var(--gold-deep); font-size:10px; transition:transform .15s ease}
  .cd-tool.open .cd-caret{transform:rotate(90deg)}
  .cd-tool.plain{cursor:default}
  .cd-tool.err{border-color:var(--st-blocked); color:var(--st-blocked)}
  /* the unfurled leaf — its OWN horizontal scroll box, so the page body never
     scrolls sideways on a long PowerShell one-liner */
  .cd-unfurl{align-self:stretch; width:100%; box-sizing:border-box; background:var(--parch3);
    border:1px solid var(--edge); border-top:none; border-radius:0 0 7px 7px; padding:7px 9px; margin:-3px 0 2px}
  .cd-unfurl .cd-ulab{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--ink-faint); margin:2px 0 3px}
  .cd-unfurl pre{margin:0 0 4px; font-family:"Consolas",monospace; font-size:11px; line-height:1.45;
    color:var(--ink); background:var(--surf-input); border:1px solid var(--edge2); border-radius:6px;
    padding:6px 8px; overflow-x:auto; max-height:340px; overflow-y:auto; white-space:pre}
  .cd-unfurl .cd-trunc{font-size:10px; color:var(--ink-faint); font-style:italic}
  /* ---- F6 skill banner: a skill is not a tool call, it is a change of who is
     speaking. Full-width illuminated band, never an anonymous chip. ---- */
  .cd-skill{align-self:stretch; width:100%; box-sizing:border-box; background:var(--surf-parch-gold);
    border-top:2px solid var(--gold-deep); border-bottom:2px solid var(--gold-deep);
    padding:9px 12px; margin:6px 0; font-family:var(--serif); font-size:12.5px; font-weight:700;
    letter-spacing:.6px; color:var(--gold-deep); text-align:center; min-height:44px;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer}
  .cd-skill .cd-sname{text-transform:none; font-style:italic}
  /* ---- F4 context marks: a captioned gold rule between prose panels, saying
     what the agent learned or did. Groups over four chips collapse behind it. ---- */
  .cd-group{align-self:stretch; width:100%; display:flex; flex-direction:column; gap:2px; margin:3px 0}
  .cd-mark{display:flex; align-items:center; gap:9px; width:100%; box-sizing:border-box; background:none;
    border:none; padding:6px 2px; min-height:44px; cursor:pointer; font-family:var(--sans);
    font-size:11px; color:var(--gold-deep); letter-spacing:.3px}
  .cd-mark::before,.cd-mark::after{content:""; flex:1 1 auto; height:1px; background:var(--gold-deep); opacity:.5}
  .cd-mark .cd-mtext{flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%}
  .cd-mark .cd-mcount{color:var(--ink-faint); font-size:10px}
  .cd-group.folded .cd-gbody{display:none}
  .cd-gbody{display:flex; flex-direction:column; gap:2px}
  /* ---- P5 retry chip: LIVE and replaceable, never a tombstone. The turn is
     still alive, so this reads as in-progress, not as a failure. ---- */
  .cd-retry{align-self:flex-start; width:auto; display:inline-flex; min-height:0; padding:5px 9px;
    cursor:default; color:var(--ink-soft); background:var(--parch3); border-style:dashed}
  .cd-retry .cd-rspin{display:inline-block; animation:cdspin 1.6s linear infinite}
  @keyframes cdspin{to{transform:rotate(360deg)}}
  .cd-retryline{font-size:11px; color:var(--ink-faint); font-style:italic; align-self:flex-start; margin:1px 0}
  .cd-result{font-size:11px; color:var(--ink-faint); font-style:italic; align-self:flex-start; margin-top:2px}
  .cd-err{font-size:12px; color:var(--st-blocked); background:var(--parch3); border:1px solid var(--st-blocked);
    border-radius:9px; padding:8px 11px; margin:4px 0}
  /* 3-dot typing indicator — token-coloured (contract §5) */
  .cd-typing{display:inline-flex; gap:4px; align-items:center; padding:8px 12px}
  .cd-typing span{width:7px; height:7px; border-radius:50%; background:var(--gold-deep); opacity:.35; animation:cdblink 1.2s infinite}
  .cd-typing span:nth-child(2){animation-delay:.2s}
  .cd-typing span:nth-child(3){animation-delay:.4s}
  @keyframes cdblink{0%,60%,100%{opacity:.3} 30%{opacity:.95}}
  /* composer */
  .cd-composer{display:flex; gap:8px; align-items:flex-end; border-top:2px solid var(--edge2); padding-top:10px; margin-top:6px}
  .cd-composer textarea{flex:1; font-family:var(--sans); font-size:13px; color:var(--ink);
    background:var(--surf-input); border:1px solid var(--edge2); border-radius:8px; padding:7px 9px; resize:vertical; min-height:42px; max-height:160px}
  .cd-composer textarea:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
  .cd-xlink{font-size:11.5px; color:var(--st-available); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-family:var(--sans)}
  .cd-back{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:12px; padding:0; font-family:var(--sans)}
  .cd-back:hover{color:var(--gold-deep)}
</style>

<header>
  <div class="brand">
    <span class="mark">QUESTLOG</span>
    <span class="pname" id="pname">—</span>
    <span class="ptag" id="ptag"></span>
  </div>
  <div class="spacer"></div>
  <span class="badge" id="progress"><span class="num">0</span> / <span class="num">0</span> milestones</span>
  <span class="badge" id="rollup" style="display:none" title="This road plus everything branching off it"></span>
  <span class="badge" id="pendingBadge" style="display:none"><span class="num">0</span> waiting</span>
  <span class="badge" id="contestedBadge" style="display:none" title="Colliding writes held for your ruling — both versions kept, nothing overwritten">⚖ <span class="num">0</span> contested</span>
