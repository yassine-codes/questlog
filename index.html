  function openMilestone(mid){ sel={mode:"milestone",id:mid}; renderMilestoneBody(mid); openDrawer(); }
  function openDecisions(){ sel={mode:"decisions"}; renderDecisionsBody(); openDrawer(); }
  function openTimeline(){ sel={mode:"history"}; renderTimelineBody(); openDrawer(); }
  function openSessions(){ sel={mode:"sessions"}; renderSessionsBody(); openDrawer(); }

  // ==================================================================
  // CHAT DOCK (B2) — a right-side workspace panel below #drawer. Each chat is a
  // real headless Claude Code session (backend chat.mjs). Three views live in
  // #cdbody: list, create (mode picker), active (streaming transcript). Colours
  // are all var(--token) so applySkin() reskins the dock for free. The dock
  // owns no state on the server beyond the frozen routes; SSE carries streaming.
  // ==================================================================
  const cdEls = {
    dock: $("chatdock"), body: $("cdbody"), title: $("cdtitle"), newBtn: $("cdNew"), closeBtn: $("cdclose"),
  };
  // dockView: "list" | "create" | "active". chatCtx holds the live chat view's
  // transient render state (SSE source, the streaming assistant bubble, etc.).
  let dockOpen=false, dockView="list";
  let createCtx=null;   // {roadId, milestoneId, anchorTitle, profile, branchFromSessionId}
  let cdProfiles=null;  // live chat.profiles table from /api/config (labels + tool lists)
  let chatCtx=null;     // {id, es, running, liveBubble, msgsEl}

  function openChatDock(){
    dockOpen=true; cdEls.dock.classList.add("open"); cdEls.dock.setAttribute("aria-hidden","false");
    renderChatList();
  }
  function closeChatDock(){
    dockOpen=false; cdEls.dock.classList.remove("open"); cdEls.dock.setAttribute("aria-hidden","true");
    teardownChatSSE(); dockView="list"; chatCtx=null; createCtx=null;
  }
  function teardownChatSSE(){
    if(chatCtx && chatCtx.es){ try{ chatCtx.es.close(); }catch{} chatCtx.es=null; }
  }

  // The four access tiers the founder authorised (dec-chat-access-tiers). Order
  // here IS the order in the picker: safest first, full autonomy last.
  const PROFILE_ORDER = ["observer","board-editor","workspace-builder","full-autonomy"];
  const PROFILE_META = {
    observer: { label:"Observer", desc:"Reads the board and nothing else — it can look at the road, the unclear list and the freshest baton. It never changes anything. Default." },
    "board-editor": { label:"Board editor", desc:"Everything Observer can do, plus changing the board itself: milestones, items, side quests, decisions, glossary, batons, briefs and suggestions. No files on your computer, no commands." },
    "workspace-builder": { label:"Workspace builder", desc:"Everything Board editor can do, plus reading and writing files in this road's project folder. File edits are auto-accepted without asking you each time — Claude Code scopes that auto-accept to the folder the chat runs in." },
    "full-autonomy": { label:"Full autonomy", desc:"Everything without prompts — commands, files, tools. Maximum power, maximum trust. Never chosen for you." },
  };
  // The verbatim capability line for the red warning row (contract §3).
  const FULL_AUTONOMY_WARNING = "everything without prompts — commands, files, tools";
  const LEGACY_MODE_LABEL = { observer:"Observer", standard:"Standard" };
  // A record's tier: the stored profile wins; a legacy record falls back to mode.
  function profileOf(rec){
    if(rec && typeof rec.profile==="string" && rec.profile) return rec.profile;
    if(rec && rec.mode==="standard") return "standard";
    return "observer";
  }
  function profileLabel(key, profiles){
    if(profiles && profiles[key] && profiles[key].label) return profiles[key].label;
    if(PROFILE_META[key]) return PROFILE_META[key].label;
    if(LEGACY_MODE_LABEL[key]) return LEGACY_MODE_LABEL[key];
    return key;
  }
  function profileBadge(recOrKey, profiles){
    const key=(typeof recOrKey==="string")?recOrKey:profileOf(recOrKey);
    const cls=(PROFILE_META[key]||LEGACY_MODE_LABEL[key])?key:"custom";
    return '<span class="cd-badge '+esc(cls)+'">'+esc(profileLabel(key, profiles))+'</span>';
  }
  // Back-compat alias — older call sites passed a bare mode string.
  function modeBadge(mode){ return profileBadge(mode); }
  function roadLabelFor(roadId){
    if(!roadId) return (state && state.roadmap && state.roadmap.project && state.roadmap.project.name) || "this road";
    if(roadId===ROADMAP_ID){ return (state && state.roadmap && state.roadmap.project && state.roadmap.project.name) || roadId; }
    return roadId;
  }

  // ---- list view ----
  async function renderChatList(){
    dockView="list"; teardownChatSSE(); chatCtx=null;
    // Load the live tier table once so badges carry the founder's own labels.
    if(!cdProfiles){
      api("/api/config").then(cfg=>{
        const ps=cfg&&cfg.config&&cfg.config.chat&&cfg.config.chat.profiles;
        if(ps){ cdProfiles=ps; if(dockView==="list") renderChatList(); }
      }).catch(()=>{});
    }
    cdEls.title.textContent="Chats"; cdEls.newBtn.style.display="";
    cdEls.body.innerHTML='<div class="empty">Gathering chats…</div>';
    let data;
    try{ data=await api("/api/chats"); }
    catch(err){ cdEls.body.innerHTML='<div class="cd-err">Could not load chats: '+esc(err.message)+'</div>'; return; }
    const chats=(data && Array.isArray(data.chats))?data.chats:[];
    if(!chats.length){
      cdEls.body.innerHTML='<div class="empty">No chats yet. Start one with “+ New” for a board-level chat, or open a milestone card and choose “Chat about this card”.</div>';
      return;
    }
    let h='<div class="cd-scroll">';
    for(const c of chats){
      const st=c.status||"idle";
      const anchor=c.anchorMilestoneId?' · card-anchored':'';
      h+='<div class="cd-row" data-open-chat="'+esc(c.id)+'">';
      const lin=c.parentSessionId?'<span class="rt-lineage" title="branched from '+esc(c.parentSessionId)+'">⑂</span>':'';
      h+='<div class="cd-rtop">'+lin+'<span class="cd-rtitle">'+esc(c.title||"untitled chat")+'</span>'+profileBadge(c, cdProfiles)+'</div>';
      h+='<div class="cd-rtop"><span class="pill '+esc(st)+'">'+esc(st)+'</span>'
        +'<span class="cd-rmeta">'+esc(roadLabelFor(c.roadId))+anchor+' · '+esc(fmtAge(c.updatedAt))+'</span></div>';
      h+='</div>';
    }
    h+='</div>';
    cdEls.body.innerHTML=h;
    cdEls.body.querySelectorAll("[data-open-chat]").forEach(r=>r.addEventListener("click",()=>openChatActive(r.getAttribute("data-open-chat"))));
  }

  // ---- create view (access-tier picker) ----
  function openChatCreate(opts){
    // profile ALWAYS starts at observer — including when branching. Full
    // autonomy is never preselected anywhere (contract §3).
    createCtx=Object.assign({ roadId:null, milestoneId:null, anchorTitle:"", branchFromSessionId:null, branchLabel:"", model:"sonnet" }, opts||{});
    createCtx.profile="observer";
    if(!dockOpen){ dockOpen=true; cdEls.dock.classList.add("open"); cdEls.dock.setAttribute("aria-hidden","false"); }
    renderChatCreate();
    // Preseed the model picker + the live profile table from config (best-effort).
    api("/api/config").then(cfg=>{
      const m=cfg&&cfg.config&&cfg.config.chat&&cfg.config.chat.model;
      if(m){ createCtx.model=m; const el=$("cdModel"); if(el && !el.dataset.touched) el.value=m; }
      const ps=cfg&&cfg.config&&cfg.config.chat&&cfg.config.chat.profiles;
      if(ps){ cdProfiles=ps; if(dockView==="create") renderChatCreate(); }
    }).catch(()=>{});
  }
  function renderChatCreate(){
    dockView="create"; teardownChatSSE();
    cdEls.title.textContent=createCtx.branchFromSessionId?"Branch a session":"New chat";
    cdEls.newBtn.style.display="none";
    const anchored=!!createCtx.milestoneId;
    let h='<button class="cd-back" id="cdBack">‹ Back to chats</button>';
    if(createCtx.branchFromSessionId){
      h+='<div class="cd-anchor">⑂ Branching from <b>'+esc(createCtx.branchLabel||createCtx.branchFromSessionId)+'</b>. '
        +'The new chat starts with that session’s whole conversation behind it and carries on separately. '
        +'The session you branch from is only read — it keeps its own thread, untouched.</div>';
    } else if(anchored){
      h+='<div class="cd-anchor">Anchored to card <b>'+esc(createCtx.anchorTitle||createCtx.milestoneId)+'</b>. '
        +'The session will be pre-briefed with this card, its freshest baton and who built it.</div>';
    } else {
      h+='<div class="cd-anchor">Board-level chat on <b>'+esc(roadLabelFor(createCtx.roadId))+'</b>. '
        +'The session operates as the questlog chief-of-staff over the whole board.</div>';
    }
    h+='<div class="sechead">What may this chat do?</div>';
    h+='<div class="cd-pick">';
    for(const key of PROFILE_ORDER){
      const meta=PROFILE_META[key]||{label:key,desc:""};
      const isSel=(createCtx.profile===key);
      const danger=(key==="full-autonomy")?" danger":"";
      h+='<label class="cd-mode'+(isSel?" sel":"")+danger+'" data-profile="'+esc(key)+'">'
        +'<input type="radio" name="cdprofile" value="'+esc(key)+'"'+(isSel?" checked":"")+'>'
        +'<div class="cd-mbody"><div class="cd-mtop">'+profileBadge(key, cdProfiles)+'<span class="cd-mname">'+esc(profileLabel(key, cdProfiles))+'</span></div>'
        +'<div class="cd-mdesc">'+esc(meta.desc)+'</div>'
        +'<div class="cd-mtools">'+esc(profileToolSummary(key))+'</div>'
        +'</div></label>';
      // The full-autonomy warning is its OWN row, directly under the option,
      // naming the capabilities verbatim. It is never a tooltip.
      if(key==="full-autonomy"){
        h+='<div class="cd-warnrow" role="note"><span class="cd-warnicon">⚠</span><span>'
          +'This tier gives the session '+esc(FULL_AUTONOMY_WARNING)+'. '
          +'Nothing pauses to ask you. Choose it only for work you would have done yourself, unattended.'
          +'</span></div>';
      }
    }
    h+='</div>';
    // Model picker: free text with a small suggestion list; preseeded from config.
    h+='<div class="sechead">Model</div>';
    h+='<div class="cd-pick"><input type="text" id="cdModel" list="cdModelList" value="'+esc(createCtx.model||"sonnet")+'" placeholder="sonnet" style="width:100%">'
      +'<datalist id="cdModelList"><option value="sonnet"></option><option value="opus"></option><option value="haiku"></option></datalist></div>';
    h+='<div class="btnrow"><button class="btn" id="cdStart">Start chat</button></div>';
    cdEls.body.innerHTML=h;
    $("cdBack").addEventListener("click",renderChatList);
    cdEls.body.querySelectorAll(".cd-mode[data-profile]").forEach(row=>row.addEventListener("click",()=>{
      createCtx.profile=row.getAttribute("data-profile");
      cdEls.body.querySelectorAll(".cd-mode[data-profile]").forEach(r=>r.classList.toggle("sel", r===row));
      const rb=row.querySelector('input[type=radio]'); if(rb) rb.checked=true;
    }));
    const mEl=$("cdModel");
    if(mEl) mEl.addEventListener("input",()=>{ mEl.dataset.touched="1"; createCtx.model=mEl.value; });
    $("cdStart").addEventListener("click",createChat);
  }
  // Plain-language one-liner about what a tier can actually reach, read from the
  // LIVE profile table so a founder's edits in Settings show up here.
  function profileToolSummary(key){
    const p=cdProfiles&&cdProfiles[key];
    const pm=p?p.permissionMode:(key==="workspace-builder"?"acceptEdits":(key==="full-autonomy"?"bypassPermissions":null));
    if(pm==="bypassPermissions") return "No tool list — nothing is held back.";
    const list=p&&Array.isArray(p.allowedTools)?p.allowedTools:null;
    if(!list) return "";
    const board=list.filter(t=>t.indexOf("mcp__questlog__")===0).length;
    const other=list.filter(t=>t.indexOf("mcp__questlog__")!==0);
    let s=board+" board tool"+(board===1?"":"s");
    if(other.length) s+=" + "+other.join(", ");
    if(pm) s+=" · permission mode "+pm;
    return s;
  }
  async function createChat(){
    const btn=$("cdStart"); if(btn.disabled) return;
    btn.disabled=true; const old=btn.textContent; btn.textContent="Creating…";
    const payload={ profile:createCtx.profile };
    if(createCtx.branchFromSessionId) payload.branchFromSessionId=createCtx.branchFromSessionId;
    if(createCtx.roadId) payload.roadId=createCtx.roadId;
    if(createCtx.milestoneId) payload.milestoneId=createCtx.milestoneId;
    const mv=(($("cdModel")||{}).value||"").trim();
    if(mv) payload.model=mv;
    try{
      const r=await api("/api/chats",{method:"POST",body:JSON.stringify(payload)});
      const id=r && r.chat && r.chat.id;
      if(!id) throw new Error("no chat id returned");
      openChatActive(id, r.chat);
    }catch(err){
      btn.disabled=false; btn.textContent=old;
      alert("Could not create the chat: "+err.message);
    }
  }

  // ---- active chat view (streaming transcript) ----
  async function openChatActive(id, known){
    dockView="active"; teardownChatSSE();
    // F-A — seenEv/seenTools are the client's dedupe ledger. They live for the
    // whole time this chat is open (they are NOT reset per send) because the
    // duplicate they defend against is a ring REPLAY of an older turn.
    chatCtx={ id, es:null, running:false, liveBubble:null, msgsEl:null, rec:known||null,
              retryChip:null, toolNodes:{}, seenEv:new Set(), seenTools:new Set(), cursor:0 };
    cdEls.newBtn.style.display="none";
    cdEls.body.innerHTML='<div class="empty">Opening chat…</div>';
    let data;
    try{ data=await api("/api/chat/"+encodeURIComponent(id)); }
    catch(err){ cdEls.body.innerHTML='<div class="cd-err">Could not open the chat: '+esc(err.message)+'</div>'; return; }
    const rec=data && data.chat ? data.chat : (known||{id});
    chatCtx.rec=rec;
    const transcript=(data && Array.isArray(data.transcript))?data.transcript:[];
    cdEls.title.textContent=rec.title || "New chat";
    let h='<button class="cd-back" id="cdBack">‹ Back to chats</button>';
    h+='<div class="cd-rtop" style="margin:4px 0 8px">'+profileBadge(rec, cdProfiles)
      +(rec.parentSessionId?'<span class="rt-lineage" title="branched from '+esc(rec.parentSessionId)+'">⑂</span>':'')
      +'<span class="cd-rmeta">'+esc(roadLabelFor(rec.roadId))+(rec.anchorMilestoneId?' · card-anchored':'')+'</span>'
      +'<button class="cd-branchbtn" id="cdBranch" title="Start a new chat that carries this whole conversation with it">⑂ Branch</button>'
      +'<button class="cd-xlink" id="cdRoster" title="This chat is a live session in the roster">in roster ›</button></div>';
    h+='<div class="cd-scroll"><div class="cd-msgs" id="cdMsgs"></div></div>';
    h+='<div class="cd-composer"><textarea id="cdText" placeholder="Message this session…"'
      +(chatIsFirst(rec,transcript)?' data-first="1"':'')+'></textarea>'
      +'<button class="btn" id="cdSend">Send</button></div>';
    cdEls.body.innerHTML=h;
    chatCtx.msgsEl=$("cdMsgs");
    // The watermark this transcript covers. Everything at or below it is on the
    // page already, so the stream is asked to start above it.
    chatCtx.cursor=(data&&typeof data.streamCursor==="number")?data.streamCursor:0;
    for(const ev of transcript){
      // Any tool already drawn from disk must never be drawn again from the
      // ring, whatever the cursor says. toolUseId is the stable identity.
      if(ev&&ev.role==="tool"&&ev.toolUseId) chatCtx.seenTools.add(ev.toolUseId);
      renderTranscriptEvent(ev);
    }
    applyContextMarks();     // F4 — caption the chip runs in the replayed column
    scrollMsgs();
    $("cdBack").addEventListener("click",renderChatList);
    $("cdRoster").addEventListener("click",()=>openSessions());
    const brBtn=$("cdBranch");
    if(brBtn) brBtn.addEventListener("click",()=>openChatCreate({
      roadId:rec.roadId, milestoneId:rec.anchorMilestoneId||null,
      branchFromSessionId:rec.id, branchLabel:(rec.title||"this chat"), model:rec.model||"sonnet",
    }));
    $("cdSend").addEventListener("click",sendChatMessage);
    $("cdText").addEventListener("keydown",(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); sendChatMessage(); } });
    // Attach the live SSE stream. It replays only what this page does not
    // already hold (everything above chatCtx.cursor) and fans out live.
    connectChatSSE(id, chatCtx.cursor);
    if(rec.status==="running") setTyping(true);
  }
  // P5/(3) — the record is authoritative about whether a Claude session exists.
  // The old predicate asked the transcript "have we seen assistant text", which
  // is a different question and made the optimistic "briefed" chip LIE on a
  // re-send after a failed first turn.
  function chatIsFirst(chat, transcript){
    return !(chat && chat.sessionStarted) && !transcript.some(e=>e&&e.role==="assistant");
  }

  // ---- tool chips (F2/F6) -------------------------------------------------
  // Tool families, used for the chip summary and for F4's captions. Derived
  // from the tool NAME only — no guessing about what a tool did.
  const TOOL_FAMILY={
    Read:"read", Glob:"read", Grep:"read", NotebookRead:"read", ToolSearch:"read", WebFetch:"read", WebSearch:"read",
    Bash:"ran", PowerShell:"ran",
    Edit:"wrote", Write:"wrote", NotebookEdit:"wrote",
    Task:"delegated", Skill:"skill",
  };
  function toolFamily(name){
    const n=String(name||"");
    if(TOOL_FAMILY[n]) return TOOL_FAMILY[n];
    if(/^mcp__questlog__/.test(n)) return /(_upsert|_log|_pass|_create|_delete|_set_|_add|_promote|_dismiss|clear_)/.test(n)?"road":"read";
    if(/^mcp__/.test(n)) return "read";
    return "other";
  }
  // The chip's resting label: the discriminating argument, frontend-side now
  // (the backend keeps the FULL input — F2 moved this clipping here).
  function toolSummary(ev){
    const inp=ev&&ev.input;
    if(inp&&typeof inp==="object"&&!Array.isArray(inp)){
      for(const k of ["file_path","command","pattern","skill","path","query","url","description","prompt","id","title"]){
        if(typeof inp[k]==="string"&&inp[k]) return clip(inp[k],120);
      }
      const k0=Object.keys(inp)[0];
      if(k0){ let v=inp[k0]; if(typeof v!=="string"){ try{ v=JSON.stringify(v); }catch{ v=String(v); } } return clip(k0+": "+v,120); }
      return "";
    }
    if(typeof inp==="string") return clip(inp,120);
    // legacy line: only the pre-truncated detail string survives
    const d=String(ev&&ev.detail||"");
    const dash=d.indexOf(" — ");
    return dash>=0?clip(d.slice(dash+3),120):"";
  }
  function clip(s,n){ s=String(s==null?"":s); return s.length>n?s.slice(0,n)+"…":s; }
  function pretty(v){
    if(v==null) return "";
    if(typeof v==="string") return v;
    try{ return JSON.stringify(v,null,2); }catch{ return String(v); }
  }
  // One tool beat -> its DOM node. Holds the beat on the element so F4's
  // captions can count from held data only, never from re-parsed text.
  function toolNode(ev){
    // F6 — a Skill invocation is a change of who is speaking, not a tool call.
    if(String(ev.name||"")==="Skill"){
      const sk=(ev.input&&typeof ev.input==="object"&&typeof ev.input.skill==="string"&&ev.input.skill)
        || ev.attributionSkill || (String(ev.detail||"").split("skill: ")[1]||"").trim() || "a skill";
      const b=document.createElement("div"); b.className="cd-skill";
      b.innerHTML='<span>❧</span><span class="cd-sname">'+esc(sk)+'</span><span>took the quill</span>';
      b.__beat=ev;
      wireUnfurl(b,ev);
      return b;
    }
    const d=document.createElement("div");
    d.className="cd-tool"+(ev.outputIsError?" err":"");
    d.setAttribute("role","button"); d.setAttribute("tabindex","0");
    const hasDetail=(ev.input!=null&&ev.input!=="")||(typeof ev.output==="string"&&ev.output.length>0);
    if(!hasDetail) d.classList.add("plain");
    d.innerHTML='<span class="cd-tname">'+esc(ev.name||"tool")+'</span>'
      +'<span class="cd-tsum">'+esc(toolSummary(ev))+'</span>'
      +(hasDetail?'<span class="cd-caret">▸</span>':'');
    d.__beat=ev;
    if(hasDetail) wireUnfurl(d,ev);
    return d;
  }
  // Tap unfurls IN PLACE (never a modal, never moves what is above it); tap
  // again folds. Shift-tap unfurls every chip in the turn.
  function wireUnfurl(el,ev){
    const toggle=(open)=>{
      const isOpen=el.classList.contains("open");
      const want=(open===undefined)?!isOpen:open;
      if(want===isOpen) return;
      if(want){
        const leaf=document.createElement("div"); leaf.className="cd-unfurl";
        let h="";
        if(ev.input!=null&&ev.input!==""){
          h+='<div class="cd-ulab">what it was asked</div><pre>'+esc(pretty(ev.input))+'</pre>';
          if(ev.inputTruncated) h+='<div class="cd-trunc">…the rest was too long to keep.</div>';
        }
        if(typeof ev.output==="string"&&ev.output.length){
          h+='<div class="cd-ulab">'+(ev.outputIsError?"what went wrong":"what came back")+'</div><pre>'+esc(ev.output)+'</pre>';
          if(ev.outputTruncated) h+='<div class="cd-trunc">…the rest was too long to keep.</div>';
        }
        if(!h) h='<div class="cd-trunc">Nothing else was recorded for this step.</div>';
        leaf.innerHTML=h;
        el.classList.add("open");
        el.parentNode.insertBefore(leaf,el.nextSibling);
        el.__leaf=leaf;
      } else {
        el.classList.remove("open");
        if(el.__leaf&&el.__leaf.parentNode) el.__leaf.parentNode.removeChild(el.__leaf);
        el.__leaf=null;
      }
    };
    el.__toggle=toggle;
    el.addEventListener("click",(e)=>{
      if(e.shiftKey){
        const M=chatCtx&&chatCtx.msgsEl; if(!M) return;
        const want=!el.classList.contains("open");
        M.querySelectorAll(".cd-tool,.cd-skill").forEach(n=>{ if(n.__toggle) n.__toggle(want); });
        return;
      }
      toggle();
    });
    el.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  }

  function renderTranscriptEvent(ev){
    if(!ev||typeof ev!=="object") return;
    const M=chatCtx&&chatCtx.msgsEl; if(!M) return;
    if(ev.role==="user"){
      const d=document.createElement("div"); d.className="cd-msg user";
      d.innerHTML='<div class="cd-who">You'+(ev.briefed?'<span class="cd-briefed">briefed</span>':'')+'</div>'
        +'<div class="cd-bubble">'+mdlite(ev.text||"")+'</div>';
      M.appendChild(d);
    } else if(ev.role==="assistant"){
      const d=document.createElement("div"); d.className="cd-msg assistant";
      d.innerHTML='<div class="cd-who">Session</div><div class="cd-bubble">'+mdlite(ev.text||"")+'</div>';
      M.appendChild(d);
    } else if(ev.role==="system"){
      M.appendChild(systemNode(ev));
    } else if(ev.role==="tool"){
      M.appendChild(toolNode(ev));
    } else if(ev.role==="result"){
      M.appendChild(resultLine(ev));
    } else if(ev.role==="retry"){
      // A reloaded chat shows the same history, as a muted one-liner.
      const d=document.createElement("div"); d.className="cd-retryline";
      d.textContent="↻ "+retryReasonText(ev.reason)+" — tried again ("+(ev.attempt||1)+"/"+(ev.max||3)+")";
      M.appendChild(d);
    } else if(ev.role==="error"){
      const d=document.createElement("div"); d.className="cd-err"; d.textContent="⛔ "+(ev.message||"error");
      M.appendChild(d);
    }
  }
  // F-B — an injected line, attributed to whatever actually put it there.
  // Plain language, and never the founder's voice: "You" appears nowhere here.
  function systemLabel(ev){
    const o=(ev&&ev.origin)||"system";
    if(o==="skill") return "Skill instructions — "+(ev.skill||"a skill")+" (added automatically)";
    if(o==="brief") return "Chat brief — added by questlog, not typed";
    if(o==="command") return "Slash command — echoed by Claude Code";
    return "System note — added automatically";
  }
  function systemNode(ev){
    const d=document.createElement("div"); d.className="cd-sys";
    const text=(ev&&typeof ev.text==="string")?ev.text:"";
    const head=document.createElement("div"); head.className="cd-syshead";
    head.innerHTML='<span class="cd-caret">▸</span><span>'+esc(systemLabel(ev))+'</span>';
    const body=document.createElement("div"); body.className="cd-sysbody";
    body.innerHTML=mdlite(text);
    head.addEventListener("click",()=>d.classList.toggle("open"));
    d.appendChild(head); d.appendChild(body);
    return d;
  }
  function retryReasonText(reason){
    if(reason==="went-quiet") return "the session went quiet";
    if(reason==="connection") return "connection lost";
    return "something went wrong";
  }

  // ---- F4 context marks ---------------------------------------------------
  // Consecutive chips between prose panels become a captioned gold rule saying
  // what happened. Counts come ONLY from the beats held on the elements.
  // Groups over four collapse by default — the real turn on disk had 29 chips.
  const GROUP_COLLAPSE_OVER=4;
  function captionFor(beats){
    const fam={};
    for(const b of beats){ const f=toolFamily(b.name); fam[f]=(fam[f]||0)+1; }
    const parts=[];
    const n=(k)=>fam[k]||0;
    if(n("read")){
      let lines=0;
      for(const b of beats){ if(toolFamily(b.name)==="read"&&typeof b.output==="string") lines+=(b.output.match(/\n/g)||[]).length; }
      parts.push("read "+n("read")+" thing"+(n("read")===1?"":"s")+(lines?" · "+lines.toLocaleString()+" lines":""));
    }
    if(n("ran")) parts.push("ran "+n("ran")+" command"+(n("ran")===1?"":"s"));
    if(n("wrote")) parts.push("wrote "+n("wrote")+" file"+(n("wrote")===1?"":"s"));
    if(n("road")) parts.push("wrote to the road");
    if(n("delegated")) parts.push("sent out "+n("delegated")+" job"+(n("delegated")===1?"":"s"));
    if(n("other")) parts.push(n("other")+" other step"+(n("other")===1?"":"s"));
    return parts.length?parts.join(" · "):(beats.length+" step"+(beats.length===1?"":"s"));
  }
  // Walk the rendered column and wrap each run of consecutive chips. Idempotent:
  // already-grouped runs are skipped, so it can re-run as the live view grows.
  function applyContextMarks(){
    const M=chatCtx&&chatCtx.msgsEl; if(!M) return;
    const kids=Array.from(M.children);
    let run=[];
    const flush=()=>{
      if(run.length<2){ run=[]; return; }
      const beats=run.map(n=>n.__beat).filter(Boolean);
      if(!beats.length){ run=[]; return; }
      const group=document.createElement("div"); group.className="cd-group";
      const body=document.createElement("div"); body.className="cd-gbody";
      const mark=document.createElement("button"); mark.className="cd-mark"; mark.type="button";
      mark.innerHTML='<span class="cd-mtext">'+esc(captionFor(beats))+'</span>'
        +'<span class="cd-mcount">'+beats.length+'</span>';
      group.appendChild(mark); group.appendChild(body);
      M.insertBefore(group,run[0]);
      for(const n of run){
        // carry an open unfurl leaf along with its chip
        const leaf=n.__leaf;
        body.appendChild(n);
        if(leaf&&leaf.parentNode!==body) body.appendChild(leaf);
      }
      if(beats.length>GROUP_COLLAPSE_OVER) group.classList.add("folded");
      mark.addEventListener("click",()=>group.classList.toggle("folded"));
      run=[];
    };
    for(const el of kids){
      // retry lines are NEVER grouped — they are about the connection, not the work
      if(el.classList&&el.classList.contains("cd-tool")&&!el.classList.contains("cd-retry")&&el.__beat){ run.push(el); continue; }
      if(el.classList&&el.classList.contains("cd-unfurl")&&run.length){ continue; }  // stays with its chip
      flush();
    }
    flush();
  }
  function resultLine(r){
    const d=document.createElement("div"); d.className="cd-result";
    const bits=[];
    if(typeof r.costUsd==="number") bits.push("$"+r.costUsd.toFixed(4));
    if(typeof r.durationMs==="number") bits.push((r.durationMs/1000).toFixed(1)+"s");
    if(typeof r.numTurns==="number") bits.push(r.numTurns+" turn"+(r.numTurns===1?"":"s"));
    d.textContent=(r.isError?"⚠ ":"")+(bits.length?bits.join(" · "):"done");
    return d;
  }
  function scrollMsgs(){
    const sc=cdEls.body.querySelector(".cd-scroll");
    if(sc) sc.scrollTop=sc.scrollHeight;
  }
  function setTyping(on){
    if(!chatCtx||!chatCtx.msgsEl) return;
    let t=chatCtx.msgsEl.querySelector(".cd-typing");
    if(on){
      if(!t){ t=document.createElement("div"); t.className="cd-typing"; t.innerHTML="<span></span><span></span><span></span>"; chatCtx.msgsEl.appendChild(t); scrollMsgs(); }
    } else if(t){ t.remove(); }
  }
  function ensureLiveBubble(){
    if(chatCtx.liveBubble) return chatCtx.liveBubble;
    setTyping(false);
    const d=document.createElement("div"); d.className="cd-msg assistant";
    d.innerHTML='<div class="cd-who">Session</div><div class="cd-bubble"></div>';
    chatCtx.msgsEl.appendChild(d);
    chatCtx.liveBubble={ wrap:d, text:"", el:d.querySelector(".cd-bubble") };
    return chatCtx.liveBubble;
  }

  // The live retry chip (P5): ONE replaceable status chip, removed the moment
  // any real work resumes. It is never appended twice and never left behind.
  function clearRetryChip(){
    if(!chatCtx) return;
    if(chatCtx.retryChip&&chatCtx.retryChip.parentNode) chatCtx.retryChip.parentNode.removeChild(chatCtx.retryChip);
    chatCtx.retryChip=null;
  }

  // Handle one parsed SSE event (frozen shapes from chat.mjs).
  function handleChatEvent(evt){
    if(!evt||typeof evt!=="object"||!chatCtx||!chatCtx.msgsEl) return;
    // F-A GUARD 1 — every server event carries a stable per-chat evId. Seeing
    // one twice means a ring replay (reconnect, or a second connector), and a
    // replay must never draw a second copy of anything.
    if(typeof evt.evId==="number"){
      // Below the watermark this page was handed = already drawn from disk.
      // This makes the client correct ON ITS OWN: even if a server replayed
      // the whole ring, nothing already on the page is drawn a second time.
      if(evt.evId<=(chatCtx.cursor||0)) return;
      if(!chatCtx.seenEv) chatCtx.seenEv=new Set();
      if(chatCtx.seenEv.has(evt.evId)) return;
      chatCtx.seenEv.add(evt.evId);
    }
    // F-A GUARD 2 — independent identity for tool beats. A chip whose
    // toolUseId is already on the page (drawn from the persisted transcript, or
    // from an earlier event) is never appended again; its result still folds on.
    if(evt.type==="tool"&&evt.toolUseId){
      if(!chatCtx.seenTools) chatCtx.seenTools=new Set();
      if(chatCtx.seenTools.has(evt.toolUseId)) return;
      chatCtx.seenTools.add(evt.toolUseId);
    }
    if(evt.type==="delta"){
      clearRetryChip();
      const lb=ensureLiveBubble();
      lb.text+=(evt.text||"");
      lb.el.innerHTML=mdlite(lb.text);
      scrollMsgs();
    } else if(evt.type==="tool"){
      clearRetryChip();
      setTyping(false);
      // F1 — SEAL the prose panel at the tool boundary and append the chip in
      // position. The old code deliberately HOISTED every chip above the single
      // live bubble, so a 29-tool run rendered as all-chips-then-all-prose and
      // the founder could not see when the agent used a tool and then wrote.
      // The next delta opens a fresh panel BENEATH the chip: that is the fix.
      chatCtx.liveBubble=null;
      const node=toolNode(evt);
      chatCtx.msgsEl.appendChild(node);
      if(evt.toolUseId){
        if(!chatCtx.toolNodes) chatCtx.toolNodes={};
        chatCtx.toolNodes[evt.toolUseId]=node;
      }
      scrollMsgs();
    } else if(evt.type==="tool_result"){
      // F2 — the result arrives separately; fold it onto the chip it belongs to
      // so the unfurl shows both halves.
      clearRetryChip();
      const node=chatCtx.toolNodes&&evt.toolUseId?chatCtx.toolNodes[evt.toolUseId]:null;
      if(node&&node.__beat){
        node.__beat.output=evt.output;
        node.__beat.outputTruncated=!!evt.truncated;
        node.__beat.outputIsError=!!evt.outputIsError;
        if(evt.outputIsError) node.classList.add("err");
        if(node.classList.contains("plain")){
          node.classList.remove("plain");
          if(!node.querySelector(".cd-caret")){
            const c=document.createElement("span"); c.className="cd-caret"; c.textContent="▸"; node.appendChild(c);
          }
          wireUnfurl(node,node.__beat);
        }
        // a chip already unfurled re-renders so the new half shows
        if(node.classList.contains("open")&&node.__toggle){ node.__toggle(false); node.__toggle(true); }
      }
    } else if(evt.type==="retry"){
      // The turn is STILL ALIVE: typing stays on, send stays disabled, and this
      // is a live status chip — not the ⛔ tombstone. Only a final `error`
      // tombstones, and only `done` re-enables the composer.
      clearRetryChip();
      const d=document.createElement("div"); d.className="cd-tool cd-retry";
      d.innerHTML='<span class="cd-rspin">↻</span><span>'+esc(retryReasonText(evt.reason))
        +' — retrying ('+esc(String(evt.attempt||1))+'/'+esc(String(evt.max||3))+')…</span>';
      chatCtx.msgsEl.appendChild(d);
      chatCtx.retryChip=d;
      chatCtx.liveBubble=null;
      setTyping(true);
      const s=$("cdSend"); if(s) s.disabled=true;
      scrollMsgs();
    } else if(evt.type==="result"){
      clearRetryChip();
      chatCtx.msgsEl.appendChild(resultLine(evt));
      scrollMsgs();
    } else if(evt.type==="error"){
      clearRetryChip();
      setTyping(false);
      const d=document.createElement("div"); d.className="cd-err"; d.textContent="⛔ "+(evt.message||"error");
      chatCtx.msgsEl.appendChild(d); scrollMsgs();
    } else if(evt.type==="done"){
      clearRetryChip();
      chatCtx.running=false; setTyping(false);
      chatCtx.liveBubble=null;
      applyContextMarks();          // F4 — caption the runs of chips this turn produced
      const s=$("cdSend"); if(s) s.disabled=false;
      scrollMsgs();
    }
  }
  function connectChatSSE(id,since){
    let es;
    const q=(typeof since==="number"&&since>0)?("?since="+encodeURIComponent(String(since))):"";
    // NOTE: on an auto-reconnect the browser re-requests this SAME url, so the
    // server replays from the same cursor again. That is deliberate — it is how
    // a dropped connection catches up — and the evId ledger below is what stops
    // the re-replay from drawing anything twice.
    try{ es=new EventSource("/api/chat/"+encodeURIComponent(id)+"/stream"+q); }
    catch{ return; }
    chatCtx.es=es;
    es.onmessage=(e)=>{ let o=null; try{ o=JSON.parse(e.data); }catch{ return; } handleChatEvent(o); };
    es.onerror=()=>{ /* browser auto-reconnects; ring buffer replays on reconnect */ };
  }
  async function sendChatMessage(){
    if(!chatCtx) return;
    const ta=$("cdText"), btn=$("cdSend");
    const text=ta?ta.value.trim():"";
    if(!text) return;
    btn.disabled=true;
    const wasFirst=ta.getAttribute("data-first")==="1";
    // Optimistic user bubble (server also persists it; reload shows the briefed chip).
    renderTranscriptEvent({ role:"user", text, briefed:wasFirst });
    scrollMsgs();
    ta.value=""; ta.removeAttribute("data-first");
    chatCtx.running=true; chatCtx.liveBubble=null; chatCtx.toolNodes={}; clearRetryChip(); setTyping(true);
    try{
      await api("/api/chat/"+encodeURIComponent(chatCtx.id)+"/send",{method:"POST",body:JSON.stringify({text})});
      // reply arrives over SSE; if this was the first send, the title now exists.
      if(wasFirst){ cdEls.title.textContent=text.slice(0,60); }
    }catch(err){
      setTyping(false); chatCtx.running=false; btn.disabled=false;
      const code=err&&err.code;
      const d=document.createElement("div"); d.className="cd-err";
      if(code==="E_CHAT_BUSY") d.textContent="⛔ This chat is already generating a reply.";
      else if(code==="E_CHAT_CAP") d.textContent="⛔ Too many chats are replying at once — try again in a moment.";
      else d.textContent="⛔ Could not send: "+err.message;
      chatCtx.msgsEl.appendChild(d); scrollMsgs();
    }
  }

  // ==================================================================
  // SETTINGS — plain-language config editor (reads/writes /api/config).
  // Independent of /api/state: fetched fresh on open, never touched by
  // the poll loop, so a save's honest per-key messaging survives a refresh.
  // ==================================================================
  // Last EFFECTIVE config from the server, used to compute changed keys on save.
  let settingsCfg=null, settingsSources=null;

  // A field is locked when an environment variable already decides it (or the
  // port came from the --port CLI arg): the saved value can't win until removed.
  function envLocked(src){ return src==="env" || src==="cli"; }

  function settingsFormHTML(cfg, sources){
    const s=sources||{};
    const portLocked=envLocked(s.port);
    const asLocked=envLocked(s.autostart);
    const enLocked=envLocked(s["bridge.enabled"]);
    const dryLocked=envLocked(s["bridge.dryRun"]);
    const autoLocked=envLocked(s["bridge.autoTrigger"]);
    const modelLocked=envLocked(s["bridge.model"]);
    const lockNote='<div class="set-lock-note">Set by an environment variable on this computer — the saved value is ignored until that is removed.</div>';
    const b=cfg.bridge||{};
    let h='';
    h+='<div class="meta">These settings live in a plain file on this computer. Nothing changes until you click Save.</div>';

    // Door number (port)
    h+='<div class="set-field'+(portLocked?' set-locked':'')+'">';
    h+='<label class="lab" for="set-port">Door number (port)</label>';
    h+='<input type="number" id="set-port" min="1024" max="65535" step="1" value="'+esc(cfg.port)+'"'+(portLocked?' disabled':'')+'>';
    h+='<div class="hint">The address the dashboard answers on. Takes effect the next time Questlog starts.</div>';
    if(portLocked) h+=lockNote;
    h+='</div>';

    // Start with Windows
    h+='<div class="set-field'+(asLocked?' set-locked':'')+'">';
    h+='<div class="set-check"><input type="checkbox" id="set-autostart"'+(cfg.autostart?' checked':'')+(asLocked?' disabled':'')+'>';
    h+='<div><label class="lab" for="set-autostart">Start with Windows</label>';
    h+='<div class="hint">Puts a small note in your Startup folder so the server is ready when you log in. Nothing opens on screen.</div>';
    if(asLocked) h+=lockNote;
    h+='</div></div></div>';

    h+=srcNote(s["sidecar.enabled"]||"default");
    h+='</div>';
    const rep=(typeof sc.repair==="string"&&sc.repair)?sc.repair:"auto";
    const repLocked=envLocked(s["sidecar.repair"]);
    h+='<div class="set-field'+(repLocked?' set-locked':'')+'">';
    h+='<label class="lab" for="set-sidecar-repair">When Claude Code changes how it keeps those notes</label>';
    h+='<select id="set-sidecar-repair"'+(repLocked?' disabled':'')+'>';
    for(const [v,lbl] of [["auto","Fix it automatically (your standing instruction)"],["dry","Just write down what it would run"],["off","Do nothing"]]){
      h+='<option value="'+v+'"'+(rep===v?' selected':'')+'>'+esc(lbl)+'</option>';
    }
    h+='</select>';
    h+='<div class="set-consent">You asked for this one directly: when the notes change shape, one Fable session is started to teach Questlog the new shape. It may edit exactly three files and run exactly one command — nothing else is within its reach — and its work is kept only if the check afterwards passes. If it does not pass, everything is put back as it was. Every attempt lands on your board.</div>';
    if(repLocked) h+=lockNote; else h+=srcNote(s["sidecar.repair"]||"default");
    h+='</div>';
    h+='</div>'; // .set-helper

    // Chat access — the four tiers, their tool lists, and what each may never
    // exceed. Editing here can take tools AWAY or add board tools; it can never

    const profs=(ch.profiles && typeof ch.profiles==="object")?ch.profiles:{};
    h+='<div class="set-helper">';
    h+='<div class="sh-title">Chat access — what each kind of chat may do</div>';
    h+='<div class="set-consent">You picked these four tiers. Every new chat asks which one it runs as, and it cannot be changed afterwards. '
      +'You can take tools away from a tier here, or add board tools to it. You cannot raise a tier past what you approved — Questlog refuses the save, and refuses it again when the chat starts. '
      +'Leave a box empty to give that tier no tools at all. “Reset” puts a tier back to how it shipped.</div>';

      const isFull=(key==="full-autonomy");
      h+='<div class="cap-prof'+(isFull?' danger':'')+'">';
      h+='<div class="cap-top"><span class="cd-badge '+esc((PROFILE_META[key]?key:"custom"))+'">'+esc(p.label||key)+'</span>'
        +'<span class="cap-name">'+esc(key)+'</span>'
        +'<button class="btn" data-cap-reset="'+esc(key)+'" type="button">Reset</button></div>';
      if(p.permissionMode){
        h+='<div class="cap-pm">Permission mode <code>'+esc(p.permissionMode)+'</code>'
          +(isFull?' — everything without prompts: commands, files, tools.':' — file edits inside the chat’s project folder are accepted without asking each time.')
          +'</div>';
      } else {
        h+='<div class="cap-pm">No permission mode — a tool that would need your approval simply does not run.</div>';
      }
      if(Array.isArray(p.allowedTools)){
        h+='<textarea data-cap-tools="'+esc(key)+'" spellcheck="false" placeholder="one tool name per line">'+esc(tools.join("\n"))+'</textarea>';
      } else {
        h+='<div class="cap-pm">No tool list — nothing is held back.</div>';
      }
      h+='<div class="hint">'+esc(PROFILE_META[key]?PROFILE_META[key].desc:"Your own tier.")+'</div>';
      h+='</div>';
    }
    h+=srcNote(s["chat.profiles"]||"default");
    h+='</div>'; // .set-helper

    // ---- Automations (Wave 3: distillery + task board). Both OFF by default;
    // these are the founder's switches for the built-not-activated features. ----
    const dist=cfg.distillery||{}, tb=cfg.taskboard||{}, win=(tb.capacityWindow||{});
    h+='<div class="set-helper">';
    h+='<div class="sh-title">Automations — your switches</div>';
    // distillery.live
    h+='<div class="set-field" style="margin-top:8px">';
    h+='<div class="set-check"><input type="checkbox" id="set-distill-live"'+(dist.live?' checked':'')+'>';

    h+='<div class="set-consent">Off by default. When off, the Distill button on a completed workflow only prints the exact command it <em>would</em> run. When on, it runs one short headless pass (cleared nesting env, <code>--model sonnet</code>) that writes an <b>unreviewed</b> draft into <code>distillery-drafts\\</code>. It never installs anything into a skills folder.</div>';
    h+=srcNote(s["distillery.live"]||"default");

    h+='<div class="set-consent">Off by default. This only governs whether approved cards count as <em>eligible</em> for a background agent; there is no scheduler — nothing runs on a timer. You always add and approve cards by hand on the Board.</div>';

    h+='<div class="set-field">';

    h+='<span style="color:var(--ink-soft)">to</span>';

    // Save row

  // Profiles the founder clicked "Reset" on, pending the next save.
  let capResets=new Set();
  function wireSettings(){
    capResets=new Set();
    const btn=$("set-save");
    if(btn) btn.addEventListener("click", saveSettings);
    document.querySelectorAll("[data-cap-reset]").forEach(b=>b.addEventListener("click",()=>{
      const key=b.getAttribute("data-cap-reset");
      capResets.add(key);
      b.textContent="Reset on save ✓"; b.disabled=true;
      const ta=document.querySelector('[data-cap-tools="'+CSS.escape(key)+'"]');
      if(ta) ta.disabled=true;
    }));
  }

  async function saveSettings(){
    const msg=$("set-msg"), btn=$("set-save");
    if(!settingsCfg || !btn) return;
    const b0=settingsCfg.bridge||{};
    const body={};

    const portEl=$("set-port");
    if(portEl && !portEl.disabled){
      const v=parseInt(portEl.value,10);
      if(!Number.isInteger(v) || v<1024 || v>65535){
        msg.className="set-msg err";
        msg.textContent="Door number must be a whole number from 1024 to 65535.";
        return;
      }
      if(v!==settingsCfg.port) body.port=v;
    }
    const asEl=$("set-autostart");
    if(asEl && !asEl.disabled && asEl.checked!==settingsCfg.autostart) body.autostart=asEl.checked;

    const bridge={};
    const enEl=$("set-bridge-enabled");
    if(enEl && !enEl.disabled && enEl.checked!==b0.enabled) bridge.enabled=enEl.checked;
    const dryEl=$("set-bridge-dry");
    if(dryEl && !dryEl.disabled && dryEl.checked!==b0.dryRun) bridge.dryRun=dryEl.checked;
    const autoEl=$("set-bridge-auto");
    if(autoEl && !autoEl.disabled && autoEl.checked!==!!b0.autoTrigger) bridge.autoTrigger=autoEl.checked;
    const modelEl=$("set-bridge-model");
    if(modelEl && !modelEl.disabled && modelEl.value!==b0.model) bridge.model=modelEl.value;
    if(Object.keys(bridge).length) body.bridge=bridge;

    // Raids (config-only)
    const r0=settingsCfg.raids||{};
    const raids={};
    const rEnEl=$("set-raids-enabled");
    if(rEnEl && rEnEl.checked!==!!r0.enabled) raids.enabled=rEnEl.checked;
    const rootsEl=$("set-raids-roots");
    if(rootsEl){
      const arr=rootsEl.value.split("\n").map(x=>x.trim()).filter(Boolean);
      const cur=Array.isArray(r0.journalRoots)?r0.journalRoots:[];
      if(JSON.stringify(arr)!==JSON.stringify(cur)) raids.journalRoots=arr;
    }
    if(Object.keys(raids).length) body.raids=raids;

    // Roster (config-only)
    const ro0=settingsCfg.roster||{};
    const rosterEl=$("set-roster-spawn");
    if(rosterEl && rosterEl.checked!==!!ro0.allowSpawn) body.roster={allowSpawn:rosterEl.checked};

    // Chat (config-only) — default model
    const c0=settingsCfg.chat||{};
    const chat0={};
    const chatModelEl=$("set-chat-model");
    if(chatModelEl){
      const cv=(chatModelEl.value||"").trim();
      if(cv && cv!==(c0.model||"sonnet")) chat0.model=cv;
    }
    // Chat access profiles: a changed tool list is sent as an override; a
    // "Reset" click is sent as null (the server drops the override).
    const profs0=(c0.profiles && typeof c0.profiles==="object")?c0.profiles:{};
    const profPatch={};
    for(const k of capResets) profPatch[k]=null;
    document.querySelectorAll("[data-cap-tools]").forEach(ta=>{
      const key=ta.getAttribute("data-cap-tools");
      if(capResets.has(key)) return; // reset wins over an edit
      const cur=Array.isArray((profs0[key]||{}).allowedTools)?profs0[key].allowedTools:[];
      const next=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);
      if(JSON.stringify(next)!==JSON.stringify(cur)){
        const p=profs0[key]||{};
        profPatch[key]={ label:p.label||key, allowedTools:next, permissionMode:p.permissionMode||null };
      }
    });
    if(Object.keys(profPatch).length) chat0.profiles=profPatch;
    // The two clocks — the form is in minutes, the config is in milliseconds.
    const idleEl=$("set-chat-idle"), toEl=$("set-chat-timeout");
    if(idleEl && !idleEl.disabled){
      const v=parseInt(idleEl.value,10);
      if(Number.isInteger(v)&&v>0&&v*60000!==c0.idleTimeoutMs) chat0.idleTimeoutMs=v*60000;
    }
    if(toEl && !toEl.disabled){
      const v=parseInt(toEl.value,10);
      if(Number.isInteger(v)&&v>0&&v*60000!==c0.timeoutMs) chat0.timeoutMs=v*60000;
    }
    if(Object.keys(chat0).length) body.chat=chat0;

    // Sidecar (config-only + an env override on repair)
    const sc0=settingsCfg.sidecar||{};
    const side={};
    const scEnEl=$("set-sidecar-enabled");
    if(scEnEl && scEnEl.checked!==(sc0.enabled!==false)) side.enabled=scEnEl.checked;
    const scRepEl=$("set-sidecar-repair");
    if(scRepEl && !scRepEl.disabled && scRepEl.value!==(sc0.repair||"auto")) side.repair=scRepEl.value;
    if(Object.keys(side).length) body.sidecar=side;

    // Distillery (config-only)
    const d0=settingsCfg.distillery||{};
    const distEl=$("set-distill-live");
    if(distEl && distEl.checked!==!!d0.live) body.distillery={live:distEl.checked};

    // Task board (config-only)
    const tb0=settingsCfg.taskboard||{}, win0=tb0.capacityWindow||{};
    const tb={};
    const tbEnEl=$("set-tb-enabled");
    if(tbEnEl && tbEnEl.checked!==!!tb0.enabled) tb.enabled=tbEnEl.checked;
    const wStart=parseInt(($("set-tb-start")||{}).value,10);
    const wEnd=parseInt(($("set-tb-end")||{}).value,10);
    const wMax=parseInt(($("set-tb-max")||{}).value,10);
    const cw={};
    if(Number.isInteger(wStart) && wStart!==win0.startHour) cw.startHour=wStart;
    if(Number.isInteger(wEnd) && wEnd!==win0.endHour) cw.endHour=wEnd;
    if(Number.isInteger(wMax) && wMax!==win0.maxTokens) cw.maxTokens=wMax;
    if(Object.keys(cw).length) tb.capacityWindow=cw;
    if(Object.keys(tb).length) body.taskboard=tb;

    if(Object.keys(body).length===0){
      msg.className="set-msg"; msg.textContent="Nothing changed yet.";
      return;
    }

    const old=btn.textContent;
    btn.disabled=true; btn.textContent="Saving…";
    try{
      const resp=await api("/api/config",{method:"POST",body:JSON.stringify(body)});
      // No optimistic UI: rebuild the form from the fresh EFFECTIVE values.
      settingsCfg=resp.config; settingsSources=resp.sources||{};
      const formMount=$("setform")||dbody;
      formMount.innerHTML=settingsFormHTML(resp.config, resp.sources);
      wireSettings();
      // Honest per-key messaging derived from what we actually sent + needsRestart.
      const restart=Array.isArray(resp.needsRestart)?resp.needsRestart:["port"];
      const lines=[];
      if("port" in body){
        lines.push(restart.indexOf("port")>=0
          ? "Saved. The new door number takes effect after Questlog restarts — close this window and double-click Questlog again."
          : "Saved. Door number updated.");
      }
      if(body.bridge) lines.push("Saved. Helper settings count from your next note.");
      if(body.raids) lines.push("Saved. Raids settings apply right away.");
      if(body.roster) lines.push("Saved. Roster settings apply right away.");
      if(body.chat){
        if(body.chat.model) lines.push("Saved. New chats will use this model by default.");
        if(body.chat.timeoutMs||body.chat.idleTimeoutMs) lines.push("Saved. The new chat time limits count from your next message.");
      }
      if(body.sidecar) lines.push("Saved. Chat history settings apply the next time you open a chat.");
      if(body.distillery) lines.push("Saved. Distillery mode applies right away.");
      if(body.taskboard) lines.push("Saved. Task board settings apply right away.");
      if("autostart" in body) lines.push("Saved. Startup entry updated.");
      if(resp.warning) lines.push("Note: "+resp.warning);
      const nm=$("set-msg");
      nm.className="set-msg ok";
      nm.innerHTML=lines.map(esc).join("<br>");
    }catch(err){
      // 400 (E_VALIDATION) or other — inline red, nothing pretended.
      btn.disabled=false; btn.textContent=old;
      msg.className="set-msg err";
      msg.textContent="Could not save: "+err.message;
    }
  }

  async function renderSettingsBody(){
    dtitle.textContent="Settings";
    let data;
    try{ data=await api("/api/config"); }
    catch(err){ dbody.innerHTML='<div class="reason">⛔ Could not load settings: '+esc(err.message)+'</div>'; return; }
    settingsCfg=data.config; settingsSources=data.sources||{};
    // Skin manager (§1) sits above the config form; each has its own container
    // so a config Save only rebuilds the form and leaves the manager intact.
    dbody.innerHTML='<div id="skinmgr"></div><div id="setform">'+settingsFormHTML(data.config, data.sources)+'</div>';
    wireSettings();
    renderSkinManager();
  }

  // ---- Skin manager (§1): list, hover-preview, apply, revert -------------
  function skinSwatches(sk){
    // preview the skin's OWN token values (fall back to parchment for missing)
    const t=(sk && sk.tokens)?sk.tokens:{};
    const P=PARCH_TOKENS||{};
    const pick=(k)=> t[k]!=null?t[k]:(P[k]!=null?P[k]:"#ccc");
    const keys=["parch","road","gold","st-done","st-available"];
    let h='<span class="skin-swatches">';
    for(const k of keys) h+='<span class="skin-sw" style="background:'+esc(pick(k))+'"></span>';
    return h+'</span>';
  }
  async function renderSkinManager(){
    const mount=$("skinmgr"); if(!mount) return;
    let data; try{ data=await api("/api/skins"); }
    catch(err){ mount.innerHTML='<div class="sechead">Skin</div><div class="reason">⛔ Could not read skins: '+esc(err.message)+'</div>'; return; }
    const list=(data && Array.isArray(data.skins))?data.skins:[];
    // keep the parchment baseline current for previews
    const parch=list.find(s=>s.name==="parchment");
    if(parch && parch.tokens){ PARCH_TOKENS=parch.tokens; TOKEN_NAMES=Object.keys(parch.tokens); }
    const active=(data && typeof data.active==="string")?data.active:"parchment";
    ACTIVE_SKIN=active;
    activeSkinObj=list.find(s=>s.name===active)||parch||activeSkinObj;
    let h='<div class="skin-mgr"><div class="sechead">Skin — the whole map’s look</div>';
    h+='<div class="skin-hint">Hover a skin to preview it live; click to keep the preview. <b>Apply</b> saves it as your look; <b>Revert</b> restores the applied one. Built-in skins can’t be edited.</div>';
    h+='<div class="skin-list">';
    for(const sk of list){
      const isActive=sk.name===active;
      const badPairs=Array.isArray(sk.contrastFailures)?sk.contrastFailures:[];
      const sub=sk.valid
        ? ((sk.author?('by '+sk.author+' · '):'')+(sk.source==="builtin"?"built-in":"yours"))
        : ('unreadable — '+(badPairs[0]?esc(badPairs[0].pair):'contrast')+' fails');
      h+='<div class="skin-row'+(isActive?' active':'')+(sk.valid?'':' invalid')+'" data-skin="'+esc(sk.name)+'">';
      h+=skinSwatches(sk);
      h+='<div class="skin-body"><div class="skin-name">'+esc(sk.name)+(isActive?' ✓':'')+'</div>'
        +'<div class="skin-sub'+(sk.valid?'':' bad')+'">'+sub+'</div></div>';
      h+='</div>';
    }
    h+='</div>';
    h+='<div class="skin-actions">'
      +'<button class="btn" id="skin-apply" disabled>Apply</button>'
      +'<button class="btn ghost" id="skin-revert">Revert</button>'
      +'<span class="set-msg" id="skin-msg"></span></div>';
    h+='</div>';
    mount.innerHTML=h;
    wireSkinManager(list);
  }
  function wireSkinManager(list){
    let previewName=null;      // clicked (sticky) preview
    const applyBtn=$("skin-apply"), msg=$("skin-msg");
    const byName=(n)=>list.find(s=>s.name===n);
    const setApplyState=(name)=>{
      const sk=byName(name);
      const target=name||ACTIVE_SKIN;
      applyBtn.disabled = !sk || !sk.valid || target===ACTIVE_SKIN;
    };
    const rows=$("skinmgr").querySelectorAll("[data-skin]");
    rows.forEach(row=>{
      const name=row.getAttribute("data-skin");
      row.addEventListener("mouseenter",()=>{ const sk=byName(name); if(sk) applySkin(sk); });
      row.addEventListener("mouseleave",()=>{ applySkin(byName(previewName)||activeSkinObj); });
      row.addEventListener("click",()=>{
        previewName=name;
        rows.forEach(r=>r.classList.toggle("active", r.getAttribute("data-skin")===name));
        applySkin(byName(name)||activeSkinObj);
        if(msg){ msg.className="set-msg"; msg.textContent=""; }
        setApplyState(name);
      });
    });
    setApplyState(previewName);
    applyBtn.addEventListener("click", async ()=>{
      const name=previewName||ACTIVE_SKIN;
      applyBtn.disabled=true; const o=applyBtn.textContent; applyBtn.textContent="Applying…";
      try{
        const resp=await api("/api/skins/apply",{method:"POST",body:JSON.stringify({name})});
        ACTIVE_SKIN=resp.active||name;
        activeSkinObj=byName(ACTIVE_SKIN)||activeSkinObj;
        applySkin(activeSkinObj);
        renderSkinManager();   // refresh the ✓ + Apply state
      }catch(err){
        applyBtn.disabled=false; applyBtn.textContent=o;
        if(msg){ msg.className="set-msg err";
          msg.textContent = err.code==="E_SKIN_CONTRAST" ? ("Can’t apply — "+err.message) : ("Could not apply: "+err.message); }
        // restore the applied look after a failed apply
        applySkin(activeSkinObj);
      }
    });
    $("skin-revert").addEventListener("click",()=>{
      previewName=null;
      applySkin(activeSkinObj);
      rows.forEach(r=>r.classList.toggle("active", r.getAttribute("data-skin")===ACTIVE_SKIN));
      if(msg){ msg.className="set-msg"; msg.textContent="Reverted to the applied skin."; }
      setApplyState(null);
    });
  }

  function wireDrawerActions(){

             await poll(true); }

    // dec-remove-decision-buttons: the founder-facing walk-back buttons are gone
    // from the log (approved/rejected show recorded state only). The API endpoint
    // stays — agents record rulings from chat — so no decision buttons are wired.
    // F2 — "⊕ More horizons": record the ask, show the chip. No LLM here; an

    dbody.querySelectorAll("[data-more-horizons]").forEach(btn=>btn.addEventListener("click", async ()=>{
      const mid=btn.getAttribute("data-more-horizons");

        await poll(true);

    }));
    // F4 — expand / collapse from the portal card.

      const mid=btn.getAttribute("data-expand-btn");

    // F3 — promote a side quest into its own road.
    dbody.querySelectorAll("[data-promote]").forEach(btn=>btn.addEventListener("click", async ()=>{
      const questId=btn.getAttribute("data-promote");
      const title=btn.getAttribute("data-promote-title")||questId;

      const dir=prompt('Promote "'+title+'" ('+n+' milestone(s)) into its own road.\n\n'
        +'Same goal stays inline; an own definition of done earns its own map.\n\n'
        +'Folder for the new road (it will hold its own .questlog):', "");
      if(!dir || !dir.trim()) return;
      btn.disabled=true; const old=btn.textContent; btn.textContent="Promoting…";
      try{
        const r=await api(API_PREFIX+"/promote",{method:"POST",body:JSON.stringify({questId, targetDir:dir.trim()})});
        await poll(true);
        alert('Promoted. "'+title+'" is now the road "'+(r.childName||r.childId)+'" and this branch is a single doorway.');
      }catch(err){ alert("Could not promote: "+err.message); btn.disabled=false; btn.textContent=old; }
    }));
    // F3 (reverse) — dissolve a child road back inline.
    dbody.querySelectorAll("[data-demote]").forEach(btn=>btn.addEventListener("click", async ()=>{
      const childId=btn.getAttribute("data-demote");
      const name=btn.getAttribute("data-demote-name")||childId;
      if(!confirm('Dissolve "'+name+'" back into this road?\n\nIts milestones return here as a side quest, the doorway disappears, and the family-tree link is removed. The folder stays on disk as an archive.')) return;
      btn.disabled=true; const old=btn.textContent; btn.textContent="Dissolving…";
      try{
        const r=await api(API_PREFIX+"/demote",{method:"POST",body:JSON.stringify({childId})});
        // whatever was expanded for that portal is meaningless now
        if(r && r.portalMilestoneId){
          delete expandedBlocks[r.portalMilestoneId];
          QL_FEAT.saveExpanded(localStorage, ROADMAP_ID,
            QL_FEAT.loadExpanded(localStorage, ROADMAP_ID).filter(x=>x!==r.portalMilestoneId));
        }
        closeDrawer();
        await poll(true);
      }catch(err){ alert("Could not dissolve: "+err.message); btn.disabled=false; btn.textContent=old; }
    }));
    dbody.querySelectorAll("[data-unclear]").forEach(b=>b.addEventListener("click", async ()=>{
      const id=b.getAttribute("data-unclear");
      const targetType=b.getAttribute("data-unclear-type");
      const cur=b.getAttribute("data-unclear-cur")==="1";
      b.disabled=true;
      try{
        await api(API_PREFIX+"/unclear",{method:"POST",body:JSON.stringify({targetType,id,unclear:!cur,baseVersion:baseVersionOf(id)})});
        await poll(true);
      }catch(err){
        // E_CONTESTED is not a failure and gets no dialog. The change was HELD:
        // nothing was applied, nothing was discarded, and the card is about to
        // re-render carrying the contested block that says so.
        if(err.code==="E_CONTESTED"){ await poll(true); return; }
        alert("Could not update the unclear flag: "+err.message); b.disabled=false;
      }
    }));
    // Delete (see deleteBtn): click 1 arms the inline strip, click 2 acts. Same
    // ~5s auto-reset as the overworld's remove control, so an armed destructive
    // button never sits waiting on a card the founder has walked away from.
    dbody.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
      const strip=b.nextElementSibling;
      if(!strip || !strip.classList.contains("delconfirm")) return;
      strip.classList.add("on");
      if(strip._t) clearTimeout(strip._t);
      strip._t=setTimeout(()=>strip.classList.remove("on"), 5000); // auto-reset
    }));
    dbody.querySelectorAll("[data-del-no]").forEach(b=>b.addEventListener("click",()=>disarmDelete(b.closest(".delconfirm"))));
    dbody.querySelectorAll("[data-del-yes]").forEach(b=>b.addEventListener("click",()=>doDelete(b,false)));
    // "view both versions" on a contested card — the drawer swaps to the
    // conflict view; the card itself is left exactly as it was.
    dbody.querySelectorAll("[data-open-contested]").forEach(a=>a.addEventListener("click",()=>openContested()));
  }

  // The ruling buttons, wired in ONE function (see conflictActions for why they
  // exist at all). Click 1 arms the strip, click 2 rules — the same two-step,
  // same ~5s auto-reset as the delete control, because a founder-facing control
  // that changes the road should never sit armed on an abandoned screen.
  function wireConflictActions(){
    dbody.querySelectorAll("[data-cf-arm]").forEach(b=>b.addEventListener("click",()=>{
      const strip=b.nextElementSibling;
      if(!strip || !strip.classList.contains("delconfirm")) return;
      strip.classList.add("on");
      if(strip._t) clearTimeout(strip._t);
      strip._t=setTimeout(()=>strip.classList.remove("on"), 5000); // auto-reset
    }));
    dbody.querySelectorAll("[data-cf-keep]").forEach(b=>b.addEventListener("click", async ()=>{
      const id=b.getAttribute("data-cf-id"), keep=b.getAttribute("data-cf-keep");
      const strip=b.closest(".delconfirm"); if(strip && strip._t) clearTimeout(strip._t);
      b.disabled=true; const old=b.textContent; b.textContent="Ruling\u2026";
      try{
        await api(API_PREFIX+"/conflict/resolve",{method:"POST",body:JSON.stringify({id,keep})});
      }catch(err){
        alert("Could not record the ruling: "+err.message);
        b.disabled=false; b.textContent=old; return;
      }
      await poll(true);
    }));
  }

  // Fold an armed strip back up and cancel its pending auto-reset.
  function disarmDelete(strip){
    if(!strip) return;
    if(strip._t) clearTimeout(strip._t);
    strip.classList.remove("on");
  }

  // The delete call itself, shared by the first "Delete" and the "…and all N"
  // that a 409 offers. Everything it needs is on the button that armed the strip,
  // so the strip can be rewritten in place without losing what it is about.
  async function doDelete(btn, force){
    const strip=btn.closest(".delconfirm"); if(!strip) return;
    const trigger=strip.previousElementSibling;          // the .del-btn above it
    const id=trigger&&trigger.getAttribute("data-del");
    const targetType=trigger&&trigger.getAttribute("data-del-type");
    if(!id||!targetType) return;
    if(strip._t) clearTimeout(strip._t);                 // committed — stop the auto-reset
    btn.disabled=true; const old=btn.textContent; btn.textContent="Deleting…";
    let r;
    try{
      r=await api(API_PREFIX+"/delete",{method:"POST",body:JSON.stringify({targetType,id,force,baseVersion:baseVersionOf(id)})});
    }catch(err){
      // A 409 is not a failure. It is the server saying this one does not travel
      // alone; the strip rewrites itself to name what would go and asks again.
      if(err.code==="E_CONFLICT"){ armCascade(strip, err); return; }
      // Neither is a 409 E_CONTESTED. The delete was based on a version that has
      // moved on, so it was HELD, not lost: the card grows a contested block and
      // the ruling decides whether it goes.
      if(err.code==="E_CONTESTED"){ disarmDelete(strip); await poll(true); return; }
      alert("Could not delete: "+err.message); btn.disabled=false; btn.textContent=old; return;
    }
    // Whatever left the road cannot stay expanded — drop the deleted id AND
    // everything that cascaded with it, from the live set and from localStorage.
    const gone=[id].concat(((r&&r.cascaded)||[]).map(x=>x&&x.id).filter(Boolean));
    for(const g of gone) delete expandedBlocks[g];
    QL_FEAT.saveExpanded(localStorage, ROADMAP_ID,
      QL_FEAT.loadExpanded(localStorage, ROADMAP_ID).filter(x=>gone.indexOf(x)<0));
    // An item's card survives the delete; a milestone's or a quest's does not, so
    // close first rather than flash "This milestone no longer exists."
    if(targetType!=="item") closeDrawer();
    await poll(true);
  }

  // The 409 body carries a STRUCTURED dependents list (the MCP tool's version of
  // the same refusal is one sentence for an agent to read; the board gets the
  // records). Name them, then offer the single button that cascades — the
  // founder chooses to take the whole branch, the server never decides that.
  function armCascade(strip, err){
    const deps=(err.body&&Array.isArray(err.body.dependents))?err.body.dependents:[];
    const q=strip.querySelector(".fcq"), a=strip.querySelector(".fca");
    if(!q||!a) return;
    const trigger=strip.previousElementSibling;
    const title=(trigger&&trigger.getAttribute("data-del-title"))||"this";
    q.innerHTML='Deleting "'+esc(title)+'" takes '+deps.length+' other '
      +(deps.length===1?"record":"records")+' with it: '
      +deps.map(d=>esc(d.type)+' “'+esc(d.title||d.id)+'”').join(", ")
      +'. History keeps a copy of every one.';
    a.innerHTML='<button class="btn sm danger" type="button" data-del-force="1">Delete all '+deps.length+' of these too</button>'
      +'<button class="btn sm ghost" type="button" data-del-no="1">Keep</button>';
    a.querySelector("[data-del-force]").addEventListener("click",(e)=>doDelete(e.currentTarget,true));
    a.querySelector("[data-del-no]").addEventListener("click",()=>disarmDelete(strip));
    strip.classList.add("on");
  }

  async function poll(force){
    try{
      const data=await api(API_PREFIX+"/state");
      if(!force && data.rev===lastRev) return;
      lastRev=data.rev; state=data;
      peekCache.clear();   // child roads may have moved on; re-fetch peeks lazily
      renderChrome();
      renderLineageBanner();
      renderMap();
      restoreExpanded();   // re-open whatever this road had expanded (localStorage)
      refreshDrawer();
    }catch(err){
      if(MODE==="central" && VIEW==="road" && err && err.status===404){
        renderMissingWorld();
        return;
      }
      foot.textContent="⚠ Cannot reach server: "+err.message;
    }
  }

  // WORLD-SELECT — central overworld (level-select screen)
  // ==================================================================
  // Overworld = a family map. Roots anchor the left; children branch to the
  // right along drawn origin edges; an orphan (parent not in the registry)
  // gets a greyed ghost-parent stub. Each node carries its own progress plus a
  // roll-up of everything branching off it. Deterministic tidy-tree layout.
  const F_NW=252, F_NH=104, F_COLGAP=64, F_ROWGAP=24;
  const F_COLW=F_NW+F_COLGAP, F_ROWH=F_NH+F_ROWGAP;

  // Two-step "remove this world" control (founder-facing). No browser confirm():
  // click 1 arms an inline confirm strip (auto-resets ~5s / on re-render), click
  // 2 unregisters. Registry-only — the road's data on disk is never touched.
  function fremoveHTML(r){
    return '<button class="fremove" type="button" data-unreg="'+esc(r.id)+'" title="Remove this world from the overworld" aria-label="Remove from overworld">✕</button>'
      +'<div class="fconfirm" data-fconfirm="'+esc(r.id)+'">'
      +'<div class="fcq">Remove from overworld? Data on disk is untouched.</div>'
      +'<div class="fca"><button class="btn sm danger" type="button" data-unreg-yes="'+esc(r.id)+'">Remove</button>'
      +'<button class="btn sm ghost" type="button" data-unreg-no="'+esc(r.id)+'">Keep</button></div>'
      +'<div class="fcnote">A live road re-registers itself on its next dir-mode start.</div></div>';
  }
  function fnodeHTML(r,x,y){
    const st=r.missing ? "locked" : (r.status||"available");
    let h='';
    if(r.missing){
      h+='<a class="fnode missing" href="/r/'+encodeURIComponent(r.id)+'" style="left:'+x+'px;top:'+y+'px;width:'+F_NW+'px;min-height:'+F_NH+'px">';
      h+='<div class="ftop"><span class="fdot" style="background:var(--st-locked)"></span>'
        +'<span class="fname">'+esc(r.name||r.id)+'</span><span class="pill blocked">MISSING</span></div>';
      h+='<div class="fwarn">folder not found on disk</div>';
      h+='<div class="ffoot"><span>'+esc(r.dir||"")+'</span></div>';
      h+=fremoveHTML(r);
      h+='</a>';
      return h;
    }
    const prog=(r.progress&&typeof r.progress==="object")?r.progress:{done:0,total:0};
    const done=prog.done||0, total=prog.total||0;
    const pct=total>0?Math.round(done/total*100):0;
    const fs2=(r.fullStory&&typeof r.fullStory==="object")?r.fullStory:null;
    const hasDesc=fs2 && fs2.descendants && fs2.descendants.total>0;
    const sc=fs2 ? (fs2.sessionCount||0) : ((typeof r.sessionCount==="number")?r.sessionCount:0);
    const isRoot=!r.origin;
    h+='<a class="fnode" href="/r/'+encodeURIComponent(r.id)+'" style="left:'+x+'px;top:'+y+'px;width:'+F_NW+'px;min-height:'+F_NH+'px">';
    h+='<div class="ftop"><span class="fdot" style="background:var(--st-'+esc(st)+')"></span>'
      +'<span class="fname">'+esc(r.name||r.id)+'</span>'
      +'<span class="froot">'+(isRoot?"root":"branch")+'</span></div>';
    if(r.tagline) h+='<div class="ftag">'+esc(r.tagline)+'</div>';
    h+='<div class="fbar"><span style="width:'+pct+'%"></span></div>';
    h+='<div class="fcap"><span>'+done+' / '+total+' here</span>';
    if(hasDesc){
      const ad=(fs2.own.done||0)+(fs2.descendants.done||0);
      const at=(fs2.own.total||0)+(fs2.descendants.total||0);
      h+='<span class="froll">'+ad+' / '+at+' whole story</span>';
    } else h+='<span></span>';
    h+='</div>';
    h+='<div class="ffoot"><span>◈ '+sc+' session'+(sc===1?'':'s')+'</span>'
      +'<span>Updated '+esc(fmtDate(r.updatedAt))+'</span></div>';
    if(r.lineageError==="cycle") h+='<div class="fwarn">⚠ lineage loop — treated as a root</div>';
    else if(r.lineageError==="too_deep") h+='<div class="fwarn">⚠ too deep — treated as a root</div>';
    h+=fremoveHTML(r);
    h+='</a>';
    return h;
  }

  function renderWorlds(data){
    const roadmaps=(data && Array.isArray(data.roadmaps)) ? data.roadmaps : [];
    if(roadmaps.length===0){
      mapmount.innerHTML='<div class="worlds"><div class="worlds-empty empty">No worlds registered yet. '
        +'Run a road with --dir once, or call roadmap_register.</div></div>';
      return;
    }
    const byId=new Map();
    for(const r of roadmaps) if(r && r.id && !byId.has(r.id)) byId.set(r.id, r);
    const present=new Set(byId.keys());
    // Accepted children come straight off the server (already cycle/depth-safe).
    const kidsOf=(id)=>{ const r=byId.get(id); return (r && Array.isArray(r.children)) ? r.children.filter(c=>present.has(c)) : []; };
    const childSet=new Set();
    for(const id of byId.keys()) for(const c of kidsOf(id)) childSet.add(c);
    const roots=[...byId.keys()].filter(id=>!childSet.has(id)); // registry order preserved
    const anyOrphan=roots.some(id=>{ const r=byId.get(id); return r && r.orphan && r.origin; });

    // depth (column) via DFS from roots
    const depth=new Map();
    const sd=(id,d)=>{ depth.set(id,d); for(const c of kidsOf(id)) sd(c,d+1); };
    for(const id of roots) sd(id,0);

    // y (row): tidy-tree — leaves take sequential slots, parents center on kids
    const rowY=new Map(); let leaf=0;
    const assignY=(id)=>{
      const ks=kidsOf(id);
      if(ks.length===0){ const y=leaf*F_ROWH; rowY.set(id,y); leaf++; return y; }
      const ys=ks.map(assignY);
      const y=(ys[0]+ys[ys.length-1])/2; rowY.set(id,y); return y;
    };
    for(const id of roots) assignY(id);

    const X_BASE = 12 + (anyOrphan ? F_COLW : 0);
    let maxDepth=0; for(const d of depth.values()) maxDepth=Math.max(maxDepth,d);
    const totalW = X_BASE + maxDepth*F_COLW + F_NW + 12;
    const totalH = Math.max(leaf,1)*F_ROWH + 8;
    const xOf=(id)=> X_BASE + (depth.get(id)||0)*F_COLW;

    // ---- edges (SVG behind the nodes) ----
    let edges='<svg class="edges" width="'+totalW+'" height="'+totalH+'" viewBox="0 0 '+totalW+' '+totalH+'">';
    for(const id of byId.keys()){
      const px=xOf(id)+F_NW, py=(rowY.get(id)||0)+F_NH/2;
      for(const c of kidsOf(id)){
        const cx=xOf(c), cy=(rowY.get(c)||0)+F_NH/2;
        const mx=(px+cx)/2;
        edges+='<path d="M '+px+' '+py+' C '+mx+' '+py+' '+mx+' '+cy+' '+cx+' '+cy+'" '
          +'fill="none" stroke="var(--road-edge)" stroke-width="6" stroke-linecap="round"/>';
        edges+='<path d="M '+px+' '+py+' C '+mx+' '+py+' '+mx+' '+cy+' '+cx+' '+cy+'" '
          +'fill="none" stroke="var(--road)" stroke-width="3" stroke-linecap="round"/>';
      }
    }
    // orphan ghost-parent stubs (dashed, greyed)
    let ghosts='';
    for(const id of roots){
      const r=byId.get(id);
      if(!(r && r.orphan && r.origin)) continue;
      const gx=xOf(id)-F_COLW, gy=rowY.get(id)||0;
      const cy=(rowY.get(id)||0)+F_NH/2, gpy=gy+F_NH/2, gpx=gx+F_NW, cx=xOf(id);
      const mx=(gpx+cx)/2;
      edges+='<path d="M '+gpx+' '+gpy+' C '+mx+' '+gpy+' '+mx+' '+cy+' '+cx+' '+cy+'" '
        +'fill="none" stroke="var(--st-locked)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>';
      ghosts+='<div class="fghost" style="left:'+gx+'px;top:'+gy+'px;width:'+F_NW+'px;height:'+F_NH+'px">'
        +'<div class="fgh">missing parent</div>'
        +'<div class="fgid">'+esc(r.origin.roadmapId)+'</div>'
        +'<div>not in the registry</div></div>';
    }
    edges+='</svg>';

    // ---- nodes ----
    let nodes='';
    for(const id of byId.keys()) nodes+=fnodeHTML(byId.get(id), xOf(id), rowY.get(id)||0);

    mapmount.innerHTML='<div class="ftree-scroll"><div class="ftree" style="width:'+totalW+'px;height:'+totalH+'px">'
      +edges+ghosts+nodes+'</div></div>';
    // glossary underlines on node names/taglines
    mapmount.querySelectorAll(".fname,.ftag").forEach(glossarize);
    wireWorldRemove();
  }

  // Wire the per-card two-step remove control (see fremoveHTML). Each handler
  // preventDefault+stopPropagation because the card is an <a> to the road view.
  function wireWorldRemove(){
    mapmount.querySelectorAll("[data-unreg]").forEach(b=>b.addEventListener("click",(e)=>{
      e.preventDefault(); e.stopPropagation();
      const card=b.closest(".fnode"); const cf=card && card.querySelector(".fconfirm");
      if(!cf) return;
      cf.classList.add("on");
      if(cf._t) clearTimeout(cf._t);
      cf._t=setTimeout(()=>cf.classList.remove("on"), 5000); // auto-reset
    }));
    mapmount.querySelectorAll("[data-unreg-no]").forEach(b=>b.addEventListener("click",(e)=>{
      e.preventDefault(); e.stopPropagation();
      const cf=b.closest(".fconfirm"); if(cf){ if(cf._t) clearTimeout(cf._t); cf.classList.remove("on"); }
    }));
    mapmount.querySelectorAll("[data-unreg-yes]").forEach(b=>b.addEventListener("click",async (e)=>{
      e.preventDefault(); e.stopPropagation();
      const id=b.getAttribute("data-unreg-yes");
      b.disabled=true;
      try{ await api("/api/registry/unregister",{method:"POST",body:JSON.stringify({id})}); }
      catch(err){ foot.textContent="Could not remove that world: "+err.message; b.disabled=false; return; }
      pollWorlds(true);   // re-render without the removed card
    }));
  }

  async function pollWorlds(force){
    try{
      const data=await api("/api/registry");
      if(!force && data.rev===wsLastRev) return;
      wsLastRev=data.rev;
      renderWorlds(data);
    }catch(err){
      mapmount.innerHTML='<div class="world-missing-wrap"><div class="card">'
        +'<div class="summary">⚠ Cannot reach the registry: '+esc(err.message)+'</div></div></div>';
    }
  }

  function startWorldSelect(){
    document.body.classList.add("ws-mode");
    $("pname").textContent="Overworld";
    $("ptag").textContent="Choose a world";
    document.title="QUESTLOG — Overworld";
    pollWorlds(true);
    setInterval(()=>pollWorlds(false), POLL_MS);
  }

  // ==================================================================
  // IN-ROAD SWITCHER — jump between roads / back to the overworld
  // ==================================================================
  function ensureSwitcher(){
    if(switchEl) return;
    switchEl=document.createElement("select");
    switchEl.id="worldSwitch";
    switchEl.setAttribute("aria-label","Switch world");
    switchEl.innerHTML='<option value="">⌂ Overworld</option>';
    switchEl.addEventListener("change",()=>{
      const v=switchEl.value;
      location.href = v ? ("/r/"+v) : "/";
    });
    const prog=$("progress");
    prog.parentNode.insertBefore(switchEl, prog);
  }
  function renderSwitcher(data){
    if(!switchEl) return;
    const roadmaps=(data && Array.isArray(data.roadmaps)) ? data.roadmaps.filter(r=>!r.missing) : [];
    let h='<option value="">⌂ Overworld</option>';
    for(const r of roadmaps){
      h+='<option value="'+esc(r.id)+'"'+(r.id===ROADMAP_ID?' selected':'')+'>'+esc(r.name||r.id)+'</option>';
    }
    switchEl.innerHTML=h;
  }
  async function loadSwitcher(){
    try{ renderSwitcher(await api("/api/registry")); }catch{}
  }

  // ==================================================================
  // ROAD VIEW — the single-road dashboard (dir mode + central road)
  // ==================================================================
  function startRoad(){
    if(MODE==="central"){
      ensureSwitcher();
      loadSwitcher();
      setInterval(loadSwitcher, SWITCHER_MS);
    }
    poll(true);
    setInterval(()=>poll(false), POLL_MS);
  }

  // ==================================================================
  // BOOT — probe mode, parse route, dispatch
  // ==================================================================
  async function boot(){
    let mode="dir";
    try{ const m=await api("/api/mode"); if(m && m.mode) mode=m.mode; }
    catch{ mode="dir"; }   // 404 / network error => treat as dir (back-compat)
    MODE=mode;
    // Apply the founder's active skin before the first render (parchment == no-op).
    await loadActiveSkin();
    // Roster walks the registry — a central-only endpoint. Raids works in both.
    if(mode!=="central"){ const br=$("btnRoster"); if(br) br.style.display="none"; }

    if(mode==="central"){
      const path=location.pathname;
      const mm=path.match(/^\/r\/([a-z0-9-]+)$/);
      if(mm){
        VIEW="road";
        ROADMAP_ID=mm[1];
        API_PREFIX="/api/r/"+ROADMAP_ID;
        startRoad();
        return;
      }
      // "/" (or anything else the central server routed to index.html)
      VIEW="world-select";
      startWorldSelect();
      return;
    }

    // dir mode — exactly today's flow (plus the Sessions panel)
    VIEW="road";
    API_PREFIX="/api";
    startRoad();
  }

  // ---- go ----
  boot();
})();
</script>
