  function relatedDecisions(milestoneId){
    const ds=(state.decisions&&state.decisions.decisions)||[];
    return ds.filter(d=>Array.isArray(d.relatedMilestoneIds)&&d.relatedMilestoneIds.includes(milestoneId));
  }

  function itemCard(it){
    const kind=it.kind||"task";
    let h='<div class="card">';
    h+='<div class="ctop"><span class="kind '+esc(kind)+'">'+esc(KIND_LABEL[kind]||kind)+'</span>';
    h+='<span class="ctitle">'+esc(it.title||it.id)+'</span>'+pill(it.status||"open")+'</div>';
    const ibody=descSlot(it.plain,it.body);
    if(ibody) h+='<div class="body">'+ibody+'</div>';
    if(it.status==="blocked" && it.blockedReason) h+='<div class="reason">⛔ '+esc(it.blockedReason)+'</div>';
    // notes thread
    const notes=Array.isArray(it.notes)?it.notes:[];
    h+='<div class="notes">';
    if(notes.length===0) h+='<div class="empty">No notes yet. Leave one below — it goes to the agent when you press "Send to agent".</div>';
    for(const n of notes){
      const chip=(n.author==="founder" && n.pending===true) ? '<span class="qchip">waiting to send</span>' : '';
      h+='<div class="note"><span class="who '+esc(n.author||"agent")+'">'+esc(n.author||"agent")+'</span>'+chip
        +'<span class="ntext">'+mdlite(n.body)+'<div class="nts">'+fmtDateTime(n.ts)+'</div></span></div>';
    }
    h+='<div class="addnote"><textarea placeholder="Note to the agent…" data-note-for="'+esc(it.id)+'"></textarea>'
      +'<button class="btn" data-send-note="'+esc(it.id)+'">Send</button></div>';
    h+='</div>';
    h+=contestedBlock(it.id);
    h+='<div class="unclear-row">'+unclearBtn("item",it)+deleteBtn("item",it)+'</div>';
    h+='</div>';
    return h;
  }

  function decisionCard(d){
    const st=d.status||"proposed";
    let h='<div class="card">';
    h+='<div class="ctop"><span class="ctitle">'+esc(d.title||d.id)+'</span><span class="pill '+esc(st)+'">'+esc(st)+'</span></div>';
    // plain field for a decision replaces the whole rationale+impact block
    if(plainMode && typeof d.plain==="string" && d.plain.trim()){
      h+='<div class="body plain-swapped">'+mdlite(d.plain)+'</div>';
    } else {
      if(d.rationale) h+='<div class="body"><b>Why:</b> '+mdlite(d.rationale)+'</div>';
      if(d.impact) h+='<div class="body"><b>Impact:</b> '+mdlite(d.impact)+'</div>';
      if(plainMode && (d.rationale||d.impact)) h+='<div class="body">'+NOPLAIN+'</div>';
    }
    h+='<div class="meta">Proposed by <b>'+esc(d.proposedBy||"agent")+'</b></div>';
    // Approvals happen in chat and the agent records them; the log displays,
    // never solicits (RULING 1). A proposed decision is a standing action for
    // the founder to take in chat; approved/rejected show the recorded state.
    if(st==="proposed"){
      h+='<div class="standing">⚖ Standing decision — approve in chat</div>';
    } else if(st==="approved"){
      // dec-remove-decision-buttons: approved decisions show the recorded state
      // only — no walk-back buttons. Agents still record rulings through the API
      // (/api/decision/approve, MCP decision_set_approval) from chat.
      h+='<div class="meta">Approved · '+esc(fmtDateTime(d.approvedAt))+'</div>';
    } else if(st==="rejected"){
      h+='<div class="meta">Rejected — to approve later, say so in chat.</div>';
    }
    h+=contestedBlock(d.id);
    h+='<div class="unclear-row">'+unclearBtn("decision",d)+'</div>';
    h+='</div>';
    return h;
  }

  // ---- F2: "⊕ More horizons" + the pending-request chip -------------------
  function pendingHorizonRequest(msId){
    const sg=state.suggestions||{};
    const reqs=Array.isArray(sg.requests)?sg.requests:[];
    return reqs.find(r=>r && r.milestoneId===msId) || null;
  }
  // Counted from the RENDERED list, never the raw file: a fan tagged to a
  // doorway is drawn at a real milestone, and the drawer says so on both sides.
  function horizonCount(msId){
    return renderedSuggestions().filter(s=>s && s.frontierMilestoneId===msId).length;
  }
  function msTitle(id){
    const ms=(state.roadmap&&state.roadmap.milestones)||[];
    const m=ms.find(x=>x&&x.id===id);
    return (m && m.title) ? m.title : id;
  }
  function horizonRequestRow(m){
    const req=pendingHorizonRequest(m.id);
    const shown=renderedSuggestions();
    const n=shown.filter(s=>s && s.frontierMilestoneId===m.id).length;
    // where this milestone's own records ended up, and what arrived from a door
    const sg=state.suggestions||{};
    const raw=Array.isArray(sg.suggestions)?sg.suggestions:[];
    const rawHere=raw.filter(s=>s && s.frontierMilestoneId===m.id).length;
    const movedOut=shown.filter(s=>s && s.reanchoredFrom===m.id);
    const arrived=shown.filter(s=>s && s.frontierMilestoneId===m.id && s.reanchoredFrom);
    let h='<div class="btnrow">';
    h+='<button class="btn ghost" data-more-horizons="'+esc(m.id)+'">⊕ More horizons</button>';
    if(req) h+='<span class="qchip">requested '+esc(fmtDateTime(req.requestedAt))+'</span>';
    h+='</div>';
    h+='<div class="meta">'+(n
      ? (n+' possibilit'+(n===1?'y':'ies')+' hang off this milestone'
         +(arrived.length ? ' ('+arrived.length+' of them from behind the doorway “'
            +esc(msTitle(arrived[0].reanchoredFrom))+'”)' : '')
         +'. Asking again replaces them with a fresh set.')
      : 'Ask for a fan of possible next steps here — a few genuinely different directions, each with its own follow-ups.')
      +'</div>';
    if(movedOut.length){
      h+='<div class="meta">'+movedOut.length+' possibilit'+(movedOut.length===1?'y is':'ies are')
        +' recorded here but drawn at “'+esc(msTitle(movedOut[0].frontierMilestoneId))
        +'” — a doorway is not a frontier, so what is behind it hangs off the road it opens from.</div>';
    } else if(rawHere > n){
      h+='<div class="meta">'+(rawHere-n)+' recorded possibilit'+((rawHere-n)===1?'y has':'ies have')
        +' nowhere real to hang yet, so nothing is drawn for '+((rawHere-n)===1?'it':'them')+'.</div>';
    }
    return h;
  }
  // ---- F3: promote a side quest into its own road --------------------------
  function promoteRow(m, quest){
    if(!quest || quest.type!=="side") return '';
    const portal=portalCardFor(m.id);
    if(portal) return '';                       // already a doorway — see the portal card
    const ms=(state.roadmap&&state.roadmap.milestones)||[];
    const n=ms.filter(x=>x && x.questId===quest.id).length;
    let h='<div class="portal-sec">';
    h+='<div class="ctop"><span class="kind" style="background:var(--parch3)">⚔ Side quest</span> '
      +'<span class="psname">'+esc(quest.title||quest.id)+'</span></div>';
    h+='<div class="meta">Same goal stays inline; an own definition of done earns its own map. '
      +'Promote only when this branch has a finish line of its own — it becomes a road you can enter, '
      +'and this branch collapses to a single doorway here.</div>';
    // Promote and delete are the two ways a branch stops being a branch, so they
    // sit in the same row: one keeps the work and gives it a map of its own, the
    // other takes the whole branch off the road. Only a SIDE quest gets either.
    h+='<div class="btnrow"><button class="btn" data-promote="'+esc(quest.id)+'" data-promote-title="'+esc(quest.title||quest.id)
      +'" data-promote-n="'+n+'">⇗ Promote this side quest into its own road</button>'
      +deleteBtn("quest",quest)+'</div>';
    h+='</div>';
    return h;
  }

  function renderMilestoneBody(mid){
    const rm=state.roadmap||{};
    const m=(rm.milestones||[]).find(x=>x.id===mid);
    if(!m){ dtitle.textContent="Not found"; dbody.innerHTML='<div class="empty">This milestone no longer exists.</div>'; return; }
    const quest=(rm.quests||[]).find(q=>q.id===m.questId);
    const items=(rm.items||[]).filter(it=>it.milestoneId===mid).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const assets=(rm.assets||[]).filter(a=>a.milestoneId===mid);
    const decs=relatedDecisions(mid);

    dtitle.innerHTML=esc(m.title||m.id);
    let h="";
    h+='<div>'+pill(m.status||"locked")+' '+evidenceChips(m);
    if(quest) h+=' <span class="meta" style="display:inline">'+(quest.type==="side"?"⚔ ":"◆ ")+esc(quest.title||"")+'</span>';
    h+='</div>';
    // The two planes, said out loud, exactly once per card. STATUS is judged —
    // sessions and the founder write it, automation never does. CLAIMS COMPLETE
    // is derived from evidence at read time and stored nowhere.
    if(claimsComplete(m) && (m.status||"locked")!=="done"){
      h+='<div class="meta">A run claims this is finished; the status still says '
        +esc(STATUS_LABEL[m.status||"locked"]||m.status||"locked")
        +'. Evidence is a claim, not a verdict — marking it done stays your call.</div>';
    }
    h+=contestedBlock(m.id);
    h+='<div class="unclear-row">'+unclearBtn("milestone",m)+deleteBtn("milestone",m)+'</div>';
    h+='<div class="btnrow"><button class="btn ghost" data-chat-card="'+esc(m.id)+'" data-chat-title="'+esc(m.title||m.id)+'">\u{1F4AC} Chat about this card</button></div>';
    // F2 — commission a fresh horizon at THIS milestone (every card, including
    // the road-end). The server records the ask; an agent answers it through the
    // existing suggestions_upsert path, which clears the chip.
    h+=horizonRequestRow(m);
    // F3 — promote a side quest into its own road. The doctrine is the copy.
    h+=promoteRow(m, quest);
    if(m.status==="blocked" && m.statusReason) h+='<div class="reason">⛔ '+esc(m.statusReason)+'</div>';
    // portal section — this milestone is the doorway into a child road; the bar
    // mirrors that road's LIVE progress (single source of truth) with an in-app jump.
    if(MODE==="central" && Array.isArray(state.portals)){
      const p=state.portals.find(x=>x && x.milestoneId===mid && !x.milestoneMissing);
      if(p){
        const prog=(p.progress&&typeof p.progress==="object")?p.progress:{done:0,total:0};

          +'<span class="psname">'+esc(p.childName||p.childId)+'</span>'+(p.childMissing?'':(p.status?(' '+pill(p.status)):''))+'</div>';
        h+='<div class="meta">This milestone is a doorway into its own road. The bar mirrors that road’s live progress.</div>';
        if(p.childMissing){

        } else {
          h+='<div class="fbar"><span style="width:'+pct+'%"></span></div>';
          h+='<div class="world-prog-cap">'+(prog.done||0)+' / '+(prog.total||0)+' milestones on '+esc(p.childName||p.childId)+'</div>';
          // CONTEXT-1 — live mirrored status breakdown + the provenance stamp, so

          h+=breakdownChips(p.statusBreakdown);
          h+='<div class="world-prog-cap" style="font-style:italic">Live from '+esc(p.childName||p.sourceRoadId||p.childId)
            +' · as of '+(p.asOf?esc(fmtDate(p.asOf)):'unknown')+'</div>';
        }
        h+='<div class="btnrow"><a class="btn" href="/r/'+encodeURIComponent(p.childId)+'">Enter '+esc(p.childName||p.childId)+' →</a>';
        // F4 — open the child road inline, right here on this map.
        h+='<button class="btn ghost" data-expand-btn="'+esc(mid)+'">'
          +(isExpanded(mid)?'⊟ Collapse here':'⊞ Expand here')+'</button></div>';
        h+='<div class="meta">Expanding lays that road out inside this one and reflows everything below it — nothing is drawn over. Collapsing puts the view back exactly as it was.</div>';
        // F3 (reverse) — dissolve the child back inline.
        h+='<div class="btnrow"><button class="btn ghost" data-demote="'+esc(p.childId)+'" data-demote-name="'+esc(p.childName||p.childId)+'">⇙ Dissolve back into this road</button></div>';
        h+='<div class="meta">If it turned out to share this road’s definition of done, fold it back: its milestones return as a side quest here, the doorway disappears, and the family-tree link is removed. A road with children of its own cannot be dissolved.</div>';
        h+='</div>';
      }
    }
    const msum=descSlot(m.plain,m.summary);
    if(msum) h+='<div class="summary">'+msum+'</div>';
    const bits=[];
    if(m.eta) bits.push("ETA "+fmtDate(m.eta));
    if(m.startedAt) bits.push("Started "+fmtDate(m.startedAt));
    if(m.completedAt) bits.push("Done "+fmtDate(m.completedAt));
    if(bits.length) h+='<div class="meta">'+esc(bits.join("  ·  "))+'</div>';

    // STORY SO FAR — the one thing the card never showed: what actually happened
    // to this milestone, in time order. Every history event whose target is this
    // milestone, one of its items, or one of its decisions. This is the "micro
    // milestones it has been through" made literal, drawn from the audit trail
    // rather than restated by hand. Events are ordered by ts, never by file
    // position (history.jsonl is append-ordered — see dec-time-ordering).
    {
      const itemIds=new Set(items.map(it=>it.id));
      const decIds=new Set(decs.map(d=>d.id));
      const evs=(state.historyTail||[])
        .filter(e=>e && (e.targetId===mid || itemIds.has(e.targetId) || decIds.has(e.targetId)))
        .slice().sort((a,b)=>String(a.ts||"").localeCompare(String(b.ts||"")));
      h+='<div class="sechead">Story so far ('+evs.length+')</div>';
      if(evs.length===0){
        h+='<div class="empty">Nothing recorded for this stop inside the visible history window.</div>';
      }else{
        h+='<div class="story">';
        for(const e of evs){
          const isMs=e.targetId===mid;
          const isDec=decIds.has(e.targetId);
          const lane=isMs?"milestone":(isDec?"decision":"item");
          const st=(e.patch&&e.patch.status)||null;
          h+='<div class="story-ev">'
            +'<span class="story-dot" style="background:'+(st?itemDotColor(st):"var(--ink-faint)")+'"></span>'
            +'<div class="story-b">'
              +'<div class="story-top"><span class="story-lane '+lane+'">'+lane+'</span>'
              +'<span class="story-when">'+esc(fmtDateTime(e.ts)||"")+'</span></div>'
              +'<div class="story-sum">'+esc(e.summary||e.action||"")+'</div>'
            +'</div></div>';
        }
        h+='</div>';
        // Honest scope: historyTail is a WINDOW over history.jsonl, not the whole
        // file. Say so rather than let an empty-looking story read as "nothing
        // happened" when it may only mean "nothing inside the window".
        h+='<div class="meta">From the loaded history window — older events may exist beyond it.</div>';
      }
    }

    h+='<div class="sechead">Detail Items ('+items.length+')</div>';
    if(items.length===0) h+='<div class="empty">No items on this milestone yet.</div>';
    else h+=items.map(itemCard).join("");

    h+='<div class="sechead">Assets &amp; Resources ('+assets.length+')</div>';
    if(assets.length===0) h+='<div class="empty">No linked assets.</div>';
    else h+=assets.map(a=>'<div class="asset"><span class="aicon">'+(ASSET_ICON[a.kind]||"\u{1F4CE}")+'</span>'
      +'<div><div class="alabel">'+esc(a.label||a.ref)+'</div><div class="aref">'+esc(a.ref||"")+'</div></div></div>').join("");

    if(decs.length){
      h+='<div class="sechead">Related Decisions ('+decs.length+')</div>';
      h+=decs.map(decisionCard).join("");
    }
    // C2/C7 — the evidence ledger for this milestone, oldest first by TIMESTAMP.
    // Retracted entries are struck through, never removed: a withdrawal is a
    // tombstone, so the record of what was once claimed survives it.
    h+=evidenceSectionHTML(m);
    // Built by (archaeology) — lazily fetched provenance, rendered from cache if
    // already loaded so the poll refresh never re-fetches or flickers.
    h+='<div id="builtby-sec">'+builtBySectionHTML(mid)+'</div>';
    dbody.innerHTML=h;
    glossarize(dtitle); glossarize(dbody);
    wireDrawerActions();
    ensureBuiltBy(mid);
  }

  // ==================================================================
  // BUILT BY (archaeology) — who touched this milestone. Board-side session
  // provenance from /api/archaeology (a separate fetch, never /api/state),
  // optionally joined to real git commits. Cached per milestone id: the first
  // open fetches, later poll re-renders read the cache. refreshDrawer already
  // bails while a drawer textarea is focused, so this never clobbers typing.
  // ==================================================================
  let archCache={}, archErr={}, archPending={};
  function shortSid(id){ id=String(id||""); return id.length>14?id.slice(0,14)+"…":id; }
  function builtBySectionHTML(mid){
    if(archErr[mid]) return '<div class="sechead">Built by</div><div class="reason">⛔ '+esc(archErr[mid])+'</div>';
    const d=archCache[mid];
    if(!d) return '<div class="sechead">Built by</div><div class="empty">Digging up the history…</div>';
    const sess=Array.isArray(d.sessions)?d.sessions:[];
    const commits=Array.isArray(d.commits)?d.commits:null;
    let h='<div class="sechead">Built by ('+sess.length+')</div>';
    if(sess.length===0){
      h+='<div class="empty">No recorded sessions touched this milestone yet.</div>';
      return h;
    }
    const byS={};
    if(commits) for(const c of commits){ if(!c||!c.sessionId) continue; (byS[c.sessionId]=byS[c.sessionId]||[]).push(c); }
    for(const s of sess){
      const labeled=(typeof s.label==="string")&&s.label.trim();
      const disp=labeled?s.label:shortSid(s.sessionId);
      const ec=(typeof s.eventCount==="number")?s.eventCount:0;
      h+='<div class="builtby-row">';
      h+='<div class="bb-top">';
      h+='<span class="kind builtby-chip">'+esc(disp)+'<span class="bb-ec">'+ec+' event'+(ec===1?'':'s')+'</span></span>';
      const df=fmtDate(s.firstSeen), dl=fmtDate(s.lastSeen);
      h+='<span class="bb-dates">'+esc(df===dl?df:(df+' – '+dl))+'</span>';
      h+='</div>';
      const cs=byS[s.sessionId]||[];
      if(cs.length){
        h+='<div class="bb-commits">';
        for(const c of cs){
          const hash=String(c.hash||"").slice(0,7);
          const tip=(c.subject||"")+(c.repo?('  ·  '+c.repo):'');
          h+='<span class="bb-commit" title="'+esc(tip)+'">'+esc(hash)+'</span>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
    return h;
  }
  async function ensureBuiltBy(mid){
    if(!mid || archCache[mid] || archPending[mid]) return;
    archPending[mid]=true; delete archErr[mid];
    try{
      const url="/api/archaeology/"+encodeURIComponent(ROADMAP_ID||"dir")+"/"+encodeURIComponent(mid);
      archCache[mid]=await api(url);
    }catch(err){ archErr[mid]=err&&err.message?err.message:"could not load history"; }
    finally{ archPending[mid]=false; patchBuiltBy(mid); }
  }
  function patchBuiltBy(mid){
    // only patch if the drawer still shows this same milestone
    if(!sel || sel.mode!=="milestone" || sel.id!==mid) return;
    const c=document.getElementById("builtby-sec");
    if(!c) return;
    c.innerHTML=builtBySectionHTML(mid);
    glossarize(c);
  }

  function renderDecisionsBody(){
    const ds=(state.decisions&&state.decisions.decisions)||[];
    dtitle.textContent="Decision Log";
    let h='<div class="meta">The agent proposes; you approve in chat. This log records what was decided — nothing here needs clicking.</div>';
    if(ds.length===0) h+='<div class="empty">No decisions logged yet.</div>';
    else {
      const order={proposed:0,approved:1,rejected:2,superseded:3};
      const sorted=ds.slice().sort((a,b)=>(order[a.status]||9)-(order[b.status]||9) || String(b.ts).localeCompare(String(a.ts)));
      h+=sorted.map(decisionCard).join("");
    }
    dbody.innerHTML=h;
    glossarize(dbody);
    wireDrawerActions();
  }

  function renderTimelineBody(){
    const ev=(state.historyTail||[]).slice().reverse();
    dtitle.textContent="Recent Timeline";
    let h='<div class="timeline">';
    if(ev.length===0) h+='<div class="empty">No activity recorded yet.</div>';
    for(const e of ev){
      h+='<div class="tl"><span class="dot"></span><div><div><span class="who">'+esc(e.actor||"system")+'</span> — '+esc(e.summary||e.action||"")+'</div>'
        +'<div class="tts">'+fmtDateTime(e.ts)+' · '+esc(e.source||"")+'</div></div></div>';
    }
    h+='</div>';
    dbody.innerHTML=h;
    glossarize(dbody);
  }

  function renderSessionsBody(){
    dtitle.textContent="Contributing Sessions";
    // Central mode aggregates self + every descendant road (deduped, per-road
    // attributed, server-sorted lastSeenAt DESC); dir mode shows own sessions.
    const agg=(MODE==="central" && state && state.fullStory && Array.isArray(state.fullStory.sessions));
    const sess=agg
      ? state.fullStory.sessions.slice()
      : ((state && state.sessions && Array.isArray(state.sessions.sessions)) ? state.sessions.sessions.slice() : []);
    let h='<div class="meta">'+(agg
      ? 'Every AI work session across this road and everything branching off it.'
      : 'AI work sessions that have written to this road.')+'</div>';
    if(sess.length===0){
      h+='<div class="empty">No AI sessions recorded yet.</div>';
      dbody.innerHTML=h; return;
    }
    if(!agg) sess.sort((a,b)=>String(b.lastSeenAt||"").localeCompare(String(a.lastSeenAt||"")));
    for(const s of sess){
      const labeled=(typeof s.label==="string") && s.label.trim();
      const ec=(typeof s.eventCount==="number") ? s.eventCount : 0;
      h+='<div class="card">';
      h+='<div class="ctitle'+(labeled?'':' unlabeled')+'">'+(labeled?esc(s.label):'unlabeled session')+'</div>';
      h+='<div class="session-id">'+esc(s.id)+'</div>';
      h+='<div class="meta">First seen '+esc(fmtDateTime(s.firstSeenAt))+' · Last seen '+esc(fmtDateTime(s.lastSeenAt))
        +' · '+ec+' event'+(ec===1?'':'s')+'</div>';
      if(agg && Array.isArray(s.roads) && s.roads.length){
        h+='<div class="sess-roads">';
        for(const rd of s.roads){
          const me=(rd.id===ROADMAP_ID);
          const rec=(typeof rd.eventCount==="number")?rd.eventCount:0;
          h+='<span class="sess-road'+(me?' me':'')+'">'+esc(rd.name||rd.id)+' · '+rec+'</span>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
    dbody.innerHTML=h;
  }

  // ==================================================================
  // RAIDS (§4) — read-only view of subagent workflow parties. Data comes
  // from /api/raids (5s-memoized server scan), not the state poll; the
  // drawer refresh re-fetches so a running raid stays live.
  // ==================================================================
  // Distillery (§3): the Raids drawer gains a Completed tab. "Afoot" shows live
  // raids; "Completed" shows status==="done" workflows, each with a Distill
  // button → POST /api/distill (dry-run by default: prints the exact command,
  // spawns nothing). raidsTab persists across the drawer's live refresh.
  let raidsTab = "afoot";
  function raidCardHTML(r, completed){
    const st=r.status||"stalled";
    const started=(typeof r.agentsStarted==="number")?r.agentsStarted:0;
    const done=(typeof r.agentsDone==="number")?r.agentsDone:0;
    const pct=started>0?Math.round(Math.min(done,started)/started*100):0;
    let h='<div class="card raid-card">';
    h+='<div class="ctop"><span class="kind" style="background:var(--gold);color:var(--ink-on-gold);border-color:var(--gold-deep)">'
      +(completed?'⚗ Workflow':'⚔ Raid')+'</span>'
      +'<span class="ctitle">'+esc(r.name||r.id)+'</span>'
      +'<span class="pill '+esc(st)+'">'+esc(RAID_STATUS_LABEL[st]||st)+'</span>'
      // §3 / C1 — DETECTION, never prevention. questlog cannot gate a workflow
      // Claude Code launched; it can only notice that the run named nothing. The
      // word is "unlinked". It is never "blocked", because nothing was blocked.
      +(r.linked==="unlinked"?'<span class="pill unlinked" title="Detected, not prevented — questlog cannot gate a workflow it did not launch.">⚠ unlinked</span>':'')
      +(r.linked==="chore"?'<span class="evchip soft" title="This run declared itself a chore: tooling work, not road work. Counted in today’s coverage line.">chore</span>':'')
      +(r.linked==="milestone"?'<span class="evchip soft" title="This run named a milestone that resolves on a road here.">◈ '+esc(r.milestoneId||"linked")+'</span>':'')
      +'</div>';
    if(r.linked==="unlinked"){
      h+='<div class="meta">This workflow named no milestone and no chore flag.</div>';
    }
    if(r.description) h+='<div class="raid-desc">'+esc(r.description)+'</div>';
    const phases=Array.isArray(r.phases)?r.phases:[];
    if(phases.length){
      h+='<div class="raid-phases">';
      for(const p of phases){
        h+='<span class="raid-phase">'+esc(p.title||"phase")
          +(p.model?'<span class="rp-model">'+esc(p.model)+'</span>':'')+'</span>';
      }
      h+='</div>';
    } else if(r.phasesTotal){
      h+='<div class="meta">'+r.phasesTotal+' phase'+(r.phasesTotal===1?'':'s')+'</div>';
    }
    h+='<div class="raid-bar"><span style="width:'+pct+'%"></span></div>';
    h+='<div class="meta"><b>'+done+'</b> of <b>'+started+'</b> agents returned</div>';
    h+='<div class="raid-foot"><span>'+(r.startedAt?('Set out '+esc(fmtDateTime(r.startedAt))):'')+'</span>'
      +'<span>'+(r.lastActivityAt?('active '+esc(fmtAge(r.lastActivityAt))):'')+'</span></div>';
    if(r.taskId) h+='<div class="raid-dir">task '+esc(r.taskId)+'</div>';
    if(completed){
      h+='<div class="btnrow"><button class="btn ghost sm" data-distill="'+esc(r.id)+'">⚗ Distill (for recurring patterns)</button></div>';
      h+='<div class="distill-mount" data-distill-mount="'+esc(r.id)+'"></div>';
    }
    h+='</div>';
    return h;
  }
  async function renderRaidsBody(){
    dtitle.textContent="Raids";
    let data;
    try{ data=await api("/api/raids"); }
    catch(err){ dbody.innerHTML='<div class="reason">⛔ Could not read the raids: '+esc(err.message)+'</div>'; return; }
    const raids=(data && Array.isArray(data.raids))?data.raids:[];
    let h='';
    if(data && data.enabled===false){
      h+='<div class="meta">Live subagent expeditions — parallel workflow runs across your projects. Read-only.</div>';
      h+='<div class="empty">Raids are switched off. Turn them on in Settings.</div>';
      dbody.innerHTML=h; return;
    }
    const afoot=raids.filter(r=>r.status!=="done");
    const done=raids.filter(r=>r.status==="done");
    // C7 — the coverage declaration, in the drawer header where the raids it
    // counts are listed. Served by /api/raids alongside the scan it came from.
    h+=coverageLineHTML(data && data.coverage);
    const unl=raids.filter(r=>r.linked==="unlinked").length;
    if(unl) h+='<div class="meta">'+unl+' of these named no milestone and no chore flag. questlog noticed them; it cannot stop a workflow it did not launch.</div>';
    h+='<div class="tabs">'
      +'<button class="tab'+(raidsTab==="afoot"?" on":"")+'" data-raidtab="afoot">Afoot ('+afoot.length+')</button>'
      +'<button class="tab'+(raidsTab==="completed"?" on":"")+'" data-raidtab="completed">Completed ('+done.length+')</button>'
      +'</div>';
    if(raidsTab==="completed"){
      h+='<div class="meta">Finished workflows on this machine. <b>Distill</b> reads the run’s script + journal and drafts a reusable SKILL.md into <code>distillery-drafts\\</code> — a dry-run by default (prints the exact command, installs nothing).</div>';
      h+='<div class="meta distill-caption">Distillation is curation — for patterns you notice recurring. Most workflows should not become skills.</div>';
      if(done.length===0) h+='<div class="empty">No completed workflows yet.</div>';
      else for(const r of done) h+=raidCardHTML(r, true);
    } else {
      h+='<div class="meta">Live subagent expeditions — parallel workflow runs across your projects. Read-only; nothing here is ever changed.</div>';
      if(afoot.length===0) h+='<div class="empty">No raids afoot. When a workflow sends out a party of subagents, it musters here.</div>';
      else for(const r of afoot) h+=raidCardHTML(r, false);
    }
    dbody.innerHTML=h; glossarize(dbody);
    wireRaidsActions();
  }
  function wireRaidsActions(){
    dbody.querySelectorAll("[data-raidtab]").forEach(b=>b.addEventListener("click",()=>{
      raidsTab=b.getAttribute("data-raidtab"); renderRaidsBody();
    }));
    dbody.querySelectorAll("[data-distill]").forEach(b=>b.addEventListener("click", async ()=>{
      const id=b.getAttribute("data-distill");
      const mount=dbody.querySelector('[data-distill-mount="'+CSS.escape(id)+'"]');
      b.disabled=true; const o=b.textContent; b.textContent="Distilling…";
      try{
        const resp=await api("/api/distill",{method:"POST",body:JSON.stringify({id})});
        if(mount) mount.innerHTML=distillOutHTML(resp);
      }catch(err){
        if(mount) mount.innerHTML='<div class="reason">⛔ '+esc(err.message)+'</div>';
      }finally{ b.disabled=false; b.textContent=o; }
    }));
  }
  function distillOutHTML(resp){
    if(!resp) return '<div class="reason">⛔ No response.</div>';
    if(resp.dryRun){
      let h='<div class="distill-out"><div class="do-head">Dry run — nothing was spawned</div>';
      h+='<div class="do-cmd">'+esc(resp.command||"")+'</div>';
      const inp=resp.inputs||{};
      if(inp.outPath) h+='<div class="do-path">draft would be written to: '+esc(inp.outPath)+'</div>';
      if(inp.scriptPath) h+='<div class="do-path">script: '+esc(inp.scriptPath)+'</div>';
      if(inp.journalPath) h+='<div class="do-path">journal: '+esc(inp.journalPath)+'</div>';
      h+='<div class="do-note">Live distillation is off (<code>distillery.live</code>). This command was logged for the founder to audit; enable live mode in Settings to actually produce a draft.</div>';
      h+='</div>';
      return h;
    }
    // live result
    let h='<div class="distill-out"><div class="do-head">'+(resp.ok?"Draft written":"Distillation failed")+'</div>';
    if(resp.outPath) h+='<div class="do-path">'+esc(resp.outPath)+'</div>';
    if(resp.message) h+='<div class="do-note">'+esc(resp.message)+'</div>';
    h+='<div class="do-note">UNREVIEWED draft — machine-distilled. Review before installing; nothing was added to any skills folder.</div>';
    h+='</div>';
    return h;
  }
  function openRaids(){
    sel={mode:"raids"};
    dtitle.textContent="Raids";
    dbody.innerHTML='<div class="empty">Scouting for raids…</div>';
    openDrawer(); renderRaidsBody();
  }

  // ==================================================================
  // TASK BOARD (§4) — queued work for agents. Founder adds/approves/removes;
  // agents may add with approvedAt:null (ineligible until a founder approves).
  // Reads GET /api/taskboard; mutates via POST { op }. When taskboard.enabled
  // is off the board still shows and edits — only auto-eligibility is dormant.
  // ==================================================================
  async function renderBoardBody(){
    dtitle.textContent="Task Board";
    let data;
    try{ data=await api("/api/taskboard"); }
    catch(err){ dbody.innerHTML='<div class="reason">⛔ Could not read the board: '+esc(err.message)+'</div>'; return; }
    const items=(data && Array.isArray(data.items))?data.items:[];
    const eligible=new Set((data && Array.isArray(data.eligible))?data.eligible:[]);
    const enabled=!!(data && data.enabled);
    const win=(data && data.capacityWindow)||{};
    let h='<div class="meta">Work queued for background agents. A card is only picked up when <b>you approve it</b> and automation is on.</div>';
    h+='<div class="tb-cap">Automation is <b>'+(enabled?'on':'off')+'</b>.'
      +(win && typeof win.startHour==="number"?(' Capacity window '+win.startHour+':00–'+win.endHour+':00, up to '+(win.maxTokens||0).toLocaleString()+' tokens.'):'')
      +(enabled?'':' While off, cards sit here and nothing runs — turn it on in Settings.')+'</div>';
    // Add form (founder)
    h+='<div class="tb-add">'
      +'<div class="lab" style="font-weight:700;font-size:13px">Add a task</div>'
      +'<input id="tb-title" placeholder="Short title">'
      +'<textarea id="tb-brief" placeholder="Brief — what the agent should do"></textarea>'
      +'<input id="tb-est" type="number" min="0" step="1000" placeholder="Estimated tokens (optional)">'
      +'<div class="skin-actions"><button class="btn" id="tb-add-approved">Add &amp; approve</button>'
      +'<button class="btn ghost" id="tb-add-pending">Add for later</button>'
      +'<span class="set-msg" id="tb-msg"></span></div>'
      +'<div class="skin-hint">“Add &amp; approve” stamps it approved now (eligible). “Add for later” queues it awaiting your approval.</div>'
      +'</div>';
    if(items.length===0) h+='<div class="empty">The queue is empty.</div>';
    for(const it of items){
      const awaiting=!it.approvedAt;
      const isEligible=eligible.has(it.id);
      const flag=awaiting?'<span class="tb-flag awaiting">awaiting founder approval</span>'
        :(isEligible?'<span class="tb-flag eligible">eligible</span>'
          :'<span class="tb-flag ineligible">approved · '+(enabled?'outside window/queue':'automation off')+'</span>');
      h+='<div class="tb-item'+(awaiting?' awaiting':'')+'">';
      h+='<div class="tb-top"><span class="tb-title">'+esc(it.title||it.id)+'</span>'
        +'<span class="pill '+esc(it.status||"queued")+'">'+esc(it.status||"queued")+'</span>'+flag+'</div>';
      if(it.brief) h+='<div class="tb-brief">'+esc(it.brief)+'</div>';
      h+='<div class="tb-meta">';
      if(typeof it.estTokens==="number" && it.estTokens>0) h+='<span>~'+it.estTokens.toLocaleString()+' tokens</span>';
      if(it.approvedAt) h+='<span>approved '+esc(fmtDateTime(it.approvedAt))+'</span>';
      h+='<span class="tb-id" style="font-family:Consolas,monospace">'+esc(it.id)+'</span>';
      h+='</div>';
      h+='<div class="skin-actions">';
      if(awaiting) h+='<button class="btn" data-tb-approve="'+esc(it.id)+'">Approve</button>';
      h+='<button class="btn ghost" data-tb-remove="'+esc(it.id)+'">Remove</button>';
      h+='</div>';
      h+='</div>';
    }
    dbody.innerHTML=h; glossarize(dbody);
    wireBoardActions();
  }
  function wireBoardActions(){
    const addWith=async (by)=>{
      const msg=$("tb-msg");
      const title=($("tb-title").value||"").trim();
      const brief=($("tb-brief").value||"").trim();
      const est=parseInt(($("tb-est").value||"").trim(),10);
      if(!title){ if(msg){ msg.className="set-msg err"; msg.textContent="A title is required."; } return; }
      const item={title, brief};
      if(Number.isFinite(est) && est>0) item.estTokens=est;
      try{
        await api("/api/taskboard",{method:"POST",body:JSON.stringify({op:"add",by,item})});
        renderBoardBody();
      }catch(err){ if(msg){ msg.className="set-msg err"; msg.textContent="Could not add: "+err.message; } }
    };
    const ap=$("tb-add-approved"); if(ap) ap.addEventListener("click",()=>addWith("founder"));
    const pl=$("tb-add-pending");  if(pl) pl.addEventListener("click",()=>addWith("agent"));
    dbody.querySelectorAll("[data-tb-approve]").forEach(b=>b.addEventListener("click", async ()=>{
      b.disabled=true;
      try{ await api("/api/taskboard",{method:"POST",body:JSON.stringify({op:"approve",id:b.getAttribute("data-tb-approve")})}); renderBoardBody(); }
      catch(err){ b.disabled=false; alert("Could not approve: "+err.message); }
    }));
    dbody.querySelectorAll("[data-tb-remove]").forEach(b=>b.addEventListener("click", async ()=>{
      if(!confirm("Remove this task from the board?")) return;
      b.disabled=true;
      try{ await api("/api/taskboard",{method:"POST",body:JSON.stringify({op:"remove",id:b.getAttribute("data-tb-remove")})}); renderBoardBody(); }
      catch(err){ b.disabled=false; alert("Could not remove: "+err.message); }
    }));
  }
  function openBoard(){
    sel={mode:"board"};
    dtitle.textContent="Task Board";
    dbody.innerHTML='<div class="empty">Reading the board…</div>';
    openDrawer(); renderBoardBody();
  }

  // ==================================================================
  // ROSTER (§5) — every road's session ledger, grouped by project, with a
  // derived status token, focus, last-pulse age, a copy-paste resume
  // command (always), and a spawn button gated by roster.allowSpawn.
  // ==================================================================
  async function renderRosterBody(){
    dtitle.textContent="Session Roster";
    let data, cfg=null, raidData=null;
    try{
      // The coverage line rides along tolerantly: raids may be switched off, and
      // a missing coverage number must never cost the founder the roster.
      [data, cfg, raidData] = await Promise.all([
        api("/api/sessions"),
        api("/api/config").catch(()=>null),
        api("/api/raids").catch(()=>null),
      ]);
    }catch(err){ dbody.innerHTML='<div class="reason">⛔ Could not muster the roster: '+esc(err.message)+'</div>'; return; }
    const allowSpawn=!!(cfg && cfg.config && cfg.config.roster && cfg.config.roster.allowSpawn);
    const projects=(data && Array.isArray(data.projects))?data.projects:[];
    let h='<div class="meta">Every AI work session across your roads — who is active, what they are on, and how to pick the thread back up.</div>';
    h+=coverageLineHTML(raidData && raidData.coverage);
    const anySessions=projects.some(p=>Array.isArray(p.sessions)&&p.sessions.length);
    if(!anySessions){
      h+='<div class="empty">No AI sessions on any road yet.</div>';
      dbody.innerHTML=h; return;
    }
    for(const proj of projects){
      const ss=Array.isArray(proj.sessions)?proj.sessions:[];
      if(!ss.length) continue;
      h+='<div class="sechead">'+esc(proj.name||proj.roadmapId)+' ('+ss.length+')</div>';
      for(const s of ss){
        const st=s.status||"idle";
        const labeled=(typeof s.label==="string")&&s.label.trim();
        const ec=(typeof s.eventCount==="number")?s.eventCount:0;
        // Lineage: children sit indented under their parent with a branch glyph.
        const depth=(typeof s.depth==="number" && s.depth>0)?Math.min(s.depth,3):0;
        const bw=(typeof s.briefsWaiting==="number")?s.briefsWaiting:0;
        h+='<div class="roster-token'+(depth?(' child'+(depth>1?(' d'+depth):'')):'')+'">';
        h+='<span class="rt-dot" style="background:'+(ROSTER_DOT[st]||"var(--st-locked)")+'"></span>';
        h+='<div class="rt-body">';
        h+='<div class="ctop" style="gap:7px">'
          +(depth?'<span class="rt-lineage" title="branched from '+esc(s.parentSessionId||"")+'">⑂</span>':'')
          +'<span class="rt-label'+(labeled?'':' unlabeled')+'">'
          +(labeled?esc(s.label):'unlabeled session')+'</span>'
          +'<span class="pill '+esc(st)+'">'+esc(ROSTER_STATUS_LABEL[st]||st)+'</span>'
          +(bw?'<span class="cd-briefchip" title="Feature briefs handed to this session, still open">✎ '+bw+' brief'+(bw===1?'':'s')+' waiting</span>':'')
          +'</div>';
        h+='<div class="session-id">'+esc(s.id)+'</div>';
        if(s.focus) h+='<div class="rt-focus">'+esc(s.focus)+(s.lastPulse?(' · '+esc(fmtAge(s.lastPulse))):'')+'</div>';
        else if(s.lastPulse) h+='<div class="rt-focus">last pulse '+esc(fmtAge(s.lastPulse))+'</div>';
        h+='<div class="meta">Last seen '+esc(fmtDateTime(s.lastSeenAt))+' · '+ec+' event'+(ec===1?'':'s')+'</div>';
        h+='<div class="roster-resume">';
        h+='<button class="btn" data-copy-resume="'+esc(s.resumeCommand||"")+'">Copy command — paste into a terminal to reopen</button>';
        // Branch works for ANY session in the ledger, chat or terminal: forking
        // only needs --resume <id> in the road's folder.
        h+='<button class="btn" data-branch-road="'+esc(proj.roadmapId)+'" data-branch-sess="'+esc(s.id)+'"'
          +' data-branch-label="'+esc(labeled?s.label:s.id)+'"'
          +' title="Start a new chat that carries this session’s whole conversation with it">⑂ Branch into a chat</button>';
        if(allowSpawn){
          h+='<label class="roster-auto"><input type="checkbox" data-auto-for="'+esc(s.id)+'"> autonomy</label>';
          h+='<button class="btn" data-spawn-road="'+esc(proj.roadmapId)+'" data-spawn-sess="'+esc(s.id)+'">Open in a terminal ▸</button>';
        } else {
          h+='<button class="btn" disabled title="Turn on “Let me open sessions” in Settings">Open in a terminal ▸</button>';
        }
        h+='</div>';
        if(!allowSpawn) h+='<div class="roster-hint">Opening a session from here is switched off. The copy command still works — paste it into a terminal.</div>';
        h+='</div></div>';
      }
    }
    dbody.innerHTML=h; glossarize(dbody);
    wireRosterActions();
  }
  function wireRosterActions(){
    dbody.querySelectorAll("[data-copy-resume]").forEach(b=>b.addEventListener("click", async ()=>{
      const cmd=b.getAttribute("data-copy-resume")||"";
      let ok=false;
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(cmd); ok=true; } }catch{ ok=false; }
      if(ok){ const o=b.textContent; b.textContent="Copied ✓"; setTimeout(()=>{ b.textContent=o; },1400); }
      else { window.prompt("Copy this resume command:", cmd); }
    }));
    dbody.querySelectorAll("[data-branch-road]").forEach(b=>b.addEventListener("click", ()=>{
      openChatCreate({
        roadId:b.getAttribute("data-branch-road"),
        branchFromSessionId:b.getAttribute("data-branch-sess"),
        branchLabel:b.getAttribute("data-branch-label")||"",
      });
    }));
    dbody.querySelectorAll("[data-spawn-road]").forEach(b=>b.addEventListener("click", async ()=>{
      const roadmapId=b.getAttribute("data-spawn-road");
      const sessionId=b.getAttribute("data-spawn-sess");
      const auto=dbody.querySelector('input[data-auto-for="'+CSS.escape(sessionId)+'"]');
      const autonomy=!!(auto && auto.checked);
      b.disabled=true; const o=b.textContent; b.textContent="Opening…";
      try{
        await api("/api/sessions/resume",{method:"POST",body:JSON.stringify({roadmapId,sessionId,autonomy})});
        b.textContent="Opened ✓"; setTimeout(()=>{ b.textContent=o; b.disabled=false; },1600);
      }catch(err){
        b.disabled=false; b.textContent=o;
        if(err.code==="E_SPAWN_DISABLED"){ alert("Opening sessions is switched off. Enable it in Settings — the copy command still works."); }
        else alert("Could not open the session: "+err.message);
      }
    }));
  }
  function openRoster(){
    sel={mode:"roster"};
    dtitle.textContent="Session Roster";
    dbody.innerHTML='<div class="empty">Mustering the roster…</div>';
    openDrawer(); renderRosterBody();
  }

  function openPin(pinId){

    else h+='<div class="empty" style="margin-top:12px">Synthesis document not produced yet.</div>';
